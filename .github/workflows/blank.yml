name: Kernel CI - Motorola One 5G Ace (Kiev)

on:
  workflow_dispatch:

env:
  DEVICE: kiev
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 10G
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260726/boot.img

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: test-sukisu
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang llvm lld \
            ccache curl git zip unzip \
            python3 device-tree-compiler

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-${{ env.DEVICE }}-ccache
          restore-keys: |
            ${{ runner.os }}-${{ env.DEVICE }}

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/ccache
          ccache --set-config=max_size=${{ env.CCACHE_SIZE }}
          ccache -z

      - name: Download stock boot image
        run: |
          set -e
          curl -L --fail \
            -o boot-stock.img \
            "${{ env.BOOT_URL }}"

      - name: Clone kernel source
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm8250.git \
            "${{ env.KERNEL_PATH }}"

      - name: Clone Copilote repository
        run: |
          git clone \
            --depth=1 \
            --branch test-sukisu \
            https://github.com/Albanel22/Copilote.git \
            temp_copilote

      - name: Prepare ReSuKiSU / SUSFS
        shell: bash
        run: |
          set -euo pipefail

          KERNEL="${{ env.KERNEL_PATH }}"
          REPO="../temp_copilote"

          echo "===> Checking required files"

          test -f temp_copilote/susfs.c
          test -f temp_copilote/susfs.h
          test -f temp_copilote/50_add_susfs_in_kernel-4.19.patch
          test -f temp_copilote/10_enable_susfs_for_ksu.patch

          echo "===> Copy SUSFS sources"

          mkdir -p "$KERNEL/include/linux"

          cp temp_copilote/susfs.c "$KERNEL/fs/"
          cp temp_copilote/susfs.h "$KERNEL/include/linux/"

          sed -i 's/\r$//' temp_copilote/*.patch

          cd "$KERNEL"

          echo "===> Apply SUSFS kernel patch"

          # On tente d'appliquer le patch (si fs/open.c échoue car déjà présent, on l'autorise)
          if ! patch -p1 --forward --fuzz=3 < ../temp_copilote/50_add_susfs_in_kernel-4.19.patch; then
              if [ -f fs/open.c.rej ]; then
                  echo "::notice::fs/open.c already patched, ignoring rejection."
                  rm -f fs/open.c.rej
              fi
              # Si d'autres fichiers ont de vrais rejets bloquants, on s'arrête
              if ls *.rej fs/*.rej fs/*/*.rej mm/*.rej kernel/*.rej drivers/*.rej 2>/dev/null | grep -q .; then
                  echo "::error::Critical patch rejections found!"
                  exit 1
              fi
          fi
          
      - name: Apply kernel defconfig
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG_DST="${{ env.KERNEL_PATH }}/arch/arm64/configs/vendor/${{ env.DEFCONFIG }}"

          if [ ! -f "kiev_perfect_defconfig" ]; then
            echo "::error::kiev_perfect_defconfig not found"
            exit 1
          fi

          cp -f kiev_perfect_defconfig "${DEFCONFIG_DST}"

      - name: Apply KernelSU compatibility fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ env.KERNEL_PATH }}"

          if [ -f drivers/kernelsu/core/init.c ]; then
            sed -i \
            '/MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);/d' \
            drivers/kernelsu/core/init.c
          fi

      - name: Disable unsupported KernelSU features (Kernel 4.19)
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ env.KERNEL_PATH }}"

          disable_module() {
              FILE="$1"
              MAKEFILE="$2"
              OBJ="$3"

              if [ -f "$FILE" ]; then
                  echo "Disabling $OBJ"

                  rm -f "$FILE"
                  touch "$FILE"

                  if [ -f "$MAKEFILE" ]; then
                      sed -i "/${OBJ}/d" "$MAKEFILE"
                  fi
              fi
          }

          disable_module \
              drivers/kernelsu/feature/selinux_hide.c \
              drivers/kernelsu/feature/Makefile \
              selinux_hide.o

          disable_module \
              drivers/kernelsu/infra/file_wrapper.c \
              drivers/kernelsu/infra/Makefile \
              file_wrapper.o

          disable_module \
              drivers/kernelsu/infra/seccomp_cache.c \
              drivers/kernelsu/infra/Makefile \
              seccomp_cache.o

          disable_module \
              drivers/kernelsu/infra/su_mount_ns.c \
              drivers/kernelsu/infra/Makefile \
              su_mount_ns.o

          if [ -f drivers/kernelsu/Makefile ]; then
              sed -i '/selinux_hide.o/d' drivers/kernelsu/Makefile || true
              sed -i '/file_wrapper.o/d' drivers/kernelsu/Makefile || true
          fi

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ env.KERNEL_PATH }}"

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CCACHE_DIR="$HOME/.cache/ccache"

          mkdir -p "${{ env.BUILD_DIR }}"

          make O="${{ env.BUILD_DIR }}" vendor/${{ env.DEFCONFIG }}

          make \
            -j"$(nproc)" \
            O="${{ env.BUILD_DIR }}" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image Image.gz modules dtbs \
            2>&1 | tee build.log

          ccache -s

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/kernel-su/AnyKernel3.git \
            anykernel

          rm -rf anykernel/.git

          # Copier le noyau compilé
          if [ -f "${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image.gz" ]; then
              cp "${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image.gz" anykernel/Image.gz
          elif [ -f "${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image" ]; then
              cp "${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image" anykernel/Image
          else
              echo "::error::Kernel image not found"
              exit 1
          fi

          # Intégrer le boot stock pour garantir une structure valide
          cp boot-stock.img anykernel/boot.img

          # Copier les modules .ko
          mkdir -p anykernel/modules/system/lib/modules
          find "${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}" \
              -name "*.ko" \
              -exec cp {} anykernel/modules/system/lib/modules/ \;

          # Forcer le chemin de partition direct pour Motorola
          sed -i 's|block=boot;|block=/dev/block/bootdevice/by-name/boot;|g' anykernel/anykernel.sh || true
          
          if ! grep -q "block=/dev/block/bootdevice/by-name/boot" anykernel/anykernel.sh; then
              sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|g' anykernel/anykernel.sh || true
          fi

          cd anykernel
          zip -r9 ../ReSukiSU-AnyKernel3-kiev.zip .
          cp boot.img ../boot-final.img
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReSukiSU-Kiev-Output
          path: |
            ReSukiSU-AnyKernel3-kiev.zip
            boot-final.img
            kernel_src/build.log
            kernel_src/out/arch/arm64/boot/Image
            kernel_src/out/arch/arm64/boot/Image.gz
            kernel_src/out/**/*.ko
            kernel_src/out/**/*.dtb
            kernel_src/out/**/*.dtbo
