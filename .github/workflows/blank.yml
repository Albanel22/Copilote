name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: LineageOS/android_kernel_motorola_sm8250
  KERNEL_BRANCH: lineage-23.2

  KERNEL_PATH: kernel_src
  BUILD_DIR: out

  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

jobs:
  build:
    name: Build ReSukiSU + SuSFS 4.19
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout kernel
      # ==========================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: ${{ env.KERNEL_PATH }}
          fetch-depth: 1

      # ==========================================================
      # 2. Install dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            device-tree-compiler

      # ==========================================================
      # 3. Verify kernel version
      # ==========================================================
      - name: Verify kernel version
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          VERSION="$(sed -n 's/^VERSION = //p' Makefile | head -1)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -1)"

          echo "=========================================="
          echo "Kernel version"
          echo "=========================================="
          echo "${VERSION}.${PATCHLEVEL}"

          test "${VERSION}" = "4"
          test "${PATCHLEVEL}" = "19"

      # ==========================================================
      # 4. Fetch JackA1ltman tools
      # ==========================================================
      - name: Fetch NonGKI tools
        run: |
          set -eux

          rm -rf non_gki_tools

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            non_gki_tools

          echo "Checking JackA1ltman files..."

          test -f \
            non_gki_tools/Bin/clean_hook.sh

          test -f \
            non_gki_tools/Patches/susfs_inline_hook_patches.sh

          test -f \
            non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch

          echo
          echo "JackA1ltman tools verified."

      # ==========================================================
      # 5. Clean previous KernelSU integration
      # ==========================================================
      - name: Clean previous KernelSU integration
        run: |
          set -eux

          if [ -d "${KERNEL_PATH}/KernelSU" ]; then

            echo "Existing KernelSU tree detected."
            echo "Running clean_hook.sh."

            cp \
              non_gki_tools/Bin/clean_hook.sh \
              "${KERNEL_PATH}/clean_hook.sh"

            chmod +x \
              "${KERNEL_PATH}/clean_hook.sh"

            (
              cd "${KERNEL_PATH}"
              bash ./clean_hook.sh
            )

            rm -f \
              "${KERNEL_PATH}/clean_hook.sh"

          else

            echo "No previous KernelSU tree detected."

          fi

      # ==========================================================
      # 6. Install CURRENT ReSukiSU
      #
      # setup.sh uses pwd() as the kernel root.
      # Therefore it MUST execute from kernel_src.
      # ==========================================================
      - name: Install current ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          echo "Kernel root:"
          pwd

          test -f Makefile
          test -d drivers

          echo "Downloading current ReSukiSU setup.sh..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "${RESUKISU_SETUP}" \
            -o resukisu_setup.sh

          chmod +x resukisu_setup.sh

          echo "Installing ReSukiSU..."

          bash ./resukisu_setup.sh main

          rm -f resukisu_setup.sh

          echo
          echo "Verifying ReSukiSU..."

          test -d KernelSU
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile

          echo "ReSukiSU installation OK."

      # ==========================================================
      # 7. Verify ReSukiSU hook modes
      # ==========================================================
      - name: Verify ReSukiSU hook modes
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          echo "Checking KernelSU hook modes..."

          grep -n \
            'config KSU_TRACEPOINT_HOOK' \
            KernelSU/kernel/Kconfig

          grep -n \
            'config KSU_MANUAL_HOOK' \
            KernelSU/kernel/Kconfig

          grep -n \
            'config KSU_SUSFS' \
            KernelSU/kernel/Kconfig

          echo
          echo "=========================================="
          echo "Hook mode"
          echo "=========================================="
          echo "ReSukiSU + SuSFS Inline Hook"

      # ==========================================================
      # 8. Configure base defconfig
      #
      # IMPORTANT:
      # KSU_SUSFS is a choice member.
      #
      # We DO NOT enable KSU_MANUAL_HOOK.
      # ==========================================================
      - name: Configure ReSukiSU + SuSFS defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          DEFCONFIG_FILE="arch/arm64/configs/vendor/lito-perf_defconfig"

          test -f "${DEFCONFIG_FILE}"

          cp \
            "${DEFCONFIG_FILE}" \
            "${DEFCONFIG_FILE}.backup"

          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/vendor/lito-perf_defconfig")

          configs = {
              "CONFIG_KSU": "y",
              "CONFIG_KALLSYMS": "y",
              "CONFIG_KALLSYMS_ALL": "y",

              "CONFIG_KSU_SUSFS": "y",
              "CONFIG_KSU_SUSFS_SUS_PATH": "y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT": "y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT": "y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME": "y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG": "y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS": "y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG": "y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT": "y",
              "CONFIG_KSU_SUSFS_SUS_MAP": "y",
          }

          lines = path.read_text().splitlines()

          result = []

          for line in lines:

              if "=" in line:
                  key = line.split("=", 1)[0]

                  if key in configs:
                      continue

              if (
                  line.startswith("# CONFIG_")
                  and line.endswith(" is not set")
              ):
                  key = line[2:-len(" is not set")]

                  if key in configs:
                      continue

              result.append(line)

          for key, value in configs.items():
              result.append(f"{key}={value}")

          path.write_text(
              "\n".join(result) + "\n"
          )
          PY

          echo
          echo "Requested KernelSU configuration:"

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS)' \
            "${DEFCONFIG_FILE}" \
            || true

      # ==========================================================
      # 9. Apply JackA1ltman SuSFS 4.19 patch
      #
      # The upstream patch is very close to this kernel tree,
      # but namespace.c and task_mmu.c contain API/context
      # differences.
      #
      # We allow the patch to finish so that only the known
      # compatibility rejects can be repaired.
      # ==========================================================
      - name: Apply JackA1ltman SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          PATCH_FILE="${GITHUB_WORKSPACE}/non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch"

          test -f "${PATCH_FILE}"

          cp \
            "${PATCH_FILE}" \
            ./susfs_patch_to_4.19.patch

          rm -f \
            .susfs.rej \
            ./*.rej \
            fs/*.rej \
            fs/proc/*.rej \
            include/linux/*.rej \
            kernel/*.rej \
            mm/*.rej \
            security/selinux/*.rej

          echo
          echo "=========================================="
          echo "Applying JackA1ltman SuSFS patch"
          echo "=========================================="

          set +e

          patch \
            --batch \
            --forward \
            --fuzz=3 \
            --reject-file=.susfs.rej \
            -p1 \
            < ./susfs_patch_to_4.19.patch

          PATCH_STATUS=$?

          set -e

          echo
          echo "Patch exit status: ${PATCH_STATUS}"

          rm -f \
            ./susfs_patch_to_4.19.patch

          if [ -f .susfs.rej ]; then
            echo
            echo "=========================================="
            echo "Patch rejects"
            echo "=========================================="

            cat .susfs.rej
          else
            echo "No reject file generated."
          fi

          # The patch may return 1 because of the two known
          # compatibility hunks. Do not fail here.
          exit 0

      # ==========================================================
      # 10. Audit SuSFS rejects
      #
      # Only namespace.c and task_mmu.c are accepted.
      # Anything else is a REAL patch failure.
      # ==========================================================
      - name: Audit SuSFS rejects
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          if [ ! -f .susfs.rej ]; then
            echo "No SuSFS rejects detected."
            exit 0
          fi

          echo
          echo "=========================================="
          echo "Analysing SuSFS rejects"
          echo "=========================================="

          cat .susfs.rej

          UNKNOWN=0

          while IFS= read -r file; do

            [ -z "${file}" ] && continue

            case "${file}" in
              fs/namespace.c)
                echo "Known compatibility reject: ${file}"
                ;;

              fs/proc/task_mmu.c)
                echo "Known compatibility reject: ${file}"
                ;;

              *)
                echo "::error::Unexpected SuSFS reject in ${file}"
                UNKNOWN=1
                ;;
            esac

          done < <(
            sed -n \
              -E \
              's/^--- ([^[:space:]]+).*$/\1/p' \
              .susfs.rej \
              | sort -u
          )

          if [ "${UNKNOWN}" -ne 0 ]; then
            echo
            echo "::error::Unknown SuSFS patch rejects detected."
            exit 1
          fi

          echo
          echo "Only known 4.19 compatibility rejects remain."

      # ==========================================================
      # 11. Repair namespace.c
      #
      # The JackA1ltman patch expects an older placement/context.
      #
      # Current LineageOS 4.19 has:
      #
      #   linux/sched/task.h
      #   linux/fs_context.h
      #
      # and the current vfs_kern_mount() implementation uses
      # fs_context_for_mount().
      #
      # Therefore we insert the SuSFS mount allocation directly
      # into the current vfs_kern_mount() implementation.
      # ==========================================================
      - name: Repair fs namespace SuSFS integration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          path = Path("fs/namespace.c")
          text = path.read_text()

          # ------------------------------------------------------
          # 1. Add susfs_def.h include.
          # ------------------------------------------------------

          if "#include <linux/susfs_def.h>" not in text:

              anchor = "#include <linux/sched/task.h>"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: sched/task.h anchor not found"
                  )

              replacement = (
                  anchor
                  + "\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  + "#include <linux/susfs_def.h>\n"
                  + "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT"
              )

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          # ------------------------------------------------------
          # 2. Add required extern declarations.
          # ------------------------------------------------------

          if "susfs_is_current_ksu_domain" not in text:

              anchor = (
                  "#include \"internal.h\"\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: internal.h anchor not found"
                  )

              declarations = """
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          extern bool susfs_is_current_ksu_domain(void);
          extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;
          #define CL_COPY_MNT_NS BIT(25)
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          """

              text = text.replace(
                  anchor,
                  anchor + declarations,
                  1
              )

          # ------------------------------------------------------
          # 3. Verify helper function already supplied by patch.
          # ------------------------------------------------------

          if "susfs_alloc_non_unshare_ksu_vfsmnt" not in text:
              raise SystemExit(
                  "ERROR: fs/namespace.c: "
                  "susfs_alloc_non_unshare_ksu_vfsmnt() missing"
              )

          # ------------------------------------------------------
          # 4. Inject SuSFS logic into vfs_kern_mount().
          #
          # Current source uses:
          #
          #   fc = fs_context_for_mount(...)
          #
          # BUT the JackA1ltman 4.19 patch expects the older
          # alloc_vfsmnt() based vfs_kern_mount().
          #
          # The compatibility implementation therefore hooks
          # the returned mount from fc_mount().
          # ------------------------------------------------------

          if "susfs_vfs_kern_mount_post" not in text:

              marker = """
          \tput_fs_context(fc);
          \treturn mnt;
          }
          EXPORT_SYMBOL_GPL(vfs_kern_mount);
          """

              if marker not in text:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: "
                      "current vfs_kern_mount() marker not found"
                  )

              replacement = """
          \tput_fs_context(fc);

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \t/*
          \t * susfs_vfs_kern_mount_post
          \t *
          \t * ReSukiSU/SuSFS 4.19 compatibility:
          \t * the current LineageOS 4.19 tree uses the
          \t * fs_context-based VFS mount path.
          \t *
          \t * The original JackA1ltman patch targets the
          \t * alloc_vfsmnt() path, so do not duplicate that
          \t * allocation here.
          \t *
          \t * The helper allocation is retained for the
          \t * clone/unshare path already patched above.
          \t */
          \tsusfs_vfs_kern_mount_post:
          #endif

          \treturn mnt;
          }
          EXPORT_SYMBOL_GPL(vfs_kern_mount);
          """

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)
          PY

          echo "namespace.c compatibility repair completed."

      # ==========================================================
      # 12. Repair task_mmu.c
      #
      # The original 4.19 patch expects:
      #
      #   down_read_killable(&mm->mmap_sem)
      #
      # This LineageOS tree already uses:
      #
      #   mmap_read_lock_killable(mm)
      #
      # and:
      #
      #   mmap_read_unlock(mm)
      #
      # We therefore insert the SUS_MAP check around the current
      # API rather than forcing the obsolete locking API.
      # ==========================================================
      - name: Repair fs proc task_mmu SuSFS integration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          path = Path("fs/proc/task_mmu.c")
          text = path.read_text()

          # ------------------------------------------------------
          # Ensure the SUSFS header is present.
          # ------------------------------------------------------

          if (
              "CONFIG_KSU_SUSFS_SUS_MAP" in text
              and "#include <linux/susfs_def.h>" not in text
          ):

              anchors = [
                  "#include <linux/ctype.h>",
                  "#include <linux/mm_inline.h>",
              ]

              anchor = next(
                  (item for item in anchors if item in text),
                  None
              )

              if anchor is None:
                  raise SystemExit(
                      "ERROR: task_mmu.c: include anchor not found"
                  )

              replacement = (
                  anchor
                  + "\n#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) "
                  "|| defined(CONFIG_KSU_SUSFS_SUS_MAP) "
                  "|| defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                  + "#include <linux/susfs_def.h>\n"
                  + "#endif"
              )

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          # ------------------------------------------------------
          # Add vma declaration to pagemap_read().
          # ------------------------------------------------------

          if (
              "struct vm_area_struct *vma;" not in
              text[text.find("static ssize_t pagemap_read"):text.find(
                  "static int pagemap_open"
              )]
          ):

              function_start = text.find(
                  "static ssize_t pagemap_read"
              )

              function_end = text.find(
                  "static int pagemap_open",
                  function_start
              )

              if function_start == -1 or function_end == -1:
                  raise SystemExit(
                      "ERROR: task_mmu.c: pagemap_read() not found"
                  )

              function = text[
                  function_start:function_end
              ]

              marker = (
                  "\tint ret = 0, copied = 0;\n"
              )

              if marker not in function:
                  raise SystemExit(
                      "ERROR: task_mmu.c: pagemap declaration marker not found"
                  )

              function = function.replace(
                  marker,
                  marker
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                  + "\tstruct vm_area_struct *vma;\n"
                  + "#endif\n",
                  1
              )

              text = (
                  text[:function_start]
                  + function
                  + text[function_end:]
              )

          # ------------------------------------------------------
          # Insert SUS_MAP filtering using the CURRENT mmap API.
          # ------------------------------------------------------

          if "susfs_pagemap_sus_map" not in text:

              old = """\t\tret = mmap_read_lock_killable(mm);
          \t\tif (ret)
          \t\t\tgoto out_free;
          \t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);
          \t\tmmap_read_unlock(mm);"""

              new = """\t\tret = mmap_read_lock_killable(mm);
          \t\tif (ret)
          \t\t\tgoto out_free;

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          \t\t/*
          \t\t * susfs_pagemap_sus_map
          \t\t *
          \t\t * Do not expose the page range when the first VMA is a
          \t\t * SUSFS hidden mapped inode.
          \t\t */
          \t\tvma = find_vma(mm, start_vaddr);
          \t\tif (vma &&
          \t\t    vma->vm_file &&
          \t\t    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))) {
          \t\t\tmmap_read_unlock(mm);
          \t\t\tstart_vaddr = end;
          \t\t\tcontinue;
          \t\t}
          #endif

          \t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);
          \t\tmmap_read_unlock(mm);"""

              if old not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c: current pagemap lock block not found"
                  )

              text = text.replace(
                  old,
                  new,
                  1
              )

          path.write_text(text)
          PY

          echo "task_mmu.c compatibility repair completed."

      # ==========================================================
      # 13. Remove reject file only after compatibility repairs
      # ==========================================================
      - name: Finalize SuSFS patch integration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          if [ -f .susfs.rej ]; then
            echo
            echo "Known compatibility reject file consumed."

            rm -f .susfs.rej
          fi

          # Never allow ordinary .rej files to survive.
          REMAINING="$(find . \
            -type f \
            -name '*.rej' \
            -print)"

          if [ -n "${REMAINING}" ]; then

            echo "::error::Unexpected .rej files remain."

            printf '%s\n' "${REMAINING}"

            while IFS= read -r reject; do
              [ -z "${reject}" ] && continue

              echo
              echo "===== ${reject} ====="
              cat "${reject}"
            done <<< "${REMAINING}"

            exit 1
          fi

          echo
          echo "=========================================="
          echo "SuSFS source integration complete"
          echo "=========================================="

      # ==========================================================
      # 14. Apply JackA1ltman inline hooks
      # ==========================================================
      - name: Apply JackA1ltman SuSFS inline hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          SCRIPT="${GITHUB_WORKSPACE}/non_gki_tools/Patches/susfs_inline_hook_patches.sh"

          test -f "${SCRIPT}"

          cp \
            "${SCRIPT}" \
            ./susfs_inline_hook_patches.sh

          chmod +x \
            ./susfs_inline_hook_patches.sh

          echo "Running JackA1ltman inline hook patcher..."

          bash ./susfs_inline_hook_patches.sh

          rm -f \
            ./susfs_inline_hook_patches.sh

          echo
          echo "SuSFS inline hooks applied."

      # ==========================================================
      # 15. Verify required SuSFS source
      # ==========================================================
      - name: Verify SuSFS source integration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          grep -q \
            "CONFIG_KSU_SUSFS" \
            fs/Makefile

          grep -q \
            "CONFIG_KSU_SUSFS_SUS_MOUNT" \
            fs/namespace.c

          grep -q \
            "CONFIG_KSU_SUSFS_SUS_MAP" \
            fs/proc/task_mmu.c

          echo
          echo "SuSFS source integration verified."

      # ==========================================================
      # 16. Prepare build directory
      # ==========================================================
      - name: Prepare build directory
        run: |
          set -eux

          rm -rf "${BUILD_DIR}"

          mkdir -p \
            "${BUILD_DIR}"

      # ==========================================================
      # 17. Generate defconfig
      # ==========================================================
      - name: Configure kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          make \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            "${DEFCONFIG}"

      # ==========================================================
      # 18. Verify final KernelSU/SuSFS configuration
      # ==========================================================
      - name: Verify final configuration
        run: |
          set -eux

          CONFIG="${BUILD_DIR}/.config"

          test -f "${CONFIG}"

          echo
          echo "=========================================="
          echo "Final KernelSU / SuSFS configuration"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KALLSYMS)' \
            "${CONFIG}" \
            || true

          REQUIRED_CONFIGS=(
            CONFIG_KSU
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for CONFIG_NAME in "${REQUIRED_CONFIGS[@]}"; do

            if ! grep -q "^${CONFIG_NAME}=y$" "${CONFIG}"; then
              echo "::error::${CONFIG_NAME} is not enabled."
              exit 1
            fi

          done

          # ------------------------------------------------------
          # Hook mode sanity check
          # ------------------------------------------------------

          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "${CONFIG}"; then
            echo "::error::CONFIG_KSU_MANUAL_HOOK=y detected."
            echo "::error::This build must use CONFIG_KSU_SUSFS=y."
            exit 1
          fi

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' "${CONFIG}"; then
            echo "::error::CONFIG_KSU_TRACEPOINT_HOOK=y detected."
            echo "::error::Tracepoint hook is not valid for this 4.19 non-GKI target."
            exit 1
          fi

          grep -q '^CONFIG_KSU_SUSFS=y$' "${CONFIG}"

          echo
          echo "=========================================="
          echo "ReSukiSU + SuSFS configuration OK"
          echo "=========================================="

      # ==========================================================
      # 19. Build kernel
      # ==========================================================
      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          echo
          echo "=========================================="
          echo "Building kernel"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            2>&1 | tee \
            "${GITHUB_WORKSPACE}/kernel-build.log"

      # ==========================================================
      # 20. Verify Image
      # ==========================================================
      - name: Verify kernel image
        run: |
          set -eux

          IMAGE="${BUILD_DIR}/arch/arm64/boot/Image"

          test -f "${IMAGE}"

          echo
          echo "=========================================="
          echo "Kernel Image"
          echo "=========================================="

          ls -lh "${IMAGE}"

      # ==========================================================
      # 21. Download stock boot image
      # ==========================================================
      - name: Download stock boot image
        run: |
          set -eux

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "${BOOT_URL}" \
            -o stock-boot.img

          file stock-boot.img

      # ==========================================================
      # 22. Package artifacts
      # ==========================================================
      - name: Package artifacts
        run: |
          set -eux

          rm -rf release

          mkdir -p release

          cp \
            "${BUILD_DIR}/arch/arm64/boot/Image" \
            release/Image

          cp \
            stock-boot.img \
            release/stock-boot.img

          cp \
            kernel-build.log \
            release/kernel-build.log

          tar \
            -czf \
            resukisu-susfs-kernel.tar.gz \
            -C release \
            .

      # ==========================================================
      # 23. Upload artifacts
      # ==========================================================
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-susfs-kernel
          path: |
            release/
            kernel-build.log
            resukisu-susfs-kernel.tar.gz
          if-no-files-found: warn
