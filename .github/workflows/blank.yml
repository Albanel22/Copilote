name: Kernel CI — KSU+SUSFS

on:
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img
  KSU_VERSION: v3.2.5
  SUSFS_REF: kernel-4.19

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            glibc-source \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang \
            llvm \
            lld \
            device-tree-compiler \
            zip \
            unzip \
            curl \
            git

      # ============================================================
      # STOCK BOOT
      # ============================================================

      - name: Download Stock Boot Image
        shell: bash
        run: |
          set -euo pipefail

          echo "📥 Téléchargement du boot.img..."

          curl -fLo boot-stock.img "${{ env.BOOT_URL }}"

          test -s boot-stock.img

          echo "✅ boot-stock.img téléchargé"

      # ============================================================
      # KERNEL SOURCE
      # ============================================================

      - name: Clone Kernel Source
        run: |
          set -euo pipefail

          git clone \
            https://github.com/Albanel22/android_kernel_motorola_sm8250.git \
            -b lineage-23.2 \
            --depth=1 \
            "${{ env.KERNEL_PATH }}"

          cd "${{ env.KERNEL_PATH }}"

          echo "=== KERNEL COMMIT ==="
          git rev-parse HEAD

          echo "=== KERNEL BRANCH ==="
          git branch --show-current || true

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-kernel
          restore-keys: |
            ${{ runner.os }}-ccache-

      # ============================================================
      # KERNELSU 3.2.5
      # ============================================================

      - name: Install KernelSU 3.2.5
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "     INSTALLATION KERNELSU 3.2.5"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "${KSU_VERSION}"

          echo ""
          echo "=== Vérification KernelSU ==="

          test -d KernelSU
          test -f KernelSU/kernel/Kconfig

          echo "=== KernelSU HEAD ==="

          cd KernelSU
          git rev-parse HEAD
          git describe --tags --always || true

          echo ""
          echo "=== KernelSU Kconfig ==="

          grep -n \
            "^config KSU" \
            kernel/Kconfig \
            || true

          cd ..

          if ! grep -q 'drivers/kernelsu/Kconfig' init/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> init/Kconfig
          fi

          echo "✅ KernelSU 3.2.5 installé"

      # ============================================================
      # SUSFS KERNEL 4.19
      # ============================================================

      - name: Clone SUSFS kernel-4.19
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       CLONE SUSFS KERNEL 4.19"
          echo "========================================"

          git clone \
            --branch "${SUSFS_REF}" \
            --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          cd susfs4ksu

          echo ""
          echo "=== SUSFS REF ==="
          git describe --tags --always || true

          echo ""
          echo "=== SUSFS COMMIT ==="
          git rev-parse HEAD

          echo ""
          echo "=== FICHIERS SUSFS ==="

          test -f kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          test -f kernel_patches/50_add_susfs_in_kernel-4.19.patch
          test -f kernel_patches/fs/susfs.c
          test -f kernel_patches/include/linux/susfs.h

          ls -lh \
            kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            kernel_patches/50_add_susfs_in_kernel-4.19.patch \
            kernel_patches/fs/susfs.c \
            kernel_patches/include/linux/susfs.h

          echo ""
          echo "✅ Fichiers SUSFS présents"

      # ============================================================
      # TEST PATCH 10
      # IMPORTANT :
      # On ne modifie PAS encore KernelSU.
      # ============================================================

      - name: TEST 10_enable_susfs_for_ksu.patch
        working-directory: ${{ env.KERNEL_PATH }}/KernelSU
        shell: bash
        run: |
          set -euo pipefail

          PATCH="../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          echo "========================================"
          echo " TEST 10_enable_susfs_for_ksu.patch"
          echo "========================================"

          test -f "$PATCH"

          echo ""
          echo "=== Taille du patch ==="
          wc -l "$PATCH"

          echo ""
          echo "=== Recherche path_umount dans le patch ==="
          grep -n "path_umount" "$PATCH" || true

          echo ""
          echo "=== DRY RUN PATCH 10 ==="

          if patch --dry-run -p1 < "$PATCH"; then
            echo ""
            echo "========================================"
            echo "✅ PATCH 10 COMPATIBLE"
            echo "========================================"
          else
            echo ""
            echo "========================================"
            echo "❌ PATCH 10 INCOMPATIBLE"
            echo "========================================"
            echo ""
            echo "Le workflow s'arrête volontairement."
            echo "Aucune compilation du kernel ne sera lancée."
            exit 1
          fi

      # ============================================================
      # APPLICATION PATCH 10
      # ============================================================

      - name: Apply SUSFS KernelSU patch
        working-directory: ${{ env.KERNEL_PATH }}/KernelSU
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Application patch 10 ==="

          patch -p1 \
            < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          echo ""
          echo "✅ Patch 10 appliqué"

      # ============================================================
      # COPIE SUSFS
      # ============================================================

      - name: Copy SUSFS Sources
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Copie susfs.c ==="

          cp \
            susfs4ksu/kernel_patches/fs/susfs.c \
            fs/susfs.c

          echo "=== Copie susfs.h ==="

          cp \
            susfs4ksu/kernel_patches/include/linux/susfs.h \
            include/linux/susfs.h

          test -f fs/susfs.c
          test -f include/linux/susfs.h

          echo "✅ Sources SUSFS copiées"

      # ============================================================
      # TEST PATCH 50
      # ============================================================

      - name: TEST 50_add_susfs_in_kernel-4.19.patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"

          echo "========================================"
          echo " TEST PATCH SUSFS KERNEL 4.19"
          echo "========================================"

          test -f "$PATCH"

          echo ""
          echo "=== DRY RUN PATCH 50 ==="

          if patch --dry-run -p1 < "$PATCH"; then
            echo ""
            echo "========================================"
            echo "✅ PATCH 50 COMPATIBLE"
            echo "========================================"
          else
            echo ""
            echo "========================================"
            echo "❌ PATCH 50 INCOMPATIBLE"
            echo "========================================"
            echo ""
            echo "Le workflow s'arrête."
            exit 1
          fi

      # ============================================================
      # APPLICATION PATCH 50
      # ============================================================

      - name: Apply SUSFS Kernel 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          patch -p1 \
            < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          echo "✅ Patch 50 appliqué"

      # ============================================================
      # VERIFICATION path_umount
      # ============================================================

      - name: Verify SUSFS Integration
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       VERIFICATION SUSFS"
          echo "========================================"

          echo ""
          echo "=== Recherche path_umount ==="

          grep -Rns \
            "path_umount" \
            fs \
            include \
            kernel \
            KernelSU \
            --include='*.c' \
            --include='*.h' \
            --include='Makefile' \
            || true

          echo ""
          echo "=== fs/namespace.c ==="

          grep -n \
            -A25 \
            -B10 \
            "int path_umount" \
            fs/namespace.c \
            || true

          echo ""
          echo "=== fs/internal.h ==="

          grep -n \
            "path_umount" \
            fs/internal.h \
            || true

          echo ""
          echo "=== SUSFS Kconfig ==="

          grep -Rns \
            "CONFIG_KSU_SUSFS" \
            KernelSU \
            --include='Kconfig*' \
            || true

          echo ""
          echo "=== Reject files ==="

          find . \
            -name "*.rej" \
            -print

      # ============================================================
      # COLLECT REJECTS
      # ============================================================

      - name: Collect Patch Rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-patch-rejects
          path: |
            ${{ env.KERNEL_PATH }}/**/*.rej
          if-no-files-found: ignore

      # ============================================================
      # COMPILATION
      # ============================================================

      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -uo pipefail

          ccache -C

          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export KCFLAGS="-Wno-error"

          echo "========================================"
          echo "       PREPARATION DEFCONFIG"
          echo "========================================"

          cp \
            arch/arm64/configs/vendor/${{ env.DEFCONFIG }} \
            arch/arm64/configs/${{ env.DEFCONFIG }}

          echo "========================================"
          echo "       GENERATION CONFIG"
          echo "========================================"

          make \
            O=${{ env.BUILD_DIR }} \
            LLVM=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            ${{ env.DEFCONFIG }}

          echo "========================================"
          echo "       ACTIVATION KSU / SUSFS"
          echo "========================================"

          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KRETPROBES=y"
          } >> "${{ env.BUILD_DIR }}/.config"

          make \
            O=${{ env.BUILD_DIR }} \
            LLVM=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            olddefconfig

          echo ""
          echo "=== CONFIG FINALE ==="

          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_SUS_PATH=|CONFIG_KPROBES=|CONFIG_HAVE_KPROBES=|CONFIG_KRETPROBES=' \
            "${{ env.BUILD_DIR }}/.config" \
            || true

          grep -q \
            "CONFIG_KSU=y" \
            "${{ env.BUILD_DIR }}/.config" \
            || {
              echo "❌ CONFIG_KSU absent"
              exit 1
            }

          grep -q \
            "CONFIG_KSU_SUSFS=y" \
            "${{ env.BUILD_DIR }}/.config" \
            || {
              echo "❌ CONFIG_KSU_SUSFS absent"
              exit 1
            }

          echo "========================================"
          echo "       FORCE SIGNATURE"
          echo "========================================"

          sed -i \
            's/if (!check_version(/if (0 \&\& !check_version(/g' \
            kernel/module.c

          echo "========================================"
          echo "       PATCH TACTILE"
          echo "========================================"

          printf "\n\
          /* --- Début Patch Tactile --- */\n\
          #include <linux/notifier.h>\n\
          #include <linux/module.h>\n\
          static BLOCKING_NOTIFIER_HEAD(motorola_panel_notifier_list);\n\
          int panel_register_notifier(struct notifier_block *nb) {\n\
          return blocking_notifier_chain_register(&motorola_panel_notifier_list, nb);\n\
          }\n\
          EXPORT_SYMBOL(panel_register_notifier);\n\
          int panel_unregister_notifier(struct notifier_block *nb) {\n\
          return blocking_notifier_chain_unregister(&motorola_panel_notifier_list, nb);\n\
          }\n\
          EXPORT_SYMBOL(panel_unregister_notifier);\n\
          void touch_set_state(int state) { return; }\n\
          EXPORT_SYMBOL(touch_set_state);\n\
          /* --- Fin Patch Tactile --- */\n\
          " >> techpack/display/msm/msm_drv.c

          echo "========================================"
          echo "       COMPILATION KERNEL"
          echo "========================================"

          make \
            O=${{ env.BUILD_DIR }} \
            LLVM=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="$KCFLAGS" \
            -j$(nproc) \
            Image

      # ============================================================
      # REPACK
      # ============================================================

      - name: Repack & Finalize
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p repack

          cp boot-stock.img repack/boot.img

          wget -q \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk \
            -O Magisk-v27.0.apk

          unzip -q \
            Magisk-v27.0.apk \
            lib/x86_64/libmagiskboot.so

          mv \
            lib/x86_64/libmagiskboot.so \
            repack/magiskboot

          chmod +x repack/magiskboot

          cd repack

          ./magiskboot unpack boot.img

          cp \
            ../${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image \
            kernel

          ./magiskboot repack boot.img new-boot.img

          mv \
            new-boot.img \
            ../final_boot.img

          cd ..

          mkdir -p final_output

          mv \
            final_boot.img \
            final_output/boot.img

      # ============================================================
      # KERNELSU MANAGER 3.2.5
      # ============================================================

      - name: Download KernelSU Manager 3.2.5
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            -o KernelSU_v3.2.5_32525-release.apk \
            https://github.com/tiann/KernelSU/releases/download/v3.2.5/KernelSU_v3.2.5_32525-release.apk

          test -s KernelSU_v3.2.5_32525-release.apk

          echo "✅ Manager 3.2.5 téléchargé"

      # ============================================================
      # ARTIFACT BOOT
      # ============================================================

      - name: Upload Finished Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-motorola-final-ksu325-susfs
          path: final_output/boot.img
          if-no-files-found: error

      # ============================================================
      # ARTIFACT MANAGER
      # ============================================================

      - name: Upload KernelSU Manager 3.2.5
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Manager-v3.2.5
          path: KernelSU_v3.2.5_32525-release.apk
          if-no-files-found: error
