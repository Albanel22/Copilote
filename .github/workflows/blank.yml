name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2

  KERNEL_PATH: kernel_src
  BUILD_DIR: out

  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  RESUKISU_SETUP:
    https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

  BOOT_URL:
    https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

  CLANG_VERSION: 20

jobs:
  build:
    name: Build ReSukiSU + SuSFS
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout kernel
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: ${{ env.KERNEL_PATH }}
          fetch-depth: 1

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            device-tree-compiler

      # ============================================================
      # 3. Clone JackA1ltman tools
      # ============================================================
      - name: Fetch NonGKI tools
        run: |
          set -eux

          rm -rf non_gki_tools

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            non_gki_tools

          echo "NonGKI tools:"
          find non_gki_tools -maxdepth 3 -type f | sort | head -200

      # ============================================================
      # 4. Verify kernel version
      # ============================================================
      - name: Verify kernel version
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          echo "Kernel Makefile:"
          head -10 Makefile

          VERSION="$(sed -n 's/^VERSION = //p' Makefile | head -1)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -1)"

          echo "Detected kernel: ${VERSION}.${PATCHLEVEL}"

          if [ "${VERSION}" != "4" ] || [ "${PATCHLEVEL}" != "19" ]; then
            echo "::error::Expected Linux 4.19"
            exit 1
          fi

      # ============================================================
      # 5. Clean any previous KernelSU integration
      #
      # Do NOT assume bin/clean_hook.sh exists.
      # Only execute it when the repository actually provides it.
      # ============================================================
      - name: Clean previous KernelSU integration
        run: |
          set -eux

          if [ -f "non_gki_tools/bin/clean_hook.sh" ]; then
            cp \
              non_gki_tools/bin/clean_hook.sh \
              "${KERNEL_PATH}/clean_hook.sh"

            chmod +x "${KERNEL_PATH}/clean_hook.sh"

            (
              cd "${KERNEL_PATH}"
              bash clean_hook.sh
            )

            rm -f "${KERNEL_PATH}/clean_hook.sh"
          else
            echo "clean_hook.sh is not present in this revision."
            echo "Checking for an existing KernelSU tree."

            if [ -d "${KERNEL_PATH}/KernelSU" ]; then
              echo "::error::Existing KernelSU tree detected but no clean_hook.sh is available."
              echo "::error::Refusing to stack another KernelSU integration."
              exit 1
            fi
          fi

      # ============================================================
      # 6. Install CURRENT ReSukiSU
      # ============================================================
      - name: Integrate current ReSukiSU
        run: |
          set -eux

          test -f "${KERNEL_PATH}/Makefile"

          curl -LSs "${RESUKISU_SETUP}" \
            | bash -s main \
            -- \
            "${KERNEL_PATH}"

      # ============================================================
      # 7. Verify ReSukiSU installation
      # ============================================================
      - name: Verify ReSukiSU
        run: |
          set -eux

          test -d "${KERNEL_PATH}/KernelSU"

          test -f "${KERNEL_PATH}/KernelSU/kernel/Kconfig"

          test -f "${KERNEL_PATH}/KernelSU/kernel/Makefile"

          echo "KernelSU/ReSukiSU tree detected."

          find "${KERNEL_PATH}/KernelSU" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100

      # ============================================================
      # 8. Configure lito-perf_defconfig
      # ============================================================
      - name: Enable ReSukiSU and SuSFS configuration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          test -f "${DEFCONFIG_FILE}"

          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/vendor/lito-perf_defconfig")
          text = path.read_text()

          configs = [
              "CONFIG_KSU=y",
              "CONFIG_KSU_MANUAL_HOOK=y",
              "CONFIG_KALLSYMS=y",
              "CONFIG_KALLSYMS_ALL=y",

              "CONFIG_KSU_SUSFS=y",
              "CONFIG_KSU_SUSFS_SUS_PATH=y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT=y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG=y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y",
              "CONFIG_KSU_SUSFS_SUS_MAP=y",
          ]

          lines = text.splitlines()

          for cfg in configs:
              key = cfg.split("=")[0]

              lines = [
                  line for line in lines
                  if not line.startswith(key + "=")
                  and line != f"# {key} is not set"
              ]

              lines.append(cfg)

          path.write_text("\n".join(lines) + "\n")
          PY

          echo
          echo "Enabled configuration:"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS)' \
            "${DEFCONFIG_FILE}" \
            | tail -40

      # ============================================================
      # 9. Apply ReSukiSU Manual Hook
      #
      # IMPORTANT:
      # With SuSFS we use the JackA1ltman inline-hook patch path.
      # ============================================================
      - name: Apply ReSukiSU/SuSFS manual hook patches
        run: |
          set -eux

          PATCH_SCRIPT=""

          if [ -f "non_gki_tools/Patches/susfs_inline_hook_patches.sh" ]; then
            PATCH_SCRIPT="non_gki_tools/Patches/susfs_inline_hook_patches.sh"
          elif [ -f "non_gki_tools/Patches/syscall_hook_patches.sh" ]; then
            echo "::warning::susfs_inline_hook_patches.sh not found."
            echo "::warning::Falling back to syscall_hook_patches.sh."
            PATCH_SCRIPT="non_gki_tools/Patches/syscall_hook_patches.sh"
          else
            echo "::error::No ReSukiSU manual hook patch script found."
            find non_gki_tools -type f -name '*hook*patch*.sh' -print
            exit 1
          fi

          echo "Using:"
          echo "${PATCH_SCRIPT}"

          cp "${PATCH_SCRIPT}" "${KERNEL_PATH}/manual_hook_patches.sh"

          chmod +x "${KERNEL_PATH}/manual_hook_patches.sh"

          (
            cd "${KERNEL_PATH}"
            bash manual_hook_patches.sh
          )

      # ============================================================
      # 10. Obtain the 4.19 SuSFS patch
      # ============================================================
      - name: Locate SuSFS 4.19 patch
        run: |
          set -eux

          PATCH=""

          if [ -f "non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch" ]; then
            PATCH="non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch"
          elif [ -f "non_gki_tools/Patches/susfs_patch_to_4.19.patch" ]; then
            PATCH="non_gki_tools/Patches/susfs_patch_to_4.19.patch"
          else
            echo "::error::susfs_patch_to_4.19.patch was not found."
            find non_gki_tools \
              -type f \
              -iname '*susfs*4.19*.patch' \
              -print
            exit 1
          fi

          cp "${PATCH}" \
            "${KERNEL_PATH}/susfs_patch_to_4.19.patch"

          ls -lh \
            "${KERNEL_PATH}/susfs_patch_to_4.19.patch"

      # ============================================================
      # 11. Apply SuSFS patch
      #
      # We intentionally DO NOT ignore the rejects.
      # ============================================================
      - name: Apply SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          rm -f \
            fs/*.rej \
            fs/proc/*.rej \
            kernel/*.rej \
            mm/*.rej \
            security/selinux/*.rej \
            include/linux/*.rej

          patch \
            --batch \
            --forward \
            -p1 \
            < susfs_patch_to_4.19.patch \
            || true

          echo
          echo "=========================================="
          echo "SuSFS patch result"
          echo "=========================================="

          find . \
            -type f \
            -name '*.rej' \
            -print \
            | sort

      # ============================================================
      # 12. Adapt the TWO known rejects for this exact 4.19 tree
      #
      # namespace.c:
      #   use the actual 4.19+ vfs_create_mount/vfs_kern_mount API
      #
      # task_mmu.c:
      #   use mmap_read_lock_killable()/mmap_read_unlock()
      # ============================================================
      - name: Resolve known SuSFS 4.19 rejects
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          # ==========================================================
          # fs/namespace.c
          # ==========================================================

          path = Path("fs/namespace.c")
          text = path.read_text()

          # Add susfs_def.h include.
          if "CONFIG_KSU_SUSFS_SUS_MOUNT" in text:
              if "#include <linux/susfs_def.h>" not in text:
                  anchor = "#include <linux/sched/task.h>"

                  if anchor not in text:
                      raise SystemExit(
                          "ERROR: namespace.c: include anchor not found"
                      )

                  text = text.replace(
                      anchor,
                      anchor +
                      "\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                      "#include <linux/susfs_def.h>\n"
                      "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT",
                      1
                  )

          # ----------------------------------------------------------
          # vfs_create_mount()
          # ----------------------------------------------------------
          if "struct vfsmount *vfs_create_mount" in text:

              old = """\tif (!fc->root)
\t\treturn ERR_PTR(-EINVAL);
\tsb = fc->root->d_sb;

\tmnt = alloc_vfsmnt(fc->source ?: "none");"""

              new = """\tif (!fc->root)
\t\treturn ERR_PTR(-EINVAL);
\tsb = fc->root->d_sb;

#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
\tif (static_branch_unlikely(
\t\t&susfs_set_sdcard_android_data_decrypted_key_false)) {
\t\tif (susfs_is_current_ksu_domain()) {
\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(
\t\t\t\tfc->source ?: "none");
\t\t\tgoto bypass_orig_flow;
\t\t}
\t}
#endif

\tmnt = alloc_vfsmnt(fc->source ?: "none");

#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
bypass_orig_flow:
#endif"""

              if "susfs_alloc_non_unshare_ksu_vfsmnt" not in text:
                  if old not in text:
                      raise SystemExit(
                          "ERROR: namespace.c: vfs_create_mount anchor not found"
                      )

                  text = text.replace(old, new, 1)

          # ----------------------------------------------------------
          # vfs_kern_mount()
          # ----------------------------------------------------------
          if "struct vfsmount *vfs_kern_mount" in text:

              old = """\tif (!type)
\t\treturn ERR_PTR(-EINVAL);

\tfc = fs_context_for_mount(type, flags);"""

              new = """\tif (!type)
\t\treturn ERR_PTR(-EINVAL);

#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
\t/*
\t * SuSFS 4.19 mount hiding.
\t * The actual allocation hook is handled in vfs_create_mount()
\t * for this fs_context based kernel.
\t */
#endif

\tfc = fs_context_for_mount(type, flags);"""

              if old in text and "SuSFS 4.19 mount hiding" not in text:
                  text = text.replace(old, new, 1)

          path.write_text(text)

          # ==========================================================
          # fs/proc/task_mmu.c
          # ==========================================================

          path = Path("fs/proc/task_mmu.c")
          text = path.read_text()

          if "SUSFS_IS_INODE_SUS_MAP" not in text:
              marker = """\t\tret = mmap_read_lock_killable(mm);
\t\tif (ret)
\t\t\tgoto out_free;
\t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);"""

              replacement = """\t\tret = mmap_read_lock_killable(mm);
\t\tif (ret)
\t\t\tgoto out_free;

#ifdef CONFIG_KSU_SUSFS_SUS_MAP
\t\tvma = find_vma(mm, start_vaddr);
\t\tif (vma && vma->vm_file &&
\t\t    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))
\t\t\tgoto bypass_orig_flow;
#endif

\t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);

#ifdef CONFIG_KSU_SUSFS_SUS_MAP
bypass_orig_flow:
#endif"""

              if marker not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c: pagemap_read anchor not found"
                  )

              text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY

      # ============================================================
      # 13. Reject audit
      #
      # Any remaining reject is a REAL integration failure.
      # ============================================================
      - name: Verify SuSFS integration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          REJECTS="$(find . \
            -type f \
            -name '*.rej' \
            | wc -l)"

          echo "Rejected hunks: ${REJECTS}"

          if [ "${REJECTS}" -gt 0 ]; then
            echo "::error::SuSFS still has rejected hunks."

            find . \
              -type f \
              -name '*.rej' \
              -print

            exit 1
          fi

          echo "SuSFS patch integrated without remaining rejects."

      # ============================================================
      # 14. Remove temporary patch files
      # ============================================================
      - name: Cleanup patch helpers
        run: |
          set -eux

          rm -f \
            "${KERNEL_PATH}/manual_hook_patches.sh" \
            "${KERNEL_PATH}/susfs_patch_to_4.19.patch"

      # ============================================================
      # 15. Prepare output directory
      # ============================================================
      - name: Prepare kernel build
        run: |
          set -eux

          rm -rf "${BUILD_DIR}"

          mkdir -p "${BUILD_DIR}"

      # ============================================================
      # 16. Load defconfig
      # ============================================================
      - name: Configure kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          make \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            "${DEFCONFIG}"

      # ============================================================
      # 17. Verify final .config
      # ============================================================
      - name: Verify final configuration
        run: |
          set -eux

          CONFIG="${BUILD_DIR}/.config"

          test -f "${CONFIG}"

          REQUIRED_CONFIGS=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for CONFIG_NAME in "${REQUIRED_CONFIGS[@]}"; do
            if ! grep -q "^${CONFIG_NAME}=y$" "${CONFIG}"; then
              echo "::error::${CONFIG_NAME} is not enabled"
              exit 1
            fi
          done

          echo
          echo "=========================================="
          echo "ReSukiSU + SuSFS configuration OK"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS)' \
            "${CONFIG}"

      # ============================================================
      # 18. Build
      # ============================================================
      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            2>&1 | tee \
            "${GITHUB_WORKSPACE}/kernel-build.log"

      # ============================================================
      # 19. Verify Image
      # ============================================================
      - name: Verify kernel image
        run: |
          set -eux

          find "${BUILD_DIR}/arch/arm64/boot" \
            -maxdepth 2 \
            -type f \
            -print

          test -f "${BUILD_DIR}/arch/arm64/boot/Image"

      # ============================================================
      # 20. Download stock boot.img
      # ============================================================
      - name: Download stock boot image
        run: |
          set -eux

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            "${BOOT_URL}" \
            -o stock-boot.img

          file stock-boot.img

      # ============================================================
      # 21. Package artifacts
      # ============================================================
      - name: Package kernel
        run: |
          set -eux

          mkdir -p release

          cp \
            "${BUILD_DIR}/arch/arm64/boot/Image" \
            release/Image

          cp \
            stock-boot.img \
            release/stock-boot.img

          cp \
            kernel-build.log \
            release/

          tar -czf \
            resukisu-susfs-kernel.tar.gz \
            -C release \
            .

      # ============================================================
      # 22. Upload artifacts
      # ============================================================
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-susfs-kernel
          path: |
            release/
            kernel-build.log
            resukisu-susfs-kernel.tar.gz
          if-no-files-found: warn
