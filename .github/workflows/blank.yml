name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2

  KERNEL_PATH: kernel_src
  BUILD_DIR: out

  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

jobs:
  build:
    name: Build ReSukiSU + SuSFS
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout kernel
      # ==========================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: ${{ env.KERNEL_PATH }}
          fetch-depth: 1

      # ==========================================================
      # 2. Dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            device-tree-compiler

      # ==========================================================
      # 3. Verify kernel
      # ==========================================================
      - name: Verify kernel version
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          VERSION="$(sed -n 's/^VERSION = //p' Makefile | head -1)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -1)"

          echo "Kernel version: ${VERSION}.${PATCHLEVEL}"

          test "${VERSION}" = "4"
          test "${PATCHLEVEL}" = "19"

      # ==========================================================
      # 4. Fetch JackA1ltman tools
      # ==========================================================
      - name: Fetch NonGKI tools
        run: |
          set -eux

          rm -rf non_gki_tools

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            non_gki_tools

          test -f non_gki_tools/Bin/clean_hook.sh
          test -f non_gki_tools/Patches/susfs_inline_hook_patches.sh
          test -f non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch

          echo "JackA1ltman tools verified."

      # ==========================================================
      # 5. Clean old KernelSU integration
      # ==========================================================
      - name: Clean previous KernelSU integration
        run: |
          set -eux

          if [ -d "${KERNEL_PATH}/KernelSU" ]; then
            echo "Existing KernelSU directory detected."

            cp \
              non_gki_tools/Bin/clean_hook.sh \
              "${KERNEL_PATH}/clean_hook.sh"

            chmod +x "${KERNEL_PATH}/clean_hook.sh"

            (
              cd "${KERNEL_PATH}"
              bash clean_hook.sh
            )

            rm -f "${KERNEL_PATH}/clean_hook.sh"
          fi

      # ==========================================================
      # 6. Install current ReSukiSU
      # ==========================================================
      - name: Install ReSukiSU
        run: |
          set -eux

          curl -LSs "${RESUKISU_SETUP}" \
            | bash -s main

          test -d "${KERNEL_PATH}/KernelSU"

          test -f "${KERNEL_PATH}/KernelSU/kernel/Kconfig"
          test -f "${KERNEL_PATH}/KernelSU/kernel/Makefile"

      # ==========================================================
      # 7. Apply lito-perf configuration
      # ==========================================================
      - name: Enable ReSukiSU and SuSFS
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          DEFCONFIG_FILE="arch/arm64/configs/vendor/lito-perf_defconfig"

          test -f "${DEFCONFIG_FILE}"

          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/vendor/lito-perf_defconfig")
          lines = path.read_text().splitlines()

          configs = {
              "CONFIG_KSU": "y",
              "CONFIG_KSU_MANUAL_HOOK": "y",
              "CONFIG_KALLSYMS": "y",
              "CONFIG_KALLSYMS_ALL": "y",

              "CONFIG_KSU_SUSFS": "y",
              "CONFIG_KSU_SUSFS_SUS_PATH": "y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT": "y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT": "y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME": "y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG": "y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS": "y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG": "y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT": "y",
              "CONFIG_KSU_SUSFS_SUS_MAP": "y",
          }

          result = []

          for line in lines:
              key = line.split("=", 1)[0]

              if key in configs:
                  continue

              if line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:-len(" is not set")]
                  if key in configs:
                      continue

              result.append(line)

          for key, value in configs.items():
              result.append(f"{key}={value}")

          path.write_text("\n".join(result) + "\n")
          PY

          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS)' \
            "${DEFCONFIG_FILE}"

      # ==========================================================
      # 8. Apply JackA1ltman SuSFS 4.19 patch
      # ==========================================================
      - name: Apply SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          cp \
            "${GITHUB_WORKSPACE}/non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch" \
            .

          patch \
            --batch \
            --forward \
            --reject-file=- \
            -p1 \
            < susfs_patch_to_4.19.patch

          rm -f susfs_patch_to_4.19.patch

          echo "SuSFS 4.19 patch applied."

      # ==========================================================
      # 9. Apply JackA1ltman inline hooks
      # ==========================================================
      - name: Apply JackA1ltman SuSFS inline hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          cp \
            "${GITHUB_WORKSPACE}/non_gki_tools/Patches/susfs_inline_hook_patches.sh" \
            ./susfs_inline_hook_patches.sh

          chmod +x susfs_inline_hook_patches.sh

          bash ./susfs_inline_hook_patches.sh

          rm -f susfs_inline_hook_patches.sh

      # ==========================================================
      # 10. Add ReSukiSU stat return hooks
      #
      # ReSukiSU explicitly requires:
      #   ksu_handle_newfstat_ret
      #   ksu_handle_fstat64_ret
      # ==========================================================
      - name: Add ReSukiSU stat return hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          path = Path("fs/stat.c")
          text = path.read_text()

          declaration = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern void ksu_handle_newfstat_ret(
              unsigned int *fd,
              struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd,
              struct stat64 __user **statbuf_ptr);
          #endif
          #endif
          '''

          if "ksu_handle_newfstat_ret" not in text:
              anchors = [
                  "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)",
                  "#if !defined(__ARCH_WANT_STAT64)",
                  "SYSCALL_DEFINE4(newfstatat",
              ]

              anchor = next((a for a in anchors if a in text), None)

              if anchor is None:
                  raise SystemExit(
                      "ERROR: fs/stat.c: cannot locate stat hook declaration anchor"
                  )

              text = text.replace(
                  anchor,
                  declaration + "\n" + anchor,
                  1
              )

          if "ksu_handle_newfstat_ret(&fd, &statbuf);" not in text:

              start = text.find(
                  "SYSCALL_DEFINE2(newfstat,"
              )

              if start == -1:
                  raise SystemExit(
                      "ERROR: fs/stat.c: newfstat syscall not found"
                  )

              end = text.find(
                  "\n}",
                  start
              )

              if end == -1:
                  raise SystemExit(
                      "ERROR: fs/stat.c: end of newfstat not found"
                  )

              function = text[start:end]

              if "cp_new_stat(&stat, statbuf)" not in function:
                  raise SystemExit(
                      "ERROR: fs/stat.c: unexpected newfstat implementation"
                  )

              function = function.replace(
                  "\treturn error;",
                  """#ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          \treturn error;""",
                  1
              )

              text = text[:start] + function + text[end:]

          # --------------------------------------------------------
          # fstat64 is optional and only added when the syscall
          # actually exists in this kernel.
          # --------------------------------------------------------

          if (
              "SYSCALL_DEFINE2(fstat64" in text
              and "ksu_handle_fstat64_ret(&fd, &statbuf);" not in text
          ):
              start = text.find(
                  "SYSCALL_DEFINE2(fstat64"
              )

              end = text.find(
                  "\n}",
                  start
              )

              if start == -1 or end == -1:
                  raise SystemExit(
                      "ERROR: fs/stat.c: fstat64 implementation not found"
                  )

              function = text[start:end]

              if "cp_new_stat64(&stat, statbuf)" not in function:
                  raise SystemExit(
                      "ERROR: fs/stat.c: unexpected fstat64 implementation"
                  )

              function = function.replace(
                  "\treturn error;",
                  """#ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          \treturn error;""",
                  1
              )

              text = text[:start] + function + text[end:]

          path.write_text(text)
          PY

          grep -n "ksu_handle_newfstat_ret" fs/stat.c

          if grep -q "SYSCALL_DEFINE2(fstat64" fs/stat.c; then
            grep -n "ksu_handle_fstat64_ret" fs/stat.c || true
          fi

      # ==========================================================
      # 11. Verify manual hooks before compiling
      # ==========================================================
      - name: Verify ReSukiSU manual hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          echo "Checking required ReSukiSU hooks..."

          grep -q "ksu_handle_execveat" fs/exec.c
          grep -q "ksu_handle_faccessat" fs/open.c
          grep -q "ksu_handle_stat" fs/stat.c
          grep -q "ksu_handle_newfstat_ret" fs/stat.c
          grep -q "ksu_handle_sys_reboot" kernel/reboot.c

          if ! grep -q "ksu_handle_setresuid" kernel/sys.c; then
            echo "::error::ksu_handle_setresuid hook missing."
            exit 1
          fi

          if ! grep -q "ksu_handle_sys_read" fs/read_write.c; then
            echo "::error::ksu_handle_sys_read hook missing."
            exit 1
          fi

          if ! grep -q "ksu_handle_input_handle_event" drivers/input/input.c; then
            echo "::error::ksu_handle_input_handle_event hook missing."
            exit 1
          fi

          echo "Required manual hooks detected."

      # ==========================================================
      # 12. Prepare build
      # ==========================================================
      - name: Prepare build directory
        run: |
          set -eux

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"

      # ==========================================================
      # 13. Generate defconfig
      # ==========================================================
      - name: Configure kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          make \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            "${DEFCONFIG}"

      # ==========================================================
      # 14. Verify final configuration
      # ==========================================================
      - name: Verify final configuration
        run: |
          set -eux

          CONFIG="${BUILD_DIR}/.config"

          test -f "${CONFIG}"

          REQUIRED_CONFIGS=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for CONFIG_NAME in "${REQUIRED_CONFIGS[@]}"; do
            grep -q "^${CONFIG_NAME}=y$" "${CONFIG}" || {
              echo "::error::${CONFIG_NAME} is not enabled"
              exit 1
            }
          done

          echo "ReSukiSU + SuSFS configuration verified."

      # ==========================================================
      # 15. Build kernel
      # ==========================================================
      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            2>&1 | tee \
            "${GITHUB_WORKSPACE}/kernel-build.log"

      # ==========================================================
      # 16. Verify Image
      # ==========================================================
      - name: Verify kernel image
        run: |
          set -eux

          test -f \
            "${BUILD_DIR}/arch/arm64/boot/Image"

          ls -lh \
            "${BUILD_DIR}/arch/arm64/boot/Image"

      # ==========================================================
      # 17. Download stock boot
      # ==========================================================
      - name: Download stock boot image
        run: |
          set -eux

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "${BOOT_URL}" \
            -o stock-boot.img

          file stock-boot.img

      # ==========================================================
      # 18. Package
      # ==========================================================
      - name: Package artifacts
        run: |
          set -eux

          rm -rf release
          mkdir -p release

          cp \
            "${BUILD_DIR}/arch/arm64/boot/Image" \
            release/Image

          cp \
            stock-boot.img \
            release/stock-boot.img

          cp \
            kernel-build.log \
            release/kernel-build.log

          tar -czf \
            resukisu-susfs-kernel.tar.gz \
            -C release \
            .

      # ==========================================================
      # 19. Upload
      # ==========================================================
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-susfs-kernel
          path: |
            release/
            kernel-build.log
            resukisu-susfs-kernel.tar.gz
          if-no-files-found: warn
