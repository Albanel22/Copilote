name: SuSFS 4.19 - Patch Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_PATH: kernel_src

  ARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

jobs:
  diagnostic:
    name: SuSFS 4.19 patch diagnostic
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            patch \
            perl \
            python3 \
            rsync \
            curl \
            wget

      - name: Clone LineageOS kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${KERNEL_PATH}"

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "Repository:"
          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

      - name: Verify kernel version
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          VERSION=$(awk -F'= ' '/^VERSION = / {print $2; exit}' Makefile)
          PATCHLEVEL=$(awk -F'= ' '/^PATCHLEVEL = / {print $2; exit}' Makefile)
          SUBLEVEL=$(awk -F'= ' '/^SUBLEVEL = / {print $2; exit}' Makefile)

          echo "Kernel version:"
          echo "${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          if [ "${VERSION}.${PATCHLEVEL}" != "4.19" ]; then
            echo "::error::This workflow requires Linux 4.19"
            exit 1
          fi

      - name: Verify defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          FILE="arch/arm64/configs/${DEFCONFIG}"

          echo "Checking:"
          echo "${FILE}"

          test -f "${FILE}"

          echo "Defconfig found."

      - name: Clone JackA1ltman repository
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf NonGKI_Kernel_Build_2nd

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            NonGKI_Kernel_Build_2nd

      - name: Verify SuSFS patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch"

          test -f "${PATCH}"

          echo "SuSFS patch found:"
          ls -lh "${PATCH}"

      - name: Embed ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          curl -LSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            -o setup.sh

          chmod +x setup.sh

          bash setup.sh main

          rm -f setup.sh

          test -d KernelSU

      - name: Apply SuSFS inline hook patches
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh \
            ./susfs_inline_hook_patches.sh

          chmod +x susfs_inline_hook_patches.sh

          bash susfs_inline_hook_patches.sh

          rm -f susfs_inline_hook_patches.sh

      - name: Copy SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch \
            ./susfs_patch_to_4.19.patch

          test -s susfs_patch_to_4.19.patch

      - name: Apply SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "Applying SuSFS 4.19 patch"
          echo "=========================================="

          patch \
            --batch \
            --forward \
            -p1 \
            < susfs_patch_to_4.19.patch

          PATCH_STATUS=$?

          echo
          echo "patch exit code: ${PATCH_STATUS}"

          echo
          echo "Rejected hunks:"

          find . \
            -type f \
            -name "*.rej" \
            -print \
            | sort

          exit 0

      - name: Display rejected hunks
        if: always()
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "namespace.c.rej"
          echo "=========================================="

          if [ -f fs/namespace.c.rej ]; then
            cat fs/namespace.c.rej
          else
            echo "No namespace.c.rej"
          fi

          echo
          echo "=========================================="
          echo "task_mmu.c.rej"
          echo "=========================================="

          if [ -f fs/proc/task_mmu.c.rej ]; then
            cat fs/proc/task_mmu.c.rej
          else
            echo "No task_mmu.c.rej"
          fi

      - name: Display namespace.c context
        if: always()
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "namespace.c - includes"
          echo "=========================================="

          sed -n '1,70p' fs/namespace.c

          echo
          echo "=========================================="
          echo "namespace.c - vfs_kern_mount"
          echo "=========================================="

          sed -n '1030,1135p' fs/namespace.c

      - name: Display task_mmu.c context
        if: always()
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "task_mmu.c - pagemap_read"
          echo "=========================================="

          sed -n '1620,1715p' fs/proc/task_mmu.c

      - name: Create diagnostic directory
        if: always()
        shell: bash
        run: |
          set -e

          mkdir -p diagnostic

          if [ -f "${KERNEL_PATH}/fs/namespace.c.rej" ]; then
            cp \
              "${KERNEL_PATH}/fs/namespace.c.rej" \
              diagnostic/namespace.c.rej
          fi

          if [ -f "${KERNEL_PATH}/fs/proc/task_mmu.c.rej" ]; then
            cp \
              "${KERNEL_PATH}/fs/proc/task_mmu.c.rej" \
              diagnostic/task_mmu.c.rej
          fi

          sed -n '1,70p' \
            "${KERNEL_PATH}/fs/namespace.c" \
            > diagnostic/namespace_includes.txt

          sed -n '1030,1135p' \
            "${KERNEL_PATH}/fs/namespace.c" \
            > diagnostic/namespace_vfs_kern_mount.txt

          sed -n '1620,1715p' \
            "${KERNEL_PATH}/fs/proc/task_mmu.c" \
            > diagnostic/task_mmu_pagemap.txt

          cd "${KERNEL_PATH}"

          git diff --no-ext-diff \
            > ../diagnostic/susfs_applied.diff \
            || true

          cd ..

          {
            echo "SuSFS 4.19 diagnostic"
            echo
            echo "Repository: ${KERNEL_REPO}"
            echo "Branch: ${KERNEL_BRANCH}"
            echo "Commit:"
            git -C "${KERNEL_PATH}" rev-parse HEAD
            echo
            echo "Kernel:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' \
              "${KERNEL_PATH}/Makefile"
          } > diagnostic/BUILD_INFO.txt

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-4.19-diagnostic-${{ github.run_number }}
          path: diagnostic/
          if-no-files-found: warn
          retention-days: 14

      - name: Finish diagnostic
        shell: bash
        run: |
          set -e

          REJECTS=$(find "${KERNEL_PATH}" \
            -type f \
            -name "*.rej" \
            | wc -l)

          echo
          echo "=========================================="
          echo "Diagnostic result"
          echo "=========================================="

          echo "Rejected hunks: ${REJECTS}"

          if [ "${REJECTS}" -gt 0 ]; then
            echo
            echo "SuSFS 4.19 requires adaptation."
            echo "Diagnostic artifact has been uploaded."
            exit 1
          fi

          echo
          echo "SuSFS patch applied without rejects."
