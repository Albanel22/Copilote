name: Kernel CI - kiev 4.19.325 ReSukiSU + SuSFS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2

  KERNEL_DIR: kernel_src
  OUT_DIR: out

  ARCH: arm64
  SUBARCH: arm64

  DEFCONFIG: vendor/lito-perf_defconfig

  DEVICE: kiev
  EXPECTED_KERNEL: "4.19.325"

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

  CCACHE_SIZE: 5G

jobs:
  build:
    name: kiev 4.19.325 + ReSukiSU + SuSFS
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT BUILD REPOSITORY
      # ============================================================

      - name: Checkout Copilote
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ResuKisu+SusFS

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            patch \
            perl \
            python3 \
            rsync \
            unzip \
            zip \
            device-tree-compiler \
            dwarves \
            xz-utils \
            cpio

          echo "=== TOOLCHAIN ==="
          clang --version
          ld.lld --version
          llvm-ar --version

      # ============================================================
      # CLONE LINEAGEOS KERNEL
      # ============================================================

      - name: Clone LineageOS kernel
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${KERNEL_DIR}"

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_DIR}"

          cd "${KERNEL_DIR}"

          echo
          echo "Kernel repository:"
          git remote -v

          echo
          echo "Kernel commit:"
          git log -1 --oneline

      # ============================================================
      # VERIFY KERNEL VERSION
      # ============================================================

      - name: Verify kernel version
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          VERSION="$(awk -F'= ' '/^VERSION =/ {print $2}' Makefile)"
          PATCHLEVEL="$(awk -F'= ' '/^PATCHLEVEL =/ {print $2}' Makefile)"
          SUBLEVEL="$(awk -F'= ' '/^SUBLEVEL =/ {print $2}' Makefile)"

          DETECTED="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo "Detected kernel: ${DETECTED}"
          echo "Expected kernel: ${EXPECTED_KERNEL}"

          if [ "${DETECTED}" != "${EXPECTED_KERNEL}" ]; then
            echo "::error::Wrong kernel version."
            exit 1
          fi

          echo "Kernel version OK."

      # ============================================================
      # VERIFY DEFCONFIG
      # ============================================================

      - name: Verify lito defconfig
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          CONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"

          if [ ! -f "${CONFIG_PATH}" ]; then
            echo "::error::Missing ${CONFIG_PATH}"
            exit 1
          fi

          echo "Defconfig found:"
          echo "${CONFIG_PATH}"

          echo
          echo "=== KSU / SUSFS OPTIONS ALREADY PRESENT ==="

          grep -E \
            '^(CONFIG_KSU|CONFIG_SUKISU|CONFIG_KSU_SUSFS)' \
            "${CONFIG_PATH}" || true

      # ============================================================
      # VERIFY EXISTING COPILOTE PATCHES
      # ============================================================

      - name: Inspect integration files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== COPILOTE ROOT ==="
          ls -la

          echo
          echo "=== AVAILABLE PATCHES ==="

          find . -maxdepth 3 -type f \
            \( \
              -iname '*susfs*' \
              -o -iname '*ksu*' \
              -o -iname '*resuki*' \
            \) \
            -print | sort || true

      # ============================================================
      # APPLY RESUKISU / SUSFS PATCHES ONLY WHEN NEEDED
      # ============================================================

      - name: Apply Copilote integration patches
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          echo "Checking existing ReSukiSU/SuSFS integration..."

          if [ -d "drivers/kernelsu" ] || [ -d "drivers/ksu" ]; then
            echo "KernelSU/ReSukiSU source already present."
            echo "No automatic setup.sh execution."
          else
            echo "::error::ReSukiSU/KernelSU source is not present in the LineageOS kernel."
            echo
            echo "The Copilote repository contains integration material,"
            echo "but no automatic blind patching will be performed."
            echo
            echo "This prevents corrupting the 4.19.325 kernel tree."
            exit 1
          fi

      # ============================================================
      # VERIFY SUSFS SOURCE
      # ============================================================

      - name: Verify SuSFS source
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          echo "Searching for SuSFS..."

          SUSFS_FILES="$(find . -type f \
            \( -name 'susfs.c' -o -name 'susfs.h' \) \
            -print)"

          if [ -z "${SUSFS_FILES}" ]; then
            echo "::error::SuSFS source was not found in kernel tree."
            exit 1
          fi

          echo "${SUSFS_FILES}"

      # ============================================================
      # VERIFY MANUAL HOOK
      # ============================================================

      - name: Verify Manual Hook
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          echo "Searching Manual Hook support..."

          if grep -Rqs \
            "CONFIG_KSU_MANUAL_HOOK" \
            drivers/kernelsu \
            drivers/ksu \
            2>/dev/null; then

            echo "Manual Hook support detected."

          else
            echo "::warning::Manual Hook source reference not detected."
          fi

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: kiev-4.19.325-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            kiev-4.19.325-${{ runner.os }}-
            kiev-4.19-
            kiev-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.cache/ccache"

          ccache --set-config=max_size="${CCACHE_SIZE}"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          ccache --zero-stats

      # ============================================================
      # PREPARE OUTPUT
      # ============================================================

      - name: Prepare build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

      # ============================================================
      # GENERATE DEFCONFIG
      # ============================================================

      - name: Generate kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          make \
            O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            "${DEFCONFIG}"

          make \
            O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            olddefconfig

      # ============================================================
      # VERIFY FINAL CONFIG
      # ============================================================

      - name: Verify final KSU and SuSFS config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"

          test -f "${CONFIG}"

          echo
          echo "=========================================="
          echo "FINAL KSU / SUSFS CONFIG"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_SUKISU|CONFIG_KSU_SUSFS)' \
            "${CONFIG}" || true

          echo
          echo "Checking mandatory options..."

          REQUIRED="
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_CALLBACK=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_MOUNT_UNMOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          "

          while IFS= read -r option; do
            [ -z "${option}" ] && continue

            if ! grep -q "^${option}$" "${CONFIG}"; then
              echo "::error::Missing: ${option}"
              exit 1
            fi

            echo "OK: ${option}"
          done <<< "${REQUIRED}"

          echo
          echo "ReSukiSU + SuSFS configuration OK."

      # ============================================================
      # DOWNLOAD LINEAGEOS BOOT
      # ============================================================

      - name: Download LineageOS kiev boot.img
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p boot

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o boot/boot.img \
            "${BOOT_URL}"

          test -s boot/boot.img

          echo "boot.img downloaded:"
          ls -lh boot/boot.img

          file boot/boot.img

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          export PATH="/usr/lib/ccache:${PATH}"

          echo
          echo "=========================================="
          echo "BUILDING KERNEL"
          echo "=========================================="

          echo "Device:     ${DEVICE}"
          echo "Kernel:     ${EXPECTED_KERNEL}"
          echo "Arch:       ${ARCH}"
          echo "Defconfig:  ${DEFCONFIG}"
          echo "Root:       ReSukiSU"
          echo "Hook:       Manual Hook"
          echo "SuSFS:      enabled"

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            SUBARCH="${SUBARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      # ============================================================
      # BUILD DTBS
      # ============================================================

      - name: Build DTBs
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbs

      # ============================================================
      # LOCATE IMAGE
      # ============================================================

      - name: Locate kernel Image
        shell: bash
        run: |
          set -euo pipefail

          BOOT_DIR="${OUT_DIR}/arch/${ARCH}/boot"

          echo "=== BOOT DIRECTORY ==="
          find "${BOOT_DIR}" -maxdepth 3 -type f -print | sort

          IMAGE=""

          for candidate in \
            Image.gz-dtb \
            Image.lz4-dtb \
            Image.gz \
            Image.lz4 \
            Image
          do
            if [ -f "${BOOT_DIR}/${candidate}" ]; then
              IMAGE="${BOOT_DIR}/${candidate}"
              break
            fi
          done

          if [ -z "${IMAGE}" ]; then
            echo "::error::Kernel Image not found."
            exit 1
          fi

          echo "KERNEL_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

          echo
          echo "Selected image:"
          ls -lh "${IMAGE}"

      # ============================================================
      # VERIFY VMLINUX
      # ============================================================

      - name: Verify kernel symbols
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${OUT_DIR}/vmlinux" ]; then
            echo "::warning::vmlinux not found."
            exit 0
          fi

          echo "Checking ReSukiSU / SuSFS symbols..."

          nm "${OUT_DIR}/vmlinux" 2>/dev/null \
            | grep -E 'ksu_|susfs_' \
            | head -100 \
            || true

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp "${KERNEL_IMAGE}" \
            artifacts/

          cp "${OUT_DIR}/.config" \
            artifacts/kernel.config

          if [ -f "${OUT_DIR}/vmlinux" ]; then
            cp "${OUT_DIR}/vmlinux" \
              artifacts/
          fi

          if [ -d "${OUT_DIR}/arch/${ARCH}/boot/dts" ]; then
            tar \
              -C "${OUT_DIR}/arch/${ARCH}/boot" \
              -czf artifacts/dtb.tar.gz \
              dts
          fi

          cp boot/boot.img \
            artifacts/lineage-kiev-20260809-original-boot.img

          cat > artifacts/build-info.txt <<EOF
          Device: Motorola One 5G Ace
          Codename: kiev
          Kernel: 4.19.325
          Android: 16
          LineageOS: 23.2
          Architecture: arm64
          Defconfig: vendor/lito-perf_defconfig
          Root: ReSukiSU
          Hook: Manual Hook
          SuSFS: enabled
          Boot source: LineageOS 2026-08-09
          Repository: Albanel22/Copilote
          Kernel repository: LineageOS/android_kernel_motorola_sm8250
          Kernel branch: lineage-23.2
          Commit: ${GITHUB_SHA}
          EOF

          zip -r \
            "kiev-4.19.325-ReSukiSU-SuSFS-${GITHUB_RUN_NUMBER}.zip" \
            artifacts

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiev-4.19.325-ReSukiSU-SuSFS
          path: |
            artifacts/
            kiev-4.19.325-ReSukiSU-SuSFS-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: ccache statistics
        shell: bash
        run: |
          ccache --show-stats || true
