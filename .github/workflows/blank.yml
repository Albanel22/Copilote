name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2

  KERNEL_PATH: kernel_src
  BUILD_DIR: out

  ARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

  CCACHE_SIZE: 5G

jobs:
  build:
    name: Build 4.19 - ReSukiSU + SuSFS
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Dependencies
      # ============================================================
      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            device-tree-compiler

      # ============================================================
      # 3. Clone exact LineageOS kernel
      # ============================================================
      - name: Clone kernel source
        run: |
          set -euxo pipefail

          rm -rf "${KERNEL_PATH}"

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "Kernel commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          head -n 5 Makefile

      # ============================================================
      # 4. Clone JackA1ltman NonGKI helper repository
      # ============================================================
      - name: Clone NonGKI helper repository
        run: |
          set -euxo pipefail

          rm -rf nongki

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            nongki

          echo "NonGKI commit:"
          git -C nongki rev-parse HEAD

      # ============================================================
      # 5. Detect kernel version
      # ============================================================
      - name: Detect kernel version
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          KVER="$(
            head -n 2 Makefile |
            awk '
              /VERSION/    { v=$3 }
              /PATCHLEVEL/ { p=$3 }
              END { print v "." p }
            '
          )"

          echo "Detected kernel version: ${KVER}"

          if [ "${KVER}" != "4.19" ]; then
            echo "::error::Expected kernel 4.19 but detected ${KVER}"
            exit 1
          fi

      # ============================================================
      # 6. Clean any previous KernelSU installation
      # ============================================================
      - name: Clean existing KernelSU integration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          if [ -f "../nongki/bin/clean_hook.sh" ]; then
            cp ../nongki/bin/clean_hook.sh .
            chmod +x clean_hook.sh

            ./clean_hook.sh || true

            rm -f clean_hook.sh
          fi

          rm -rf KernelSU

      # ============================================================
      # 7. Install current ReSukiSU
      # ============================================================
      - name: Install current ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          curl -LSs "${RESUKISU_SETUP}" | bash -s main

          test -d KernelSU
          test -e drivers/kernelsu

          echo
          echo "ReSukiSU installed:"
          git -C KernelSU rev-parse HEAD || true

      # ============================================================
      # 8. Add base ReSukiSU configuration to defconfig
      # ============================================================
      - name: Configure ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          test -f "${DEFCONFIG_FILE}"

          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/vendor/lito-perf_defconfig")
          text = path.read_text()

          configs = [
              "CONFIG_KSU=y",
              "CONFIG_KSU_MANUAL_HOOK=y",
              "CONFIG_KALLSYMS=y",
              "CONFIG_KALLSYMS_ALL=y",

              "CONFIG_KSU_SUSFS=y",
              "CONFIG_KSU_SUSFS_SUS_PATH=y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT=y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG=y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y",
              "CONFIG_KSU_SUSFS_SUS_MAP=y",
          ]

          lines = text.splitlines()

          for config in configs:
              key = config.split("=")[0]

              if not any(line.startswith(key + "=") for line in lines):
                  lines.append(config)

          path.write_text("\n".join(lines) + "\n")
          PY

      # ============================================================
      # 9. Apply JackA1ltman SuSFS inline hooks
      # ============================================================
      - name: Apply JackA1ltman SuSFS inline hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          cp ../nongki/Patches/susfs_inline_hook_patches.sh .

          chmod +x susfs_inline_hook_patches.sh

          ./susfs_inline_hook_patches.sh

      # ============================================================
      # 10. Apply ReSukiSU manual hooks robustly
      #
      # IMPORTANT:
      # Do not use brittle exact multi-line matching.
      # The source formatting of LineageOS 4.19 differs.
      # ============================================================
      - name: Fix ReSukiSU manual hooks for LineageOS 4.19
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("fs/stat.c")
          text = path.read_text()

          # --------------------------------------------------------
          # ReSukiSU declarations
          # --------------------------------------------------------
          declaration = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
                                     const char __user **filename_user,
                                     int *flags);

          extern void ksu_handle_newfstat_ret(
              unsigned int *fd,
              struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd,
              struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          '''

          if "ksu_handle_newfstat_ret" not in text:
              anchor = "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/stat.c: newfstat declaration anchor not found"
                  )

              text = text.replace(
                  anchor,
                  declaration + anchor,
                  1
              )

          # --------------------------------------------------------
          # newfstat() return hook
          # --------------------------------------------------------
          if "ksu_handle_newfstat_ret(&fd, &statbuf);" not in text:

              pattern = re.compile(
                  r'(SYSCALL_DEFINE2\(newfstat,\s*'
                  r'unsigned int,\s*fd,\s*'
                  r'struct stat __user \*,\s*statbuf\)'
                  r'\s*\{.*?'
                  r'if\s*\(!error\)\s*'
                  r'error\s*=\s*cp_new_stat\(&stat,\s*statbuf\);)',
                  re.S
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: fs/stat.c: SYSCALL_DEFINE2(newfstat) not found"
                  )

              replacement = (
                  match.group(1)
                  + "\n\n"
                  + "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  + "\tksu_handle_newfstat_ret(&fd, &statbuf);\n"
                  + "#endif"
              )

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

          # --------------------------------------------------------
          # fstat64() return hook
          # --------------------------------------------------------
          if (
              "ksu_handle_fstat64_ret(&fd, &statbuf);" not in text
              and re.search(r'SYSCALL_DEFINE2\(fstat64', text)
          ):

              pattern = re.compile(
                  r'(SYSCALL_DEFINE2\(fstat64,\s*'
                  r'unsigned long,\s*fd,\s*'
                  r'struct stat64 __user \*,\s*statbuf\)'
                  r'\s*\{.*?'
                  r'if\s*\(!error\)\s*'
                  r'error\s*=\s*cp_new_stat64\(&stat,\s*statbuf\);)',
                  re.S
              )

              match = pattern.search(text)

              if match:
                  replacement = (
                      match.group(1)
                      + "\n\n"
                      + "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                      + "\tksu_handle_fstat64_ret(&fd, &statbuf);\n"
                      + "#endif"
                  )

                  text = (
                      text[:match.start()]
                      + replacement
                      + text[match.end():]
                  )

          path.write_text(text)

          print("ReSukiSU stat hooks installed.")
          PY

          grep -n "ksu_handle_newfstat_ret" fs/stat.c
          grep -n "ksu_handle_fstat64_ret" fs/stat.c || true

      # ============================================================
      # 11. Download JackA1ltman 4.19 SuSFS patch
      # ============================================================
      - name: Prepare SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          cp ../nongki/Patches/Patch/susfs_patch_to_4.19.patch .

          test -s susfs_patch_to_4.19.patch

          echo "SuSFS patch:"
          wc -l susfs_patch_to_4.19.patch

      # ============================================================
      # 12. Apply SuSFS patch
      # ============================================================
      - name: Apply SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          find . -type f -name "*.rej" -delete
          find . -type f -name "*.orig" -delete

          patch -p1 < susfs_patch_to_4.19.patch || true

          echo
          echo "Checking SuSFS rejected hunks..."

          find . -type f -name "*.rej" -print || true

      # ============================================================
      # 13. Manually resolve the two known 4.19 rejects
      #
      # fs/namespace.c
      # fs/proc/task_mmu.c
      # ============================================================
      - name: Resolve known SuSFS 4.19 rejects
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          # ========================================================
          # fs/namespace.c
          # ========================================================
          path = Path("fs/namespace.c")
          text = path.read_text()

          # Header
          if (
              "CONFIG_KSU_SUSFS_SUS_MOUNT"
              not in text
              or "#include <linux/susfs_def.h>" not in text
          ):
              anchor = "#include <linux/sched/task.h>"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: namespace.c: include anchor not found"
                  )

              block = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          #include <linux/susfs_def.h>
          #endif
          """

              text = text.replace(
                  anchor,
                  anchor + "\n" + block.rstrip(),
                  1
              )

          # Declarations
          if "susfs_is_current_ksu_domain" not in text:
              anchor = '#include "internal.h"'

              block = """
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          extern bool susfs_is_current_ksu_domain(void);
          extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;

          #define CL_COPY_MNT_NS BIT(25)
          #endif
          """

              text = text.replace(
                  anchor,
                  anchor + block,
                  1
              )

          # --------------------------------------------------------
          # Current LineageOS 4.19 uses vfs_create_mount().
          #
          # JackA1ltman's wiki explicitly gives this form for
          # kernels where alloc_vfsmnt() receives fc->source.
          # --------------------------------------------------------
          if (
              "susfs_alloc_non_unshare_ksu_vfsmnt("
              not in text
          ):

              old = """\tsb = fc->root->d_sb;
          \tmnt = alloc_vfsmnt(fc->source ?: "none");
          \tif (!mnt)
          \t\treturn ERR_PTR(-ENOMEM);
          """

              new = """\tsb = fc->root->d_sb;

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tif (static_branch_unlikely(
          \t\t&susfs_is_sdcard_android_data_not_decrypted)) {
          \t\tif (susfs_is_current_ksu_domain()) {
          \t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(
          \t\t\t\tfc->source ?: "none");
          \t\t\tgoto bypass_orig_flow;
          \t\t}
          \t}
          #endif

          \tmnt = alloc_vfsmnt(fc->source ?: "none");

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          bypass_orig_flow:
          #endif

          \tif (!mnt)
          \t\treturn ERR_PTR(-ENOMEM);
          """

              if old in text:
                  text = text.replace(old, new, 1)
              else:
                  # Less strict fallback.
                  marker = '\tmnt = alloc_vfsmnt(fc->source ?: "none");'

                  if marker not in text:
                      raise SystemExit(
                          "ERROR: namespace.c: vfs_create_mount alloc_vfsmnt anchor not found"
                      )

                  replacement = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tif (static_branch_unlikely(
          \t\t&susfs_is_sdcard_android_data_not_decrypted)) {
          \t\tif (susfs_is_current_ksu_domain()) {
          \t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(
          \t\t\t\tfc->source ?: "none");
          \t\t\tgoto bypass_orig_flow;
          \t\t}
          \t}
          #endif

          \tmnt = alloc_vfsmnt(fc->source ?: "none");

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          bypass_orig_flow:
          #endif
          """

                  text = text.replace(
                      marker,
                      replacement.rstrip(),
                      1
                  )

          path.write_text(text)

          # ========================================================
          # fs/proc/task_mmu.c
          # ========================================================
          path = Path("fs/proc/task_mmu.c")
          text = path.read_text()

          # Ensure vma declaration exists in pagemap_read.
          if "static ssize_t pagemap_read" not in text:
              raise SystemExit(
                  "ERROR: task_mmu.c: pagemap_read not found"
              )

          # Locate function region.
          start = text.index("static ssize_t pagemap_read")
          end = text.index(
              "\nstatic int pagemap_open",
              start
          )

          func = text[start:end]

          if "struct vm_area_struct *vma;" not in func:
              anchor = "struct mm_walk pagemap_walk = {};"

              if anchor not in func:
                  raise SystemExit(
                      "ERROR: task_mmu.c: pagemap_walk anchor not found"
                  )

              func = func.replace(
                  anchor,
                  anchor + "\n\tstruct vm_area_struct *vma;",
                  1
              )

          # Add SUS_MAP bypass immediately before walk_page_range.
          if "SUSFS_IS_INODE_SUS_MAP" not in func:

              anchor = "\t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);"

              if anchor not in func:
                  raise SystemExit(
                      "ERROR: task_mmu.c: walk_page_range anchor not found"
                  )

              replacement = """#ifdef CONFIG_KSU_SUSFS_SUS_MAP
          \t\tvma = find_vma(mm, start_vaddr);
          \t\tif (vma && vma->vm_file &&
          \t\t    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))
          \t\t\tgoto bypass_orig_flow;
          #endif

          \t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          bypass_orig_flow:
          #endif"""

              func = func.replace(
                  anchor,
                  replacement,
                  1
              )

          text = text[:start] + func + text[end:]

          path.write_text(text)

          PY

      # ============================================================
      # 14. Remove .rej files only after successful manual fixes
      # ============================================================
      - name: Verify SuSFS integration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          echo "Checking rejected hunks..."

          REJECTS="$(find . -type f -name "*.rej" | wc -l)"

          echo "Rejected hunks: ${REJECTS}"

          if [ "${REJECTS}" -gt 0 ]; then
            echo
            echo "Remaining rejects:"
            find . -type f -name "*.rej" -print

            echo
            for rej in $(find . -type f -name "*.rej"); do
              echo "========== ${rej} =========="
              cat "${rej}"
              echo
            done

            exit 1
          fi

          rm -f \
            fs/namespace.c.rej \
            fs/proc/task_mmu.c.rej

          echo "SuSFS source integration has no rejected hunks."

      # ============================================================
      # 15. Prepare kernel configuration
      # ============================================================
      - name: Prepare kernel configuration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          mkdir -p "../${BUILD_DIR}"

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            "${DEFCONFIG}"

      # ============================================================
      # 16. Force required options
      # ============================================================
      - name: Enable required kernel options
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          scripts/config \
            --file "../${BUILD_DIR}/.config" \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_MANUAL_HOOK \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            --enable CONFIG_KSU_SUSFS_SUS_MAP

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            olddefconfig

      # ============================================================
      # 17. Verify hooks before compilation
      # ============================================================
      - name: Verify ReSukiSU hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          CONFIG="../${BUILD_DIR}/.config"

          required_configs=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for CONFIG in "${required_configs[@]}"; do
            grep -q "^${CONFIG}=y$" "${CONFIG_FILE:-$CONFIG}" 2>/dev/null || true
          done

          grep -q '^CONFIG_KSU=y$' "${CONFIG}"
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "${CONFIG}"
          grep -q '^CONFIG_KALLSYMS=y$' "${CONFIG}"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "${CONFIG}"

          grep -q 'ksu_handle_newfstat_ret' fs/stat.c
          grep -q 'ksu_handle_fstat64_ret' fs/stat.c || true

          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_stat' fs/stat.c

          echo "All mandatory ReSukiSU hooks detected."

      # ============================================================
      # 18. Configure ccache
      # ============================================================
      - name: Configure ccache
        run: |
          set -euxo pipefail

          mkdir -p ~/.cache/ccache

          ccache --max-size="${CCACHE_SIZE}"
          ccache --zero-stats

          echo "CCACHE_DIR=${HOME}/.cache/ccache" >> "${GITHUB_ENV}"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-4.19-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-4.19-

      # ============================================================
      # 19. Build kernel
      # ============================================================
      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          export ARCH="${ARCH}"
          export LLVM=1
          export LLVM_IAS=1

          make \
            -C . \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc --all)"

      # ============================================================
      # 20. Verify final kernel image
      # ============================================================
      - name: Verify build output
        run: |
          set -euxo pipefail

          echo "Build directory:"
          ls -lah "${BUILD_DIR}"

          echo
          echo "Searching kernel images..."

          find "${BUILD_DIR}" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "*.dtb" \
            \) \
            -print

          test -f "${BUILD_DIR}/arch/arm64/boot/Image"

      # ============================================================
      # 21. Download stock boot.img
      # ============================================================
      - name: Download stock boot image
        run: |
          set -euxo pipefail

          mkdir -p boot

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            "${BOOT_URL}" \
            -o boot/boot.img

          test -s boot/boot.img

          ls -lh boot/boot.img

      # ============================================================
      # 22. Package build artifacts
      # ============================================================
      - name: Prepare artifacts
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cp "${BUILD_DIR}/arch/arm64/boot/Image" \
             artifacts/Image

          if [ -f "${BUILD_DIR}/arch/arm64/boot/Image.gz" ]; then
            cp "${BUILD_DIR}/arch/arm64/boot/Image.gz" \
               artifacts/Image.gz
          fi

          if [ -f "${BUILD_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${BUILD_DIR}/arch/arm64/boot/Image.gz-dtb" \
               artifacts/Image.gz-dtb
          fi

          cp boot/boot.img artifacts/boot-stock.img

          cp "${BUILD_DIR}/.config" \
             artifacts/kernel.config

          tar -czf \
            artifacts/kernel-source-modifications.tar.gz \
            "${KERNEL_PATH}/KernelSU" \
            "${KERNEL_PATH}/fs/susfs.c" \
            "${KERNEL_PATH}/include/linux/susfs.h" \
            "${KERNEL_PATH}/include/linux/susfs_def.h"

          echo
          echo "Artifacts:"
          ls -lah artifacts

      # ============================================================
      # 23. Upload artifacts
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-resukisu-susfs-4.19
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
