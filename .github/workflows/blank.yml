name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: lito-perf_defconfig

  # ReSukiSU
  RESUKISU_BRANCH: main

  # JackA1ltman NonGKI_Kernel_Build_2nd
  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  # Kernel
  KERNEL_VERSION: "4.19"

  # Build
  CCACHE_SIZE: 5G

  # Stock boot image
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260726/boot.img

jobs:
  build:
    name: Kernel 4.19 - ReSukiSU + SuSFS
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: test-sukisu
          fetch-depth: 1
          submodules: recursive

      # ==========================================================
      # 2. DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            device-tree-compiler \
            python3 \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            patch \
            perl

      # ==========================================================
      # 3. CCACHE
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-4.19-resukisu-susfs-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-kernel-4.19-resukisu-susfs-
            ${{ runner.os }}-kernel-4.19-

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ~/.cache/ccache

          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=${CCACHE_SIZE}
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content

          ccache --show-config

      # ==========================================================
      # 4. VERIFY KERNEL VERSION
      # ==========================================================

      - name: Verify kernel source and version
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          test -f Makefile

          echo "Kernel Makefile:"
          head -n 10 Makefile

          VERSION=$(grep '^VERSION = ' Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep '^PATCHLEVEL = ' Makefile | awk '{print $3}')

          DETECTED="${VERSION}.${PATCHLEVEL}"

          echo "Detected kernel version: ${DETECTED}"

          if [ "${DETECTED}" != "${KERNEL_VERSION}" ]; then
            echo "::error::Expected kernel ${KERNEL_VERSION}, detected ${DETECTED}"
            exit 1
          fi

      # ==========================================================
      # 5. CLONE JACKA1LTMAN REPOSITORY
      # ==========================================================

      - name: Clone NonGKI_Kernel_Build_2nd
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf NonGKI_Kernel_Build_2nd

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            NonGKI_Kernel_Build_2nd

          echo "Repository:"
          find NonGKI_Kernel_Build_2nd/Patches \
            -maxdepth 2 \
            -type f \
            | sort

      # ==========================================================
      # 6. CHECK EXISTING KERNELSU
      # ==========================================================

      - name: Check existing KernelSU installation
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d KernelSU ]; then
            echo "Existing KernelSU directory detected."
            echo "Cleaning it according to JackA1ltman wiki."

            test -f ../NonGKI_Kernel_Build_2nd/bin/clean_hook.sh

            cp \
              ../NonGKI_Kernel_Build_2nd/bin/clean_hook.sh \
              ./clean_hook.sh

            chmod +x ./clean_hook.sh

            bash ./clean_hook.sh

            rm -f ./clean_hook.sh
          else
            echo "No existing KernelSU directory."
          fi

          if grep -Rqs \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.cmd' \
            'CONFIG_KSU' \
            fs/exec.c 2>/dev/null; then

            echo "::warning::CONFIG_KSU references already exist in fs/exec.c"
          fi

      # ==========================================================
      # 7. EMBED RESUKISU
      # ==========================================================

      - name: Embed ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Embedding ReSukiSU according to JackA1ltman wiki."

          curl -LSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            -o setup.sh

          test -s setup.sh

          chmod +x setup.sh

          bash setup.sh "${RESUKISU_BRANCH}"

          test -d KernelSU

          rm -f setup.sh

      # ==========================================================
      # 8. VERIFY DEFCONFIG
      # ==========================================================

      - name: Verify defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          if [ ! -f "${DEFCONFIG_FILE}" ]; then
            echo "::error::Defconfig not found: ${DEFCONFIG_FILE}"

            find arch/arm64/configs \
              -type f \
              | sort \
              | head -100

            exit 1
          fi

          echo "Using:"
          echo "${DEFCONFIG_FILE}"

      # ==========================================================
      # 9. ADD KSU CONFIGURATION
      # ==========================================================

      - name: Configure ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          # Remove previous definitions to avoid duplicates.
          sed -i '/^CONFIG_KSU=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_MANUAL_HOOK=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KALLSYMS=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KALLSYMS_ALL=/d' "${DEFCONFIG_FILE}"

          cat >> "${DEFCONFIG_FILE}" <<'EOF'

          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          echo "ReSukiSU configuration:"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS)' \
            "${DEFCONFIG_FILE}"

      # ==========================================================
      # 10. APPLY SUSFS INLINE HOOK
      # ==========================================================

      - name: Apply SuSFS inline hook patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Using the script specified by JackA1ltman wiki:"
          echo "susfs_inline_hook_patches.sh"

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh \
            ./susfs_inline_hook_patches.sh

          chmod +x ./susfs_inline_hook_patches.sh

          bash ./susfs_inline_hook_patches.sh

          rm -f ./susfs_inline_hook_patches.sh

      # ==========================================================
      # 11. LOCATE VERSION-SPECIFIC SUSFS PATCH
      # ==========================================================

      - name: Locate SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          PATCH_FILE="../NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_${KERNEL_VERSION}.patch"

          if [ ! -f "${PATCH_FILE}" ]; then
            echo "::error::SuSFS patch not found:"
            echo "${PATCH_FILE}"

            echo
            echo "Available SuSFS patches:"

            find ../NonGKI_Kernel_Build_2nd/Patches/Patch \
              -maxdepth 1 \
              -type f \
              -iname '*susfs*' \
              | sort

            exit 1
          fi

          cp \
            "${PATCH_FILE}" \
            "./susfs_patch_to_${KERNEL_VERSION}.patch"

          echo "Selected:"
          echo "./susfs_patch_to_${KERNEL_VERSION}.patch"

      # ==========================================================
      # 12. BACKUP BEFORE SUSFS PATCH
      # ==========================================================

      - name: Backup kernel before SuSFS patch
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel_before_susfs

          cp -a \
            "${KERNEL_PATH}" \
            kernel_before_susfs

          echo "Backup created."

      # ==========================================================
      # 13. APPLY SUSFS PATCH
      # ==========================================================

      - name: Apply SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          PATCH_FILE="susfs_patch_to_${KERNEL_VERSION}.patch"

          echo "Applying:"
          echo "${PATCH_FILE}"

          patch \
            --batch \
            --forward \
            -p1 \
            < "${PATCH_FILE}"

          echo
          echo "Checking rejected hunks..."

          REJECTS=$(find . \
            -type f \
            -name '*.rej' \
            -print)

          if [ -n "${REJECTS}" ]; then
            echo
            echo "=========================================="
            echo "SUSFS PATCH REJECTS DETECTED"
            echo "=========================================="

            echo "${REJECTS}"

            echo
            echo "The JackA1ltman wiki requires manual"
            echo "patching of these hunks."
            echo

            while IFS= read -r file; do
              echo
              echo "========== ${file} =========="
              cat "${file}"
            done <<< "${REJECTS}"

            echo
            echo "::error::SuSFS patch did not apply cleanly."
            echo "::error::Build intentionally stopped before compilation."

            exit 1
          fi

          echo
          echo "SuSFS patch applied cleanly."

      # ==========================================================
      # 14. ADD SUSFS CONFIGURATION
      # ==========================================================

      - name: Configure SuSFS
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          # Remove previous definitions.
          sed -i '/^CONFIG_KSU_SUSFS=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_SUSFS_SUS_PATH=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_SUSFS_SUS_MOUNT=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_SUSFS_SUS_KSTAT=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_SUSFS_SPOOF_UNAME=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_SUSFS_ENABLE_LOG=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_SUSFS_OPEN_REDIRECT=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_SUSFS_SUS_MAP=/d' "${DEFCONFIG_FILE}"

          cat >> "${DEFCONFIG_FILE}" <<'EOF'

          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          echo "SuSFS configuration:"
          grep '^CONFIG_KSU_SUSFS' "${DEFCONFIG_FILE}"

      # ==========================================================
      # 15. SAVE PATCHED SOURCE
      # ==========================================================

      - name: Generate patched source diff
        shell: bash
        run: |
          set -euxo pipefail

          cd "${KERNEL_PATH}"

          git diff --no-ext-diff > ../susfs_applied.diff || true

          echo "Generated:"
          ls -lh ../susfs_applied.diff || true

      # ==========================================================
      # 16. CONFIGURE KERNEL
      # ==========================================================

      - name: Run defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "../${BUILD_DIR}"

          export ARCH="${ARCH}"
          export SUBARCH="${SUBARCH}"

          make \
            O="../${BUILD_DIR}" \
            "${DEFCONFIG}"

          test -f "../${BUILD_DIR}/.config"

          echo
          echo "Final KSU/SuSFS configuration:"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS)' \
            "../${BUILD_DIR}/.config" \
            | sort

      # ==========================================================
      # 17. BUILD
      # ==========================================================

      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          set -euxo pipefail

          export ARCH="${ARCH}"
          export SUBARCH="${SUBARCH}"

          export LLVM=1
          export LLVM_IAS=1

          export CC="ccache clang"
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make \
            -j"$(nproc)" \
            O="../${BUILD_DIR}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

          echo
          echo "Build completed."

          ccache --show-stats

      # ==========================================================
      # 18. VERIFY IMAGE
      # ==========================================================

      - name: Verify kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="${KERNEL_PATH}/${BUILD_DIR}/arch/arm64/boot/Image"

          test -f "${IMAGE}"

          ls -lh "${IMAGE}"

      # ==========================================================
      # 19. DOWNLOAD STOCK BOOT
      # ==========================================================

      - name: Download stock boot image
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p boot

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            "${BOOT_URL}" \
            -o boot/stock_boot.img

          test -s boot/stock_boot.img

          ls -lh boot/stock_boot.img

      # ==========================================================
      # 20. PREPARE ARTIFACTS
      # ==========================================================

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf release
          mkdir -p release

          cp \
            "${KERNEL_PATH}/${BUILD_DIR}/arch/arm64/boot/Image" \
            release/Image

          cp \
            boot/stock_boot.img \
            release/stock_boot.img

          cp \
            "${KERNEL_PATH}/${BUILD_DIR}/.config" \
            release/kernel.config

          cp \
            "${KERNEL_PATH}/arch/arm64/configs/${DEFCONFIG}" \
            release/${DEFCONFIG}

          cp \
            susfs_applied.diff \
            release/susfs_applied.diff

          cat > release/BUILD_INFO.txt <<EOF
          Kernel CI
          ================================

          Kernel version: ${KERNEL_VERSION}
          Architecture: ${ARCH}
          Defconfig: ${DEFCONFIG}

          Root:
          ReSukiSU

          SuSFS:
          JackA1ltman NonGKI_Kernel_Build_2nd
          susfs_inline_hook_patches.sh
          susfs_patch_to_4.19.patch

          Git ref:
          ${GITHUB_REF_NAME}

          Commit:
          ${GITHUB_SHA}

          Run:
          ${GITHUB_RUN_NUMBER}
          EOF

          ls -lah release

      # ==========================================================
      # 21. PACKAGE
      # ==========================================================

      - name: Package kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd release

          zip -9 \
            "../ReSukiSU-SuSFS-4.19-${GITHUB_RUN_NUMBER}.zip" \
            Image \
            stock_boot.img \
            kernel.config \
            "${DEFCONFIG}" \
            susfs_applied.diff \
            BUILD_INFO.txt

          cd ..

          ls -lh \
            "ReSukiSU-SuSFS-4.19-${GITHUB_RUN_NUMBER}.zip"

      # ==========================================================
      # 22. UPLOAD ARTIFACTS
      # ==========================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-SuSFS-4.19-${{ github.run_number }}
          path: |
            release/
            ReSukiSU-SuSFS-4.19-${{ github.run_number }}.zip
            susfs_applied.diff
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # 23. SUMMARY
      # ==========================================================

      - name: Build summary
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo "Kernel       : ${KERNEL_VERSION}"
          echo "Architecture : ${ARCH}"
          echo "Defconfig    : ${DEFCONFIG}"
          echo "Root         : ReSukiSU"
          echo "SuSFS        : enabled"
          echo
          echo "Artifacts:"
          ls -lah release/

