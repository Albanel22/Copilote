```yaml
name: Copilote - ReSukiSU Root Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ARCH: arm64
  SUBARCH: arm64

  # ------------------------------------------------------------------
  # KERNEL
  # Ces valeurs seront adaptées à Copilote après validation du ZIP.
  # ------------------------------------------------------------------
  KERNEL_DIR: kernel_src
  OUT_DIR: out

  # ------------------------------------------------------------------
  # ReSukiSU
  #
  # IMPORTANT :
  # Aucun tag/version/commit n'est imposé.
  # setup.sh est toujours récupéré depuis main.
  # ------------------------------------------------------------------
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  RESUKISU_BRANCH: main

  # ------------------------------------------------------------------
  # ROOT
  # ------------------------------------------------------------------
  KSU_MANUAL_HOOK: y

  # SUSFS volontairement désactivé pour cette phase.
  ENABLE_SUSFS: false

  # ------------------------------------------------------------------
  # BOOT IMAGE DE TEST
  #
  # Le résultat est destiné à :
  #
  #     fastboot boot boot.img
  #
  # et non à un flash permanent.
  # ------------------------------------------------------------------
  BUILD_TEST_BOOT: true

  # ------------------------------------------------------------------
  # ReSukiSU Manager
  # ------------------------------------------------------------------
  RESUKISU_MANAGER_REPO: ReSukiSU/ReSukiSU

jobs:
  build:
    name: Build ReSukiSU Root Test
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout Copilote
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ================================================================
      # DEPENDENCIES
      # ================================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            unzip \
            zip \
            device-tree-compiler \
            jq \
            rsync

      # ================================================================
      # KERNEL SOURCE
      #
      # Cette partie sera alignée exactement sur Copilote après audit.
      # ================================================================

      - name: Prepare kernel source
        shell: bash
        run: |
          set -euo pipefail

          test -d "${KERNEL_DIR}" || {
            echo "::error::Kernel source directory '${KERNEL_DIR}' not found."
            exit 1
          }

          cd "${KERNEL_DIR}"

          echo "Kernel source:"
          git remote -v || true
          git branch --show-current || true
          git log -1 --oneline || true

      # ================================================================
      # RESUKISU
      #
      # Aucun numéro de version.
      # Aucun SHA imposé.
      #
      # On utilise toujours le setup.sh du main actuel.
      # ================================================================

      - name: Integrate latest ReSukiSU
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          echo "=============================================="
          echo " Integrating ReSukiSU"
          echo " Repository: ${RESUKISU_REPO}"
          echo " Branch:     ${RESUKISU_BRANCH}"
          echo "=============================================="

          curl -LSsf \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${RESUKISU_BRANCH}/kernel/setup.sh" \
            -o /tmp/resukisu-setup.sh

          chmod +x /tmp/resukisu-setup.sh

          bash /tmp/resukisu-setup.sh

          echo
          echo "ReSukiSU integration completed."

          test -d drivers/kernelsu || \
            test -d drivers/ksu || \
            test -d KernelSU || \
            test -d kernel/ || {
              echo "::warning::ReSukiSU directory could not be identified automatically."
              echo "Inspecting possible KernelSU paths:"
              find . -maxdepth 4 \
                \( -iname '*ksu*' -o -iname '*resuki*' \) \
                -print | head -100
            }

      # ================================================================
      # ROOT CONFIGURATION
      #
      # Aucun SUSFS.
      # Manual Hook pour les kernels anciens/non-GKI.
      #
      # Les symboles exacts seront validés contre le kernel Copilote
      # avant d'être figés.
      # ================================================================

      - name: Configure ReSukiSU root
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          echo "Searching kernel configuration..."

          CONFIG_FILE=""

          for candidate in \
            "arch/arm64/configs/defconfig" \
            "arch/arm64/configs/vendor/defconfig" \
            "arch/arm64/configs/${DEFCONFIG:-}" \
            ".config"
          do
            if [ -n "$candidate" ] && [ -f "$candidate" ]; then
              CONFIG_FILE="$candidate"
              break
            fi
          done

          if [ -z "$CONFIG_FILE" ]; then
            echo "::error::Unable to identify kernel configuration file."
            exit 1
          fi

          echo "Configuration candidate: $CONFIG_FILE"

          # ------------------------------------------------------------
          # ReSukiSU root
          # ------------------------------------------------------------

          if grep -q '^CONFIG_KSU=' "$CONFIG_FILE"; then
            sed -i 's/^CONFIG_KSU=.*/CONFIG_KSU=y/' "$CONFIG_FILE"
          else
            printf '\nCONFIG_KSU=y\n' >> "$CONFIG_FILE"
          fi

          if grep -q '^CONFIG_KSU_MANUAL_HOOK=' "$CONFIG_FILE"; then
            sed -i 's/^CONFIG_KSU_MANUAL_HOOK=.*/CONFIG_KSU_MANUAL_HOOK=y/' "$CONFIG_FILE"
          else
            printf 'CONFIG_KSU_MANUAL_HOOK=y\n' >> "$CONFIG_FILE"
          fi

          # ------------------------------------------------------------
          # SUSFS volontairement absent.
          # ------------------------------------------------------------

          echo
          echo "ReSukiSU root configuration:"
          grep -E '^CONFIG_KSU' "$CONFIG_FILE" || true

          echo
          echo "SUSFS:"
          echo "DISABLED"

      # ================================================================
      # PREPARE CONFIG
      # ================================================================

      - name: Prepare kernel config
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          make O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            olddefconfig

          echo
          echo "Final ReSukiSU configuration:"
          grep -E '^CONFIG_KSU' \
            "${GITHUB_WORKSPACE}/${OUT_DIR}/.config" || true

          if grep -q '^CONFIG_KSU=y' \
              "${GITHUB_WORKSPACE}/${OUT_DIR}/.config"; then
            echo "CONFIG_KSU=y"
          else
            echo "::error::CONFIG_KSU was not enabled."
            exit 1
          fi

      # ================================================================
      # BUILD KERNEL
      # ================================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      # ================================================================
      # FIND KERNEL IMAGE
      # ================================================================

      - name: Locate kernel image
        shell: bash
        run: |
          set -euo pipefail

          BOOT_DIR="${GITHUB_WORKSPACE}/${OUT_DIR}/arch/${ARCH}/boot"

          echo "Boot directory:"
          ls -lah "$BOOT_DIR"

          KERNEL_IMAGE=""

          for candidate in \
            Image \
            Image.gz \
            Image.lz4 \
            Image.gz-dtb \
            Image.lz4-dtb
          do
            if [ -f "${BOOT_DIR}/${candidate}" ]; then
              KERNEL_IMAGE="${BOOT_DIR}/${candidate}"
              break
            fi
          done

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::No supported ARM64 kernel image found."
            find "${GITHUB_WORKSPACE}/${OUT_DIR}" \
              -type f \
              \( -name 'Image*' -o -name '*.dtb' \) \
              -print | head -100
            exit 1
          fi

          echo "KERNEL_IMAGE=${KERNEL_IMAGE}" >> "$GITHUB_ENV"

          echo "Selected kernel image:"
          ls -lh "$KERNEL_IMAGE"

      # ================================================================
      # DOWNLOAD LATEST RESUKISU MANAGER
      #
      # ReSukiSU ne publie actuellement pas son Manager comme une
      # release classique. Il est distribué via GitHub Actions/nightly.
      #
      # On interroge donc automatiquement l'API GitHub pour trouver
      # le dernier workflow réussi et ses artefacts.
      # ================================================================

      - name: Download latest ReSukiSU Manager
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/resukisu-manager"

          API="https://api.github.com/repos/${RESUKISU_MANAGER_REPO}"

          echo "Searching latest successful ReSukiSU workflow..."

          RUNS_JSON="$(
            curl -LSsf \
              -H "Accept: application/vnd.github+json" \
              "${API}/actions/runs?branch=main&status=success&per_page=20"
          )"

          RUN_ID="$(
            echo "$RUNS_JSON" |
              jq -r '.workflow_runs[0].id // empty'
          )"

          if [ -z "$RUN_ID" ]; then
            echo "::warning::No successful ReSukiSU workflow found."
            echo "Manager will not be packaged in this run."
            exit 0
          fi

          echo "Selected ReSukiSU workflow run: ${RUN_ID}"

          ARTIFACTS_JSON="$(
            curl -LSsf \
              -H "Accept: application/vnd.github+json" \
              "${API}/actions/runs/${RUN_ID}/artifacts"
          )"

          echo "$ARTIFACTS_JSON" |
            jq -r '.artifacts[] | "\(.id) \(.name) \(.size_in_bytes)"'

          ARTIFACT_ID="$(
            echo "$ARTIFACTS_JSON" |
              jq -r '
                .artifacts[]
                | select(.expired == false)
                | select(
                    (.name | ascii_downcase | contains("manager"))
                    or
                    (.name | ascii_downcase | contains("app"))
                  )
                | .id
              ' |
              head -n 1
          )"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::warning::No Manager artifact identified automatically."
            exit 0
          fi

          echo "Downloading Manager artifact ${ARTIFACT_ID}..."

          curl -LSsfL \
            -H "Accept: application/vnd.github+json" \
            "${API}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "${GITHUB_WORKSPACE}/resukisu-manager/manager.zip"

          unzip -o \
            "${GITHUB_WORKSPACE}/resukisu-manager/manager.zip" \
            -d "${GITHUB_WORKSPACE}/resukisu-manager/extracted"

          find "${GITHUB_WORKSPACE}/resukisu-manager" \
            -type f \
            -print

      # ================================================================
      # BOOT IMAGE TEST
      #
      # Le workflow doit utiliser une image boot de référence du projet.
      #
      # Elle sera reconstruite avec le nouveau kernel.
      #
      # Le résultat est destiné à :
      #
      #     fastboot boot boot.img
      #
      # donc aucun flash permanent dans cette phase.
      # ================================================================

      - name: Prepare test boot image
        if: env.BUILD_TEST_BOOT == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -n "${SOURCE_BOOT_IMAGE_URL:-}" || {
            echo "::error::SOURCE_BOOT_IMAGE_URL must be defined for test boot generation."
            exit 1
          }

          mkdir -p "${GITHUB_WORKSPACE}/boot-work"

          echo "Downloading reference boot image..."

          curl -LSsfL \
            "${SOURCE_BOOT_IMAGE_URL}" \
            -o "${GITHUB_WORKSPACE}/boot-work/source-boot.img"

          test -s "${GITHUB_WORKSPACE}/boot-work/source-boot.img"

          echo "Reference boot image:"
          ls -lh "${GITHUB_WORKSPACE}/boot-work/source-boot.img"

      # ================================================================
      # MAGISKBOOT
      #
      # Le binaire sera récupéré automatiquement.
      # Il servira uniquement à remplacer le kernel dans le boot.img.
      # ================================================================

      - name: Prepare magiskboot
        if: env.BUILD_TEST_BOOT == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/magiskboot"

          # Recherche automatique du dernier artefact public Magisk
          # contenant magiskboot.
          RELEASE_JSON="$(
            curl -LSsf \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest
          )"

          APK_URL="$(
            echo "$RELEASE_JSON" |
              jq -r '
                .assets[]
                | select(.name | endswith(".apk"))
                | .browser_download_url
              ' |
              head -n 1
          )"

          test -n "$APK_URL"

          curl -LSsfL \
            "$APK_URL" \
            -o "${GITHUB_WORKSPACE}/magiskboot/magisk.apk"

          unzip -j \
            "${GITHUB_WORKSPACE}/magiskboot/magisk.apk" \
            'lib/arm64-v8a/libmagiskboot.so' \
            -d "${GITHUB_WORKSPACE}/magiskboot"

          mv \
            "${GITHUB_WORKSPACE}/magiskboot/libmagiskboot.so" \
            "${GITHUB_WORKSPACE}/magiskboot/magiskboot"

          chmod +x \
            "${GITHUB_WORKSPACE}/magiskboot/magiskboot"

          "${GITHUB_WORKSPACE}/magiskboot/magiskboot" --help >/dev/null 2>&1 || true

      # ================================================================
      # REPACK TEST BOOT
      # ================================================================

      - name: Repack test boot image
        if: env.BUILD_TEST_BOOT == 'true'
        shell: bash
        run: |
          set -euo pipefail

          WORK="${GITHUB_WORKSPACE}/boot-work"
          MAGISKBOOT="${GITHUB_WORKSPACE}/magiskboot/magiskboot"

          cd "$WORK"

          rm -rf unpacked
          mkdir -p unpacked

          cp source-boot.img unpacked/boot.img

          cd unpacked

          echo "Unpacking boot image..."

          "$MAGISKBOOT" unpack boot.img

          test -f kernel || {
            echo "::error::magiskboot did not produce a kernel file."
            find . -maxdepth 2 -type f -print
            exit 1
          }

          echo "Replacing boot kernel..."

          cp "${KERNEL_IMAGE}" kernel

          echo "Repacking boot image..."

          "$MAGISKBOOT" repack boot.img

          test -f new-boot.img

          cp new-boot.img "${GITHUB_WORKSPACE}/boot.img"

          echo
          echo "TEST boot image generated:"
          ls -lh "${GITHUB_WORKSPACE}/boot.img"

      # ================================================================
      # VERIFY ROOT CONFIGURATION
      # ================================================================

      - name: Verify ReSukiSU kernel integration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${GITHUB_WORKSPACE}/${OUT_DIR}/.config"

          echo "=============================================="
          echo " ReSukiSU verification"
          echo "=============================================="

          grep -E '^CONFIG_KSU' "$CONFIG" || true

          grep -q '^CONFIG_KSU=y' "$CONFIG" || {
            echo "::error::ReSukiSU/KernelSU is not enabled."
            exit 1
          }

          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$CONFIG" || {
            echo "::error::Manual Hook is not enabled."
            exit 1
          }

          echo
          echo "SUSFS must remain disabled in Phase 1."

      # ================================================================
      # ARTIFACTS
      # ================================================================

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Copilote-ReSukiSU-root-test
          if-no-files-found: error
          path: |
            ${{ env.OUT_DIR }}/arch/arm64/boot/Image*
            boot.img
            resukisu-manager/**
```
