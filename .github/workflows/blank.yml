name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout build repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang \
            llvm \
            lld \
            device-tree-compiler \
            zip \
            unzip \
            curl \
            git \
            python3 \
            rsync \
            cpio \
            gzip \
            xz-utils

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-sm8250-4.19-${{ hashFiles('.github/workflows/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-sm8250-4.19-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          set -euxo pipefail

          mkdir -p ~/.cache/ccache

          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          ccache -z

      # ============================================================
      # KERNEL SOURCE
      # ============================================================

      - name: Clone LineageOS kernel
        run: |
          set -euxo pipefail

          rm -rf "${KERNEL_PATH}"

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "=========================================="
          echo "Kernel source"
          echo "=========================================="

          echo "Branch: ${KERNEL_BRANCH}"
          echo "Commit: $(git rev-parse HEAD)"

          head -n 5 Makefile

      # ============================================================
      # JACKA1LTMAN TOOLS
      # ============================================================

      - name: Clone JackA1ltman NonGKI tools
        run: |
          set -euxo pipefail

          rm -rf non_gki_tools

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            non_gki_tools

          test -f non_gki_tools/bin/clean_hook.sh
          test -f non_gki_tools/Patches/susfs_inline_hook_patches.sh
          test -f non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch

          echo "JackA1ltman tools OK"

      # ============================================================
      # CLEAN EXISTING KSU
      # ============================================================

      - name: Clean existing KernelSU installation
        run: |
          set -euxo pipefail

          cd "${KERNEL_PATH}"

          if [ -d KernelSU ] || grep -q 'CONFIG_KSU' fs/exec.c 2>/dev/null; then

            echo "Existing KernelSU detected."

            cp ../non_gki_tools/bin/clean_hook.sh ./clean_hook.sh

            bash ./clean_hook.sh

            rm -f ./clean_hook.sh

          else

            echo "No existing KernelSU installation detected."

          fi

      # ============================================================
      # RESUKISU
      # ============================================================

      - name: Embed current ReSukiSU
        run: |
          set -euxo pipefail

          cd "${KERNEL_PATH}"

          curl -fsSL \
            "${RESUKISU_SETUP}" \
            -o setup_resukisu.sh

          bash setup_resukisu.sh

          rm -f setup_resukisu.sh

          test -L drivers/kernelsu
          test -d KernelSU

          echo "=========================================="
          echo "ReSukiSU"
          echo "=========================================="

          echo "Commit:"
          git -C KernelSU rev-parse HEAD

          git -C KernelSU log -1 --oneline

      # ============================================================
      # DEFCONFIG
      # ============================================================

      - name: Configure ReSukiSU and SuSFS
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="${KERNEL_PATH}/arch/arm64/configs/${DEFCONFIG}"

          test -f "${DEFCONFIG_FILE}"

          python3 - "${DEFCONFIG_FILE}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          configs = [
              "CONFIG_KSU=y",
              "CONFIG_KSU_MANUAL_HOOK=y",
              "CONFIG_KALLSYMS=y",
              "CONFIG_KALLSYMS_ALL=y",

              "CONFIG_KSU_SUSFS=y",
              "CONFIG_KSU_SUSFS_SUS_PATH=y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT=y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG=y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y",
              "CONFIG_KSU_SUSFS_SUS_MAP=y",
          ]

          lines = text.splitlines()

          wanted = {
              item.split("=", 1)[0]: item
              for item in configs
          }

          output = []
          seen = set()

          for line in lines:

              if "=" in line:
                  key = line.split("=", 1)[0]

                  if key in wanted:
                      output.append(wanted[key])
                      seen.add(key)
                      continue

              output.append(line)

          for item in configs:

              key = item.split("=", 1)[0]

              if key not in seen:
                  output.append(item)

          path.write_text(
              "\n".join(output) + "\n"
          )
          PY

          echo
          echo "Final defconfig entries:"
          grep -E '^(CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS)' \
            "${DEFCONFIG_FILE}"

      # ============================================================
      # JACKA1LTMAN INLINE HOOKS
      # ============================================================

      - name: Apply JackA1ltman SuSFS inline hooks
        run: |
          set -euxo pipefail

          cd "${KERNEL_PATH}"

          cp \
            ../non_gki_tools/Patches/susfs_inline_hook_patches.sh \
            ./susfs_inline_hook_patches.sh

          bash ./susfs_inline_hook_patches.sh

          rm -f ./susfs_inline_hook_patches.sh

      # ============================================================
      # SUSFS PATCH
      # ============================================================

      - name: Apply JackA1ltman SuSFS 4.19 patch
        run: |
          set -uo pipefail

          cd "${KERNEL_PATH}"

          cp \
            ../non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch \
            ./susfs_patch_to_4.19.patch

          rm -f \
            ./*.rej \
            ./fs/*.rej \
            ./fs/proc/*.rej \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "Applying SuSFS 4.19 patch"
          echo "=========================================="

          set +e

          patch -p1 < susfs_patch_to_4.19.patch

          PATCH_STATUS=$?

          set -e

          echo
          echo "patch exit status: ${PATCH_STATUS}"

          echo
          echo "Reject files currently present:"

          find . \
            -type f \
            -name '*.rej' \
            -print || true

          # patch is allowed to return non-zero here because the
          # known 4.19 differences are adapted in the next step.

          exit 0

      # ============================================================
      # MANUAL ADAPTATION
      #
      # This is based on the ACTUAL LineageOS lineage-23.2 source.
      #
      # Known differences:
      #   fs/namespace.c
      #   fs/proc/task_mmu.c
      #   fs/stat.c / ReSukiSU newfstat return hook
      # ============================================================

      - name: Adapt SuSFS and ReSukiSU to actual 4.19 source
        run: |
          set -euxo pipefail

          cd "${KERNEL_PATH}"

          python3 <<'PY'
          from pathlib import Path

          # ==========================================================
          # fs/namespace.c
          # ==========================================================

          path = Path("fs/namespace.c")

          text = path.read_text()

          include_block = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          #include <linux/susfs_def.h>
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          """

          if "#include <linux/susfs_def.h>" not in text:

              anchor = "#include <linux/sched/task.h>\n"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: include anchor not found"
                  )

              text = text.replace(
                  anchor,
                  anchor + include_block,
                  1
              )

          declaration = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          extern bool susfs_is_current_ksu_domain(void);
          extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;

          #define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */

          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT

          """

          if "susfs_is_current_ksu_domain(void)" not in text:

              anchor = '#include "internal.h"\n\n'

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: declaration anchor not found"
                  )

              text = text.replace(
                  anchor,
                  anchor + declaration,
                  1
              )

          # ----------------------------------------------------------
          # Current LineageOS 4.19 uses vfs_create_mount()
          # ----------------------------------------------------------

          if "susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: \"none\")" not in text:

              anchor = 'mnt = alloc_vfsmnt(fc->source ?: "none");'

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: "
                      "vfs_create_mount anchor not found"
                  )

              replacement = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \t/* Keep the KSU mount namespace hidden while Android data
          \t * is not yet accessible.
          \t */
          \tif (static_branch_unlikely(
          \t\t&susfs_is_sdcard_android_data_not_decrypted)) {
          \t\tif (susfs_is_current_ksu_domain()) {
          \t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(
          \t\t\t\tfc->source ?: "none");
          \t\t\tgoto bypass_orig_flow;
          \t\t}
          \t}
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT

          mnt = alloc_vfsmnt(fc->source ?: "none");

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          bypass_orig_flow:
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          """

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          path.write_text(text)

          # ==========================================================
          # fs/proc/task_mmu.c
          # ==========================================================

          path = Path("fs/proc/task_mmu.c")

          text = path.read_text()

          if "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))" not in text:

              if "#include <linux/susfs_def.h>" not in text:

                  anchor = "#include <linux/shmem_fs.h>\n"

                  if anchor not in text:
                      raise SystemExit(
                          "ERROR: task_mmu.c: include anchor not found"
                      )

                  text = text.replace(
                      anchor,
                      anchor
                      + "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                      + "#include <linux/susfs_def.h>\n"
                      + "#endif\n",
                      1
                  )

              # pagemap_read() currently has no vma variable.
              anchor = "struct pagemapread pm;\n"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c: pagemap_read anchor not found"
                  )

              text = text.replace(
                  anchor,
                  anchor
                  + "\tstruct vm_area_struct *vma;\n",
                  1
              )

              # Current source uses mmap_read_lock_killable() /
              # mmap_read_unlock(), so patch around walk_page_range().
              anchor = (
                  "\t\tret = walk_page_range("
                  "start_vaddr, end, &pagemap_walk);\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c: walk_page_range anchor not found"
                  )

              replacement = """#ifdef CONFIG_KSU_SUSFS_SUS_MAP
          \t\tvma = find_vma(mm, start_vaddr);

          \t\tif (vma &&
          \t\t    vma->vm_file &&
          \t\t    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))
          \t\t\tgoto bypass_orig_flow;
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP

          \t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          bypass_orig_flow:
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          """

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          path.write_text(text)

          # ==========================================================
          # fs/stat.c
          #
          # Do NOT match the entire function.
          #
          # The actual LineageOS 4.19 file has:
          #
          #   SYSCALL_DEFINE2(newfstat...)
          #
          # but spacing/context differs from the old patch.
          # ==========================================================

          path = Path("fs/stat.c")

          text = path.read_text()

          declaration = """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(
          \tint *dfd,
          \tconst char __user **filename_user,
          \tint *flags);

          extern void ksu_handle_newfstat_ret(
          \tunsigned int *fd,
          \tstruct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
          \tunsigned long *fd,
          \tstruct stat64 __user **statbuf_ptr);
          #endif
          #endif

          """

          if "ksu_handle_newfstat_ret" not in text:

              anchor = (
                  "#if !defined(__ARCH_WANT_STAT64) "
                  "|| defined(__ARCH_WANT_SYS_NEWFSTATAT)\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/stat.c: newfstat declaration anchor not found"
                  )

              text = text.replace(
                  anchor,
                  declaration + anchor,
                  1
              )

          # ----------------------------------------------------------
          # newfstatat()
          # ----------------------------------------------------------

          if "ksu_handle_stat(&dfd, &filename, &flag);" not in text:

              signature = "SYSCALL_DEFINE4(newfstatat,"

              start = text.find(signature)

              if start < 0:
                  raise SystemExit(
                      "ERROR: fs/stat.c: newfstatat function not found"
                  )

              anchor = "\terror = vfs_fstatat("
              pos = text.find(anchor, start)

              if pos < 0:
                  raise SystemExit(
                      "ERROR: fs/stat.c: newfstatat hook anchor not found"
                  )

              hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """

              text = (
                  text[:pos]
                  + hook
                  + text[pos:]
              )

          # ----------------------------------------------------------
          # newfstat()
          # ----------------------------------------------------------

          if "ksu_handle_newfstat_ret(&fd, &statbuf);" not in text:

              signature = "SYSCALL_DEFINE2(newfstat,"

              start = text.find(signature)

              if start < 0:
                  raise SystemExit(
                      "ERROR: fs/stat.c: newfstat function not found"
                  )

              pos = text.find(
                  "\treturn error;\n",
                  start
              )

              if pos < 0:
                  raise SystemExit(
                      "ERROR: fs/stat.c: newfstat return anchor not found"
                  )

              hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          """

              text = (
                  text[:pos]
                  + hook
                  + text[pos:]
              )

          # ----------------------------------------------------------
          # fstat64()
          # ----------------------------------------------------------

          if (
              "SYSCALL_DEFINE2(fstat64," in text
              and
              "ksu_handle_fstat64_ret(&fd, &statbuf);" not in text
          ):

              signature = "SYSCALL_DEFINE2(fstat64,"

              start = text.find(signature)

              pos = text.find(
                  "\treturn error;\n",
                  start
              )

              if pos < 0:
                  raise SystemExit(
                      "ERROR: fs/stat.c: fstat64 return anchor not found"
                  )

              hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          """

              text = (
                  text[:pos]
                  + hook
                  + text[pos:]
              )

          path.write_text(text)

          print("Manual source adaptations completed successfully.")
          PY

      # ============================================================
      # REJECT VERIFICATION
      # ============================================================

      - name: Verify no unexpected SuSFS rejects remain
        run: |
          set -euxo pipefail

          cd "${KERNEL_PATH}"

          echo "Current reject files:"

          find . \
            -type f \
            -name '*.rej' \
            -print || true

          if find . -type f -name '*.rej' | grep -q .; then

            echo
            echo "=========================================="
            echo "ERROR: Unexpected SuSFS rejects remain"
            echo "=========================================="

            while IFS= read -r file; do
              echo
              echo "========== ${file} =========="
              cat "${file}"
            done < <(
              find . \
                -type f \
                -name '*.rej' \
                -print
            )

            exit 1
          fi

          echo
          echo "SuSFS patch tree is clean: no .rej files."

      # ============================================================
      # BUILD CONFIGURATION
      # ============================================================

      - name: Prepare kernel configuration
        run: |
          set -euxo pipefail

          rm -rf "${BUILD_DIR}"

          mkdir -p "${BUILD_DIR}"

          make \
            -C "${KERNEL_PATH}" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "${DEFCONFIG}"

          make \
            -C "${KERNEL_PATH}" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      # ============================================================
      # CONFIG VERIFICATION
      # ============================================================

      - name: Verify ReSukiSU and SuSFS configuration
        run: |
          set -euxo pipefail

          test -f "${BUILD_DIR}/.config"

          REQUIRED_CONFIGS=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for CONFIG in "${REQUIRED_CONFIGS[@]}"; do

            if ! grep -q "^${CONFIG}=y$" "${BUILD_DIR}/.config"; then
              echo "::error::${CONFIG} is not enabled"
              exit 1
            fi

          done

          if grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' \
             "${BUILD_DIR}/.config"; then

            echo "::error::KPROBES hook is enabled."
            echo "::error::This build requires ReSukiSU Manual Hook."

            exit 1
          fi

          echo
          echo "=========================================="
          echo "KernelSU / ReSukiSU / SuSFS configuration"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS)' \
            "${BUILD_DIR}/.config"

      # ============================================================
      # MANUAL HOOK VERIFICATION
      # ============================================================

      - name: Verify ReSukiSU manual hooks
        run: |
          set -euxo pipefail

          cd "${KERNEL_PATH}"

          grep -q 'ksu_handle_execveat' \
            fs/exec.c

          grep -q 'ksu_handle_faccessat' \
            fs/open.c

          grep -q 'ksu_handle_stat' \
            fs/stat.c

          grep -q 'ksu_handle_newfstat_ret' \
            fs/stat.c

          grep -q 'ksu_handle_sys_reboot' \
            kernel/reboot.c

          grep -q 'ksu_handle_setresuid' \
            kernel/sys.c

          grep -q 'ksu_handle_input_handle_event' \
            drivers/input/input.c

          echo
          echo "=========================================="
          echo "All required ReSukiSU manual hooks present"
          echo "=========================================="

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build kernel
        run: |
          set -euxo pipefail

          make \
            -C "${KERNEL_PATH}" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc)"

      # ============================================================
      # BUILD OUTPUT
      # ============================================================

      - name: Show kernel output
        run: |
          set -euxo pipefail

          echo
          echo "=========================================="
          echo "Kernel output"
          echo "=========================================="

          find \
            "${BUILD_DIR}/arch/${ARCH}/boot" \
            -maxdepth 2 \
            -type f \
            -print

          ls -lh \
            "${BUILD_DIR}/arch/${ARCH}/boot/" || true

          echo
          ccache -s

      # ============================================================
      # STOCK BOOT
      # ============================================================

      - name: Download matching Kiev boot image
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          curl \
            -fL \
            --retry 3 \
            --retry-delay 5 \
            "${BOOT_URL}" \
            -o artifacts/stock-kiev-boot-20260809.img

          sha256sum \
            artifacts/stock-kiev-boot-20260809.img

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package kernel artifacts
        run: |
          set -euxo pipefail

          mkdir -p artifacts/kernel

          cp \
            "${BUILD_DIR}/.config" \
            artifacts/kernel/

          cp -a \
            "${BUILD_DIR}/arch/${ARCH}/boot/" \
            artifacts/kernel/boot

          if [ -f "${BUILD_DIR}/arch/${ARCH}/boot/Image.gz-dtb" ]; then

            cp \
              "${BUILD_DIR}/arch/${ARCH}/boot/Image.gz-dtb" \
              artifacts/kernel/

          elif [ -f "${BUILD_DIR}/arch/${ARCH}/boot/Image.gz" ]; then

            cp \
              "${BUILD_DIR}/arch/${ARCH}/boot/Image.gz" \
              artifacts/kernel/

          elif [ -f "${BUILD_DIR}/arch/${ARCH}/boot/Image" ]; then

            cp \
              "${BUILD_DIR}/arch/${ARCH}/boot/Image" \
              artifacts/kernel/

          else

            echo "::error::No ARM64 kernel image found."

            exit 1

          fi

          tar \
            -czf \
            artifacts/Kernel-ReSukiSU-SuSFS-kiev.tar.gz \
            -C artifacts/kernel .

          sha256sum \
            artifacts/Kernel-ReSukiSU-SuSFS-kiev.tar.gz

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-ReSukiSU-SuSFS-kiev
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
