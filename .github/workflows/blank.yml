name: Build Kernel - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release"
        required: false
        default: false
        type: boolean

concurrency:
  group: kiev-resukisu-susfs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVICE: kiev
  ARCH: arm64

  WORKSPACE: ${{ github.workspace }}/kernel_workspace
  KERNEL_PATH: ${{ github.workspace }}/kernel_workspace/android-kernel
  BUILD_DIR: ${{ github.workspace }}/kernel_workspace/android-kernel/out

  KERNEL_SOURCE:
    https://github.com/Albanel22/android_kernel_motorola_sm8250.git
  KERNEL_SOURCE_BRANCH: lineage-23.2

  KERNEL_CONFIG: vendor/lito-perf_defconfig
  DEFCONFIG: lito-perf_defconfig

  KERNEL_IMAGE_NAME: Image.gz-dtb

  KERNEL_VERSION: "4.19"

  # ReSukiSU
  KSU_VARIANT: resukisu
  KSU_REF: 3b70416f
  KSU_HOOK_MODE: manual

  # SuSFS
  ENABLE_SUSFS: "true"

  # Pas de KPM
  ENABLE_KPM: "false"

  # Build
  USE_LLVM: "true"
  ENABLE_CCACHE: "true"
  CCACHE_SIZE: 5G

  # LineageOS kiev
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img
  DTBO_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/dtbo.img

  # Dépôt choisi pour l'intégration Non-GKI
  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git


jobs:

  build:
    name: "kiev 4.19 · ReSukiSU + SuSFS"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout build repository
        uses: actions/checkout@v4


      # ============================================================
      # FREE DISK
      # ============================================================

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false


      # ============================================================
      # SWAP
      # ============================================================

      - name: Configure swap
        shell: bash
        run: |
          set -euo pipefail

          if swapon --show | grep -q .; then
            echo "Swap already enabled"
          else
            sudo fallocate -l 8G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          fi

          echo "===== MEMORY ====="
          free -h

          echo "===== SWAP ====="
          swapon --show


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            zip \
            zstd

          mkdir -p "${WORKSPACE}"


      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKSPACE }}/.ccache
          key: ccache-kiev-4.19-resukisu-${{ env.KSU_REF }}
          restore-keys: |
            ccache-kiev-4.19-resukisu-
            ccache-kiev-4.19-
            ccache-kiev-


      # ============================================================
      # FETCH KERNEL
      # ============================================================

      - name: Fetch kernel source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${KERNEL_PATH}")"

          git clone \
            --depth=1 \
            --branch "${KERNEL_SOURCE_BRANCH}" \
            "${KERNEL_SOURCE}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "===== KERNEL ====="
          git remote -v
          git log -1 --oneline

          echo "===== VERSION ====="

          test -f Makefile

          grep -E '^(VERSION|PATCHLEVEL) *=' Makefile

          VERSION="$(sed -n 's/^VERSION = *//p' Makefile | head -n1)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = *//p' Makefile | head -n1)"

          KVER="${VERSION}.${PATCHLEVEL}"

          echo "Detected kernel: ${KVER}"

          test "${KVER}" = "4.19" || {
            echo "::error::Expected kernel 4.19 but detected ${KVER}"
            exit 1
          }


      # ============================================================
      # BOOT / DTBO
      # ============================================================

      - name: Download stock boot image
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            -o "${WORKSPACE}/boot-stock.img" \
            "${BOOT_URL}"

          test -s "${WORKSPACE}/boot-stock.img"

          ls -lh "${WORKSPACE}/boot-stock.img"


      - name: Download stock DTBO
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            -o "${WORKSPACE}/dtbo.img" \
            "${DTBO_URL}"

          test -s "${WORKSPACE}/dtbo.img"

          ls -lh "${WORKSPACE}/dtbo.img"


      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: Configure build toolchain
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-18/bin:${PATH}"

          echo "PATH=${PATH}"

          if command -v clang >/dev/null 2>&1; then
            clang --version | head -n 2
          fi

          aarch64-linux-gnu-gcc --version | head -n 1


      # ============================================================
      # NON-GKI BUILD REPOSITORY
      # ============================================================

      - name: Fetch NonGKI integration tools
        shell: bash
        run: |
          set -euo pipefail

          cd "${WORKSPACE}"

          git clone \
            --depth=1 \
            "${NONGKI_REPO}" \
            NonGKI_Kernel_Build_2nd

          test -d NonGKI_Kernel_Build_2nd

          echo "===== NonGKI repository ====="
          cd NonGKI_Kernel_Build_2nd

          git log -1 --oneline

          echo "===== available patch tools ====="
          find . -maxdepth 3 \
            \( -name '*hook*.sh' -o -name 'susfs_patch_to_4.19.patch' \) \
            -print | sort


      # ============================================================
      # CLEAN EXISTING KERNELSU
      # ============================================================

      - name: Check and clean existing KernelSU
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          NEED_CLEAN=false

          if [ -d "KernelSU" ] || [ -d "drivers/kernelsu" ]; then
            NEED_CLEAN=true
          fi

          if [ -f "fs/exec.c" ] &&
             grep -q "CONFIG_KSU" fs/exec.c; then
            NEED_CLEAN=true
          fi

          if [ "${NEED_CLEAN}" = "true" ]; then
            echo "Existing KernelSU installation detected."

            CLEAN_SCRIPT="${WORKSPACE}/NonGKI_Kernel_Build_2nd/bin/clean_hook.sh"

            if [ -f "${CLEAN_SCRIPT}" ]; then
              cp "${CLEAN_SCRIPT}" .
              bash clean_hook.sh
              rm -f clean_hook.sh
            else
              echo "::error::clean_hook.sh not found in NonGKI repository."
              exit 1
            fi
          else
            echo "No existing KernelSU installation detected."
          fi


      # ============================================================
      # RESUKISU
      # ============================================================

      - name: Integrate ReSukiSU
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          echo "===== ReSukiSU ====="
          echo "Ref: ${KSU_REF}"

          curl -fLSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            -o setup-resukisu.sh

          chmod +x setup-resukisu.sh

          bash setup-resukisu.sh "${KSU_REF}"

          rm -f setup-resukisu.sh

          echo "===== Verify ReSukiSU ====="

          test -d KernelSU || {
            echo "::error::KernelSU directory was not created."
            exit 1
          }

          echo "KernelSU:"
          find KernelSU -maxdepth 2 -type f | head -n 30


      # ============================================================
      # DEFCONFIG - KSU
      # ============================================================

      - name: Enable KernelSU configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          CONFIG_FILE="arch/arm64/configs/${KERNEL_CONFIG}"

          test -f "${CONFIG_FILE}" || {
            echo "::error::Defconfig not found: ${CONFIG_FILE}"
            find arch/arm64/configs -name '*lito*' -o -name '*perf*'
            exit 1
          }

          cp "${CONFIG_FILE}" "${CONFIG_FILE}.bak"

          {
            echo
            echo "# ReSukiSU / SuSFS"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> "${CONFIG_FILE}"

          echo "===== KernelSU config ====="
          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=)' \
            "${CONFIG_FILE}"


      # ============================================================
      # SUSFS INLINE HOOKS
      # ============================================================

      - name: Apply SuSFS inline hook patches
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          SCRIPT="${WORKSPACE}/NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh"

          test -f "${SCRIPT}" || {
            echo "::error::susfs_inline_hook_patches.sh not found."
            find "${WORKSPACE}/NonGKI_Kernel_Build_2nd" \
              -name 'susfs_inline_hook_patches.sh' \
              -print
            exit 1
          }

          cp "${SCRIPT}" .

          chmod +x susfs_inline_hook_patches.sh

          bash susfs_inline_hook_patches.sh

          rm -f susfs_inline_hook_patches.sh

          echo "===== Inline hooks complete ====="


      # ============================================================
      # SUSFS PATCH + MANUAL ADAPTATION FOR KIEV 4.19
      # ============================================================

      - name: Apply SuSFS 4.19 patch
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          PATCH_FILE="${WORKSPACE}/NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch"

          test -f "${PATCH_FILE}" || {
            echo "::error::SuSFS 4.19 patch not found."
            find "${WORKSPACE}/NonGKI_Kernel_Build_2nd/Patches" \
              -iname '*susfs*4.19*.patch' \
              -print
            exit 1
          }

          echo "===== Backup kernel before SuSFS ====="

          cp -a "${KERNEL_PATH}" \
            "${WORKSPACE}/kernel-before-susfs"

          cp "${PATCH_FILE}" .

          echo
          echo "===== Applying official NonGKI SuSFS 4.19 patch ====="

          set +e

          patch \
            --batch \
            --forward \
            --no-backup-if-mismatch \
            -p1 \
            < susfs_patch_to_4.19.patch

          PATCH_STATUS=$?

          set -e

          echo
          echo "patch exit code: ${PATCH_STATUS}"

          echo
          echo "===== Reject files ====="

          REJECTS="$(find . -type f -name '*.rej' -print | sort || true)"

          if [ -n "${REJECTS}" ]; then
            echo "${REJECTS}"
          else
            echo "No reject files."
          fi

          # --------------------------------------------------------
          # The official patch is expected to fail only in:
          #
          #   fs/namespace.c
          #   fs/proc/task_mmu.c
          #
          # These two files require adaptation because the kiev
          # lineage-23.2 kernel has different VFS/MM code layout.
          # --------------------------------------------------------

          if [ -n "${REJECTS}" ]; then

            BAD_REJECTS="$(
              printf '%s\n' "${REJECTS}" |
              grep -v -E '^\./fs/namespace\.c\.rej$|^\./fs/proc/task_mmu\.c\.rej$' ||
              true
            )"

            if [ -n "${BAD_REJECTS}" ]; then
              echo "::error::Unexpected SuSFS reject files detected:"
              echo "${BAD_REJECTS}"
              exit 1
            fi

            echo
            echo "===== Expected compatibility rejects detected ====="
            echo
            cat fs/namespace.c.rej
            echo
            cat fs/proc/task_mmu.c.rej
          fi


          # ========================================================
          # MANUAL COMPATIBILITY ADAPTATION
          # ========================================================

          echo
          echo "===== Applying kiev 4.19 compatibility adaptations ====="

          python3 <<'PY'
          from pathlib import Path

          root = Path(".")

          # ========================================================
          # fs/namespace.c
          # ========================================================

          path = root / "fs/namespace.c"
          text = path.read_text()

          # --------------------------------------------------------
          # 1. Add susfs_def.h include
          # --------------------------------------------------------

          include_anchor = """#include <linux/sched/task.h>
          """

          include_block = """#include <linux/sched/task.h>
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          #include <linux/susfs_def.h>
          #endif // CONFIG_KSU_SUSFS_SUS_MOUNT
          """

          if "CONFIG_KSU_SUSFS_SUS_MOUNT" not in text:
              if include_anchor not in text:
                  raise SystemExit(
                      "ERROR: namespace.c include anchor not found"
                  )

              text = text.replace(
                  include_anchor,
                  include_block,
                  1
              )

          # --------------------------------------------------------
          # 2. Add SuSFS mount declarations
          # --------------------------------------------------------

          extern_anchor = """#include "pnode.h"
          """

          extern_block = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          extern bool susfs_is_current_ksu_domain(void);
          extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;

          #define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */

          #endif // CONFIG_KSU_SUSFS_SUS_MOUNT

          #include "pnode.h"
          """

          if "susfs_is_current_ksu_domain" not in text:
              if extern_anchor not in text:
                  raise SystemExit(
                      "ERROR: namespace.c extern anchor not found"
                  )

              text = text.replace(
                  extern_anchor,
                  extern_block,
                  1
              )

          # --------------------------------------------------------
          # 3. Adapt vfs_kern_mount()
          #
          # The original NonGKI patch expects an older 4.19 layout
          # where vfs_kern_mount() directly calls alloc_vfsmnt().
          #
          # kiev lineage-23.2 uses fs_context/fc_mount(), therefore
          # the SuSFS fast path must return before the normal
          # fs_context flow.
          # --------------------------------------------------------

          vfs_anchor = """	struct vfsmount *mnt;
          """

          vfs_block = """	struct vfsmount *mnt;

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          	/*
          	 * SuSFS: allow the KSU domain to obtain a non-unshare
          	 * vfsmount when Android/data is not decrypted.
          	 */
          	if (static_branch_unlikely(
          			&susfs_is_sdcard_android_data_not_decrypted)) {
          		if (susfs_is_current_ksu_domain())
          			return susfs_alloc_non_unshare_ksu_vfsmnt(
          				name ?: "none");
          	}
          #endif
          """

          if "susfs_alloc_non_unshare_ksu_vfsmnt" not in text:
              if vfs_anchor not in text:
                  raise SystemExit(
                      "ERROR: namespace.c vfs_kern_mount anchor not found"
                  )

              text = text.replace(
                  vfs_anchor,
                  vfs_block,
                  1
              )

          path.write_text(text)


          # ========================================================
          # fs/proc/task_mmu.c
          # ========================================================

          path = root / "fs/proc/task_mmu.c"
          text = path.read_text()

          # --------------------------------------------------------
          # 4. Add susfs_def.h
          #
          # The kernel already contains:
          #
          #   #ifdef CONFIG_KSU_SUSFS
          #   #include <linux/susfs.h>
          #   #endif
          #
          # The SuSFS patch also needs susfs_def.h for the SUS_MAP
          # helpers.
          # --------------------------------------------------------

          include_anchor = """#include <linux/ctype.h>
          """

          include_block = """#include <linux/ctype.h>
          #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)
          #include <linux/susfs_def.h>
          #endif // CONFIG_KSU_SUSFS_SUS_KSTAT || CONFIG_KSU_SUSFS_SUS_MAP || CONFIG_KSU_SUSFS_OPEN_REDIRECT
          """

          if "CONFIG_KSU_SUSFS_SUS_MAP" not in text:
              if include_anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c include anchor not found"
                  )

              text = text.replace(
                  include_anchor,
                  include_block,
                  1
              )

          # --------------------------------------------------------
          # 5. Adapt pagemap_read()
          #
          # The stock patch expects:
          #
          #   down_read_killable(&mm->mmap_sem)
          #
          # kiev uses:
          #
          #   mmap_read_lock_killable(mm)
          #
          # We therefore insert the SUS_MAP check immediately after
          # the successful mmap read lock.
          # --------------------------------------------------------

          lock_anchor = """		ret = mmap_read_lock_killable(mm);
          		if (ret)
          			goto out_free;
          """

          lock_block = """		ret = mmap_read_lock_killable(mm);
          		if (ret)
          			goto out_free;
          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          		vma = find_vma(mm, start_vaddr);
          		if (vma && vma->vm_file &&
          		    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))
          			goto bypass_orig_flow;
          #endif // CONFIG_KSU_SUSFS_SUS_MAP
          """

          if "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))" not in text:
              if lock_anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c pagemap lock anchor not found"
                  )

              text = text.replace(
                  lock_anchor,
                  lock_block,
                  1
              )

          # --------------------------------------------------------
          # 6. Add bypass label before mmap unlock
          # --------------------------------------------------------

          unlock_anchor = """		walk_page_range(start_vaddr, end, &pagemap_walk);
          		mmap_read_unlock(mm);
          """

          unlock_block = """		walk_page_range(start_vaddr, end, &pagemap_walk);
          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          bypass_orig_flow:
          #endif // CONFIG_KSU_SUSFS_SUS_MAP
          		mmap_read_unlock(mm);
          """

          if "bypass_orig_flow:" not in text:
              if unlock_anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c pagemap unlock anchor not found"
                  )

              text = text.replace(
                  unlock_anchor,
                  unlock_block,
                  1
              )

          path.write_text(text)

          print("Manual SuSFS compatibility adaptations applied successfully.")
          PY


          # ========================================================
          # REMOVE EXPECTED REJECT FILES
          # ========================================================

          rm -f \
            fs/namespace.c.rej \
            fs/proc/task_mmu.c.rej \
            susfs_patch_to_4.19.patch

          echo
          echo "===== Verify no patch rejects remain ====="

          REMAINING_REJECTS="$(
            find . \
              -type f \
              \( -name '*.rej' -o -name '*.orig' \) \
              -print \
              | sort || true
          )"

          if [ -n "${REMAINING_REJECTS}" ]; then
            echo "::error::Patch reject/original files remain:"
            echo "${REMAINING_REJECTS}"
            exit 1
          fi


          # ========================================================
          # VERIFY REQUIRED SUSFS CODE
          # ========================================================

          echo
          echo "===== Verify namespace.c ====="

          grep -n \
            "susfs_is_current_ksu_domain" \
            fs/namespace.c

          grep -n \
            "susfs_alloc_non_unshare_ksu_vfsmnt" \
            fs/namespace.c


          echo
          echo "===== Verify task_mmu.c ====="

          grep -n \
            "SUSFS_IS_INODE_SUS_MAP" \
            fs/proc/task_mmu.c

          grep -n \
            "bypass_orig_flow" \
            fs/proc/task_mmu.c


          echo
          echo "===== SuSFS 4.19 integration complete ====="

      # ============================================================
      # SUSFS CONFIG
      # ============================================================

      - name: Enable SuSFS configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          CONFIG_FILE="arch/arm64/configs/${KERNEL_CONFIG}"

          cat >> "${CONFIG_FILE}" <<'EOF'

     # ============================================================
      # SUSFS CONFIG
      # ============================================================

      - name: Enable SuSFS configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          CONFIG_FILE="arch/arm64/configs/${KERNEL_CONFIG}"

          cat >> "${CONFIG_FILE}" <<'EOF'

          # ============================================================
          # SuSFS
          # ============================================================
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          echo "===== SuSFS configuration ====="

          grep -E \
            '^CONFIG_KSU_SUSFS' \
            "${CONFIG_FILE}"


      # ============================================================
      # VERIFY SOURCE BEFORE BUILD
      # ============================================================

      - name: Verify KernelSU and SuSFS integration
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          echo "===== KernelSU ====="

          test -d KernelSU

          grep -R \
            "CONFIG_KSU" \
            KernelSU \
            --include='Kconfig*' \
            --include='*.c' \
            --include='*.h' \
            | head -n 20 || true

          echo
          echo "===== SuSFS symbols ====="

          grep -R \
            "CONFIG_KSU_SUSFS" \
            . \
            --exclude-dir=.git \
            --exclude='*.rej' \
            --exclude='*.orig' \
            | head -n 50 || true

          echo
          echo "===== Reject files ====="

          if find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            -print \
            | grep -q .; then

            echo "::error::Rejected/original patch files remain."
            find . \
              -type f \
              \( -name '*.rej' -o -name '*.orig' \) \
              -print
            exit 1
          fi


      # ============================================================
      # CCACHE
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          export CCACHE_DIR="${WORKSPACE}/.ccache"

          mkdir -p "${CCACHE_DIR}"

          ccache -M "${CCACHE_SIZE}"
          ccache -z

          echo "CCACHE_DIR=${CCACHE_DIR}"


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build kernel
        shell: bash
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail

          export ARCH="${ARCH}"
          export SUBARCH="${ARCH}"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export CCACHE_DIR="${WORKSPACE}/.ccache"
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          export KCFLAGS="-Wno-error"

          export LLVM=1
          export LLVM_IAS=1

          mkdir -p "${BUILD_DIR}"

          echo "===== Generate defconfig ====="

          make \
            O="${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            "${DEFCONFIG}"

          echo "===== Verify generated .config ====="

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|CONFIG_KSU_SUSFS)' \
            "${BUILD_DIR}/.config" \
            || true

          echo "===== Kernel build ====="

          make \
            -j"$(nproc)" \
            O="${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            KCFLAGS="${KCFLAGS}"


      # ============================================================
      # VERIFY IMAGE
      # ============================================================

      - name: Verify kernel image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${BUILD_DIR}/arch/${ARCH}/boot/${KERNEL_IMAGE_NAME}"

          test -f "${IMAGE}" || {
            echo "::error::Kernel image not found:"
            echo "${IMAGE}"
            find "${BUILD_DIR}/arch/${ARCH}/boot" \
              -maxdepth 1 \
              -type f \
              -print
            exit 1
          }

          echo "===== Kernel image ====="
          ls -lh "${IMAGE}"

          file "${IMAGE}"


      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kiev-4.19-ReSukiSU-SuSFS-${{ github.run_number }}
          path: ${{ env.BUILD_DIR }}/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
          if-no-files-found: error
          compression-level: 0


      - name: Upload DTBO
        uses: actions/upload-artifact@v4
        with:
          name: kiev-dtbo-${{ github.run_number }}
          path: ${{ env.WORKSPACE }}/dtbo.img
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # DIAGNOSTIC ARTIFACT
      # ============================================================

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-integration-diagnostics-${{ github.run_number }}
          path: |
            ${{ env.KERNEL_PATH }}/**/*.rej
            ${{ env.KERNEL_PATH }}/**/*.orig
            ${{ env.KERNEL_PATH }}/.config
            ${{ env.KERNEL_PATH }}/Makefile
          if-no-files-found: ignore
          compression-level: 0


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## kiev Kernel Build"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Device | kiev |"
            echo "| Kernel | 4.19 |"
            echo "| Branch | lineage-23.2 |"
            echo "| Defconfig | vendor/lito-perf_defconfig |"
            echo "| KernelSU | ReSukiSU |"
            echo "| ReSukiSU ref | ${KSU_REF} |"
            echo "| Hook | manual + SuSFS inline |"
            echo "| SuSFS | enabled |"
            echo "| Image | Image.gz-dtb |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
