name: Kernel CI - kiev 4.19.325 - ReSukiSU + SuSFS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64

  KERNEL_DIR: kernel_src
  OUT_DIR: out

  DEFCONFIG: kiev_perfect_defconfig

  DEVICE: kiev
  KERNEL_VERSION_EXPECTED: "4.19.325"

  CCACHE_SIZE: 5G

jobs:
  build:
    name: kiev 4.19.325 + ReSukiSU + SuSFS
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ResuKisu+SusFS
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            patch \
            perl \
            python3 \
            rsync \
            unzip \
            zip \
            device-tree-compiler \
            dwarves

          echo
          echo "=============================="
          echo "Toolchain"
          echo "=============================="

          clang --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kiev-4.19.325-${{ github.ref_name }}-ccache
          restore-keys: |
            ${{ runner.os }}-kiev-4.19.325-${{ github.ref_name }}-
            ${{ runner.os }}-kiev-4.19.325-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.cache/ccache"

          ccache --set-config=max_size="${CCACHE_SIZE}"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          ccache --zero-stats

          echo
          echo "ccache configuration:"
          ccache --show-config

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify kernel source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "${KERNEL_DIR}" ]; then
            echo "::error::${KERNEL_DIR} does not exist."
            exit 1
          fi

          if [ ! -f "${KERNEL_DIR}/Makefile" ]; then
            echo "::error::${KERNEL_DIR}/Makefile does not exist."
            exit 1
          fi

          echo "Kernel source:"
          realpath "${KERNEL_DIR}"

          echo
          echo "Git commit:"
          git log -1 --oneline

          echo
          echo "Kernel Makefile:"
          sed -n '1,15p' "${KERNEL_DIR}/Makefile"

      # ============================================================
      # VERIFY KERNEL VERSION
      # ============================================================

      - name: Verify kernel 4.19.325
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          VERSION="$(awk -F'= ' '/^VERSION =/ {print $2}' Makefile)"
          PATCHLEVEL="$(awk -F'= ' '/^PATCHLEVEL =/ {print $2}' Makefile)"
          SUBLEVEL="$(awk -F'= ' '/^SUBLEVEL =/ {print $2}' Makefile)"

          DETECTED="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo "Detected kernel: ${DETECTED}"
          echo "Expected kernel: ${KERNEL_VERSION_EXPECTED}"

          if [ "${DETECTED}" != "${KERNEL_VERSION_EXPECTED}" ]; then
            echo "::error::Wrong kernel version."
            exit 1
          fi

          echo "Kernel version OK."

      # ============================================================
      # VERIFY KIEV DEFCONFIG
      # ============================================================

      - name: Verify kiev defconfig
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG_PATH="${KERNEL_DIR}/arch/${ARCH}/configs/${DEFCONFIG}"

          if [ ! -f "${DEFCONFIG_PATH}" ]; then
            echo "::error::Missing ${DEFCONFIG_PATH}"
            exit 1
          fi

          echo "Found:"
          echo "${DEFCONFIG_PATH}"

          echo
          echo "Kernel configuration header:"
          head -n 8 "${DEFCONFIG_PATH}"

      # ============================================================
      # VERIFY RESUKISU
      # ============================================================

      - name: Verify ReSukiSU
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          FOUND=false

          for dir in \
            drivers/kernelsu \
            drivers/ksu \
            KernelSU
          do
            if [ -d "${dir}" ]; then
              echo "Found KernelSU/ReSukiSU tree: ${dir}"
              FOUND=true
            fi
          done

          if [ "${FOUND}" != "true" ]; then
            echo "::error::ReSukiSU/KernelSU source tree not found."
            exit 1
          fi

          echo
          echo "ReSukiSU source detected."

      # ============================================================
      # VERIFY SUSFS SOURCE
      # ============================================================

      - name: Verify SuSFS
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          echo "Searching for SuSFS source..."

          SUSFS_FOUND=false

          if find . -type f \
              \( \
                -name 'susfs.c' \
                -o -name 'susfs.h' \
              \) \
              | grep -q .; then

            SUSFS_FOUND=true

          fi

          if [ "${SUSFS_FOUND}" != "true" ]; then
            echo "::error::SuSFS source files not found."
            exit 1
          fi

          echo "SuSFS source detected."

      # ============================================================
      # VERIFY MANUAL HOOK
      # ============================================================

      - name: Verify Manual Hook
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          echo "Searching Manual Hook implementation..."

          if grep -Rqs \
            "CONFIG_KSU_MANUAL_HOOK" \
            drivers/kernelsu \
            drivers/ksu \
            KernelSU \
            2>/dev/null; then

            echo "CONFIG_KSU_MANUAL_HOOK support detected."

          else

            echo "::warning::CONFIG_KSU_MANUAL_HOOK was not found in source tree."

          fi

          if [ -f "../kernelsu_manual_hooks.patch" ]; then
            echo
            echo "Manual Hook patch exists:"
            echo "../kernelsu_manual_hooks.patch"
            echo
            echo "It will NOT be applied automatically."
          fi

      # ============================================================
      # VERIFY DEFCONFIG OPTIONS
      # ============================================================

      - name: Verify ReSukiSU and SuSFS configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${KERNEL_DIR}/arch/${ARCH}/configs/${DEFCONFIG}"

          echo
          echo "=========================================="
          echo "ReSukiSU / SuSFS configuration"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_SUKISU|CONFIG_KSU_SUSFS)' \
            "${CONFIG}" || true

          echo
          echo "Checking mandatory options..."

          REQUIRED="
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_CALLBACK=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_MOUNT_UNMOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          "

          while IFS= read -r option; do

            [ -z "${option}" ] && continue

            if ! grep -q "^${option}$" "${CONFIG}"; then
              echo "::error::Missing configuration: ${option}"
              exit 1
            fi

            echo "OK: ${option}"

          done <<< "${REQUIRED}"

          echo
          echo "ReSukiSU + SuSFS configuration validated."

      # ============================================================
      # PREPARE OUTPUT
      # ============================================================

      - name: Prepare build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${OUT_DIR}"

          mkdir -p "${OUT_DIR}"

          echo "Output directory:"
          realpath "${OUT_DIR}"

      # ============================================================
      # GENERATE .CONFIG
      # ============================================================

      - name: Generate kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          make \
            O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            "${DEFCONFIG}"

          make \
            O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            olddefconfig

      # ============================================================
      # VERIFY FINAL .CONFIG
      # ============================================================

      - name: Verify final .config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"

          if [ ! -f "${CONFIG}" ]; then
            echo "::error::Generated .config not found."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "FINAL CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_SUKISU|CONFIG_KSU_SUSFS)' \
            "${CONFIG}" || true

          echo
          echo "Checking required options..."

          REQUIRED="
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_CALLBACK=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_MOUNT_UNMOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          "

          while IFS= read -r option; do

            [ -z "${option}" ] && continue

            if ! grep -q "^${option}$" "${CONFIG}"; then
              echo "::error::Final .config is missing: ${option}"
              exit 1
            fi

            echo "OK: ${option}"

          done <<< "${REQUIRED}"

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          export PATH="/usr/lib/ccache:${PATH}"

          echo
          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          echo "CPU threads: $(nproc)"
          echo "Architecture: ${ARCH}"
          echo "Device: ${DEVICE}"
          echo "Kernel: ${KERNEL_VERSION_EXPECTED}"
          echo "Compiler: Clang 18"
          echo "Root: ReSukiSU"
          echo "Hook: Manual Hook"
          echo "SuSFS: enabled"

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            SUBARCH="${SUBARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      # ============================================================
      # DTBS
      # ============================================================

      - name: Build DTBs
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR}"

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbs

      # ============================================================
      # FIND IMAGE
      # ============================================================

      - name: Locate kernel image
        shell: bash
        run: |
          set -euo pipefail

          BOOT_DIR="${OUT_DIR}/arch/${ARCH}/boot"

          echo "Boot directory:"
          ls -lah "${BOOT_DIR}"

          IMAGE=""

          for file in \
            Image.gz-dtb \
            Image.lz4-dtb \
            Image.gz \
            Image.lz4 \
            Image
          do
            if [ -f "${BOOT_DIR}/${file}" ]; then
              IMAGE="${BOOT_DIR}/${file}"
              break
            fi
          done

          if [ -z "${IMAGE}" ]; then
            echo "::error::No kernel Image found."

            find "${OUT_DIR}/arch/${ARCH}/boot" \
              -type f \
              -maxdepth 3 \
              -print

            exit 1
          fi

          echo "KERNEL_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

          echo
          echo "Selected kernel image:"
          ls -lh "${IMAGE}"

      # ============================================================
      # VERIFY VMLINUX
      # ============================================================

      - name: Verify vmlinux
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${OUT_DIR}/vmlinux" ]; then
            echo "::warning::vmlinux was not generated."
            exit 0
          fi

          echo "vmlinux:"
          ls -lh "${OUT_DIR}/vmlinux"

          echo
          echo "ReSukiSU/SuSFS symbols:"

          nm "${OUT_DIR}/vmlinux" 2>/dev/null \
            | grep -E 'ksu_|susfs_' \
            | head -100 \
            || true

      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: ccache statistics
        shell: bash
        run: |
          ccache --show-stats || true

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp "${KERNEL_IMAGE}" \
            artifacts/

          cp "${OUT_DIR}/.config" \
            artifacts/kernel.config

          if [ -f "${OUT_DIR}/vmlinux" ]; then
            cp "${OUT_DIR}/vmlinux" \
              artifacts/
          fi

          if [ -d "${OUT_DIR}/arch/${ARCH}/boot/dts" ]; then
            tar -C "${OUT_DIR}/arch/${ARCH}/boot" \
              -czf artifacts/dtb.tar.gz \
              dts
          fi

          cat > artifacts/build-info.txt <<EOF
          Device: Motorola One 5G Ace
          Codename: kiev
          Kernel: 4.19.325
          Android: 16
          LineageOS: 23.2
          Architecture: arm64
          Root: ReSukiSU
          Hook: Manual Hook
          SuSFS: enabled
          Compiler: Clang 18
          Repository: Albanel22/Copilote
          Branch: ResuKisu+SusFS
          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_RUN_NUMBER}
          EOF

          zip -r \
            "kiev-4.19.325-ReSukiSU-SuSFS-${GITHUB_RUN_NUMBER}.zip" \
            artifacts

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiev-4.19.325-ReSukiSU-SuSFS
          path: |
            artifacts/
            kiev-4.19.325-ReSukiSU-SuSFS-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14
