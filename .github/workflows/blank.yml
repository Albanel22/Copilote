name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

jobs:
  build:
    name: Build ReSukiSU + SuSFS
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Copilote
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lld \
            llvm \
            patch \
            perl \
            python3 \
            rsync \
            curl \
            wget \
            unzip \
            zip \
            lz4 \
            device-tree-compiler

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-sm8250-${{ env.KERNEL_BRANCH }}
          restore-keys: |
            ${{ runner.os }}-ccache-sm8250-

      # ============================================================
      # KERNEL SOURCE
      # ============================================================

      - name: Clone LineageOS kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${KERNEL_PATH}"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "=========================================="
          echo "Kernel repository"
          echo "=========================================="

          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

      - name: Verify Linux 4.19
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(awk -F'= ' '/^VERSION = / {print $2; exit}' Makefile)"
          PATCHLEVEL="$(awk -F'= ' '/^PATCHLEVEL = / {print $2; exit}' Makefile)"

          echo "Detected kernel: ${VERSION}.${PATCHLEVEL}"

          if [ "${VERSION}.${PATCHLEVEL}" != "4.19" ]; then
            echo "::error::Expected Linux 4.19"
            exit 1
          fi

      - name: Verify defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          test -f "${DEFCONFIG_FILE}"

          echo "Using:"
          echo "${DEFCONFIG_FILE}"

      # ============================================================
      # JACKA1LTMAN REPOSITORY
      # ============================================================

      - name: Clone JackA1ltman NonGKI repository
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf NonGKI_Kernel_Build_2nd

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            NonGKI_Kernel_Build_2nd

          test -f \
            NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch

          test -f \
            NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh

          echo "JackA1ltman patch files verified."

      # ============================================================
      # RESUKISU
      # ============================================================

      - name: Clean existing KernelSU if present
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d KernelSU ] || grep -q "CONFIG_KSU" fs/exec.c 2>/dev/null; then

            echo "Existing KernelSU detected."

            cp \
              ../NonGKI_Kernel_Build_2nd/bin/clean_hook.sh \
              ./clean_hook.sh

            chmod +x ./clean_hook.sh

            bash ./clean_hook.sh

            rm -f ./clean_hook.sh

          else

            echo "No existing KernelSU installation."

          fi

      - name: Embed current ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL \
            "${RESUKISU_SETUP}" \
            -o setup.sh

          chmod +x setup.sh

          echo "Installing current tagged ReSukiSU..."

          bash ./setup.sh

          rm -f setup.sh

          test -d KernelSU
          test -L drivers/kernelsu

          echo
          echo "ReSukiSU commit:"
          git -C KernelSU rev-parse HEAD

      # ============================================================
      # SUSFS INLINE HOOK
      # ============================================================

      - name: Apply SuSFS inline hook patches
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh \
            ./susfs_inline_hook_patches.sh

          chmod +x ./susfs_inline_hook_patches.sh

          bash ./susfs_inline_hook_patches.sh

          rm -f ./susfs_inline_hook_patches.sh

      # ============================================================
      # SUSFS PATCH
      # ============================================================

      - name: Apply JackA1ltman SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set +e

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch \
            ./susfs_patch_to_4.19.patch

          echo "=========================================="
          echo "Applying SuSFS 4.19 patch"
          echo "=========================================="

          patch -p1 < ./susfs_patch_to_4.19.patch

          PATCH_STATUS=$?

          echo
          echo "Initial patch exit code: ${PATCH_STATUS}"

          exit 0

      # ============================================================
      # MANUAL FIXES FOR THIS EXACT KERNEL
      # ============================================================

      - name: Resolve known SuSFS 4.19 rejects
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # ========================================================
          # fs/namespace.c
          # ========================================================

          path = Path("fs/namespace.c")
          text = path.read_text()

          include_anchor = "#include <linux/sched/task.h>\n"

          include_block = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          #include <linux/susfs_def.h>
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          """

          if "include <linux/susfs_def.h>" not in text:

              if include_anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/namespace.c include anchor not found"
                  )

              text = text.replace(
                  include_anchor,
                  include_anchor + include_block,
                  1
              )

          # The LineageOS 4.19 tree uses:
          #
          #     alloc_vfsmnt(fc->source ?: "none");
          #
          # inside vfs_create_mount().
          #
          # This is the exact 4.19+ variant documented by
          # JackA1ltman.

          original = 'mnt = alloc_vfsmnt(fc->source ?: "none");'

          susfs_marker = (
              'susfs_alloc_non_unshare_ksu_vfsmnt'
              '(fc->source ?: "none")'
          )

          if susfs_marker not in text:

              if original not in text:
                  raise SystemExit(
                      "ERROR: vfs_create_mount allocation anchor not found"
                  )

              replacement = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
              // - We will just stop checking for ksu process if /sdcard/Android is accessible,
              //   for the sake of performance
              if (static_branch_unlikely(&susfs_set_sdcard_android_data_decrypted_key_false)) {
                  if (susfs_is_current_ksu_domain()) {
                      mnt = susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: "none");
                      goto bypass_orig_flow;
                  }
              }
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT

              mnt = alloc_vfsmnt(fc->source ?: "none");

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          bypass_orig_flow:
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          """

              text = text.replace(
                  original,
                  replacement,
                  1
              )

          path.write_text(text)

          # ========================================================
          # fs/proc/task_mmu.c
          # ========================================================

          path = Path("fs/proc/task_mmu.c")
          text = path.read_text()

          susfs_map_code = (
              "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))"
          )

          if susfs_map_code not in text:

              declaration_anchor = """        int len;
                  unsigned long end;
              """

              if declaration_anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu declaration anchor not found"
                  )

              text = text.replace(
                  declaration_anchor,
                  declaration_anchor +
                  "        struct vm_area_struct *vma;\n",
                  1
              )

              lock_anchor = """        ret = mmap_read_lock_killable(mm);
                  if (ret)
                      goto out_free;
              """

              if lock_anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu mmap lock anchor not found"
                  )

              text = text.replace(
                  lock_anchor,
                  lock_anchor + """
          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
                  vma = find_vma(mm, start_vaddr);
                  if (vma && vma->vm_file &&
                      SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))
                      goto bypass_orig_flow;
          #endif

              """,
                  1
              )

              walk_anchor = """        ret = walk_page_range(start_vaddr, end, &pagemap_walk);
                  mmap_read_unlock(mm);
              """

              if walk_anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu walk anchor not found"
                  )

              text = text.replace(
                  walk_anchor,
                  """        ret = walk_page_range(start_vaddr, end, &pagemap_walk);

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          bypass_orig_flow:
          #endif

                  mmap_read_unlock(mm);
              """,
                  1
              )

          path.write_text(text)

          PY

          # The .rej files are now obsolete because the failed
          # hunks have been applied manually.
          find . -type f \
            \( -name "*.rej" -o -name "*.orig" \) \
            -delete

      # ============================================================
      # ZERO REJECT CHECK
      # ============================================================

      - name: Verify zero SuSFS rejects
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          REJECT_COUNT="$(
            find . \
              -type f \
              -name "*.rej" \
              | wc -l
          )"

          echo "=========================================="
          echo "SuSFS reject verification"
          echo "=========================================="

          echo "Reject count: ${REJECT_COUNT}"

          if [ "${REJECT_COUNT}" -ne 0 ]; then

            echo "::error::SuSFS still contains rejected hunks."

            find . \
              -type f \
              -name "*.rej" \
              -print

            exit 1
          fi

          echo "SuSFS patch: PASS"

      # ============================================================
      # DEFCONFIG
      # ============================================================

      - name: Configure ReSukiSU and SuSFS
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/vendor/lito-perf_defconfig"

          echo "=========================================="
          echo "Checking available KSU configuration"
          echo "=========================================="

          echo
          echo "KSU symbols found in KernelSU:"
          grep -RhoE 'config KSU[A-Za-z0-9_]*' KernelSU 2>/dev/null \
            | sort -u || true

          echo
          echo "SuSFS symbols found in KernelSU:"
          grep -RhoE 'config KSU_SUSFS[A-Za-z0-9_]*' KernelSU 2>/dev/null \
            | sort -u || true

          echo
          echo "=========================================="
          echo "Updating defconfig"
          echo "=========================================="

          python3 - "${DEFCONFIG_FILE}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          lines = text.splitlines()

          required = {
              "CONFIG_KSU": "y",
              "CONFIG_KALLSYMS": "y",
              "CONFIG_KALLSYMS_ALL": "y",
          }

          # Only enable symbols that actually exist in the
          # integrated ReSukiSU/SuSFS Kconfig.
          kernel_susfs = Path("KernelSU")

          available = set()

          for p in kernel_susfs.rglob("Kconfig*"):
              try:
                  data = p.read_text(errors="ignore")
              except Exception:
                  continue

              for line in data.splitlines():
                  line = line.strip()
                  if line.startswith("config "):
                      symbol = line.split()[1]
                      available.add(symbol)

          susfs_symbols = [
              "CONFIG_KSU_SUSFS",
              "CONFIG_KSU_SUSFS_SUS_PATH",
              "CONFIG_KSU_SUSFS_SUS_MOUNT",
              "CONFIG_KSU_SUSFS_SUS_KSTAT",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME",
              "CONFIG_KSU_SUSFS_ENABLE_LOG",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT",
              "CONFIG_KSU_SUSFS_SUS_MAP",
              "CONFIG_KSU_MANUAL_HOOK",
          ]

          for symbol in susfs_symbols:
              name = symbol.removeprefix("CONFIG_")

              if name in available:
                  required[symbol] = "y"
                  print(f"ENABLE: {symbol}=y")
              else:
                  print(f"SKIP:   {symbol} (not present in Kconfig)")

          # Remove existing definitions for the symbols we control.
          controlled = set(required)

          new_lines = []

          for line in lines:
              stripped = line.strip()

              remove = False

              if stripped.startswith("CONFIG_") and "=" in stripped:
                  key = stripped.split("=", 1)[0]
                  if key in controlled:
                      remove = True

              elif stripped.startswith("# CONFIG_ is not set"):
                  key = stripped.split(" ", 2)[1]
                  if key in controlled:
                      remove = True

              if not remove:
                  new_lines.append(line)

          for symbol, value in required.items():
              new_lines.append(f"{symbol}={value}")

          path.write_text("\n".join(new_lines) + "\n")
          PY

          echo
          echo "=========================================="
          echo "Defconfig KSU/SuSFS entries"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS)' \
            "${DEFCONFIG_FILE}" \
            || true
            
      # ============================================================
      # KERNEL CONFIGURATION
      # ============================================================

      - name: Generate kernel configuration
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "../${BUILD_DIR}"

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            "${DEFCONFIG}"

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            olddefconfig

      # ============================================================
      # CONFIG VALIDATION
      # ============================================================

      - name: Verify final kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f "${BUILD_DIR}/.config"

          echo "=========================================="
          echo "Final KSU/SuSFS configuration"
          echo "=========================================="

          grep -E \
            '^CONFIG_(KSU|KALLSYMS|KSU_SUSFS)' \
            "${BUILD_DIR}/.config" \
            || true

          echo
          echo "=========================================="
          echo "Mandatory configuration checks"
          echo "=========================================="

          REQUIRED_CONFIGS=(
            CONFIG_KSU
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
          )

          for CONFIG in "${REQUIRED_CONFIGS[@]}"; do

            if ! grep -q "^${CONFIG}=y$" "${BUILD_DIR}/.config"; then
              echo "::error::${CONFIG} is not enabled"
              exit 1
            fi

            echo "PASS: ${CONFIG}=y"

          done

          echo
          echo "=========================================="
          echo "Optional/current ReSukiSU symbols"
          echo "=========================================="

          OPTIONAL_CONFIGS=(
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for CONFIG in "${OPTIONAL_CONFIGS[@]}"; do

            if grep -q "^${CONFIG}=y$" "${BUILD_DIR}/.config"; then
              echo "ENABLED: ${CONFIG}"
            else
              echo "NOT ENABLED/PRESENT: ${CONFIG}"
            fi

          done

          echo
          echo "Configuration validation completed."

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build ARM64 kernel
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        env:
          CC: clang
          HOSTCC: clang
          CROSS_COMPILE: aarch64-linux-gnu-
          CLANG_TRIPLE: aarch64-linux-gnu-
        run: |
          set -euxo pipefail

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)"

      # ============================================================
      # COLLECT OUTPUT
      # ============================================================

      - name: Collect kernel artifacts
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts/kernel

          echo "=========================================="
          echo "ARM64 boot output"
          echo "=========================================="

          find "${BUILD_DIR}/arch/arm64/boot" \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

          for FILE in \
            "${BUILD_DIR}/arch/arm64/boot/Image" \
            "${BUILD_DIR}/arch/arm64/boot/Image.gz" \
            "${BUILD_DIR}/arch/arm64/boot/Image.gz-dtb" \
            "${BUILD_DIR}/arch/arm64/boot/dt.img" \
            "${BUILD_DIR}/arch/arm64/boot/dtb.img"; do

            if [ -f "${FILE}" ]; then
              cp "${FILE}" artifacts/kernel/
            fi

          done

          cp \
            "${BUILD_DIR}/.config" \
            artifacts/kernel/kernel.config

          {
            echo "Kernel repository:"
            echo "${KERNEL_REPO}"

            echo
            echo "Kernel branch:"
            echo "${KERNEL_BRANCH}"

            echo
            echo "Kernel commit:"
            git -C "${KERNEL_PATH}" rev-parse HEAD

            echo
            echo "ReSukiSU commit:"
            git -C "${KERNEL_PATH}/KernelSU" rev-parse HEAD

          } > artifacts/kernel/BUILD_INFO.txt

      # ============================================================
      # STOCK BOOT IMAGE
      # ============================================================

      - name: Download Kiev stock boot image
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts/boot

          curl -fL \
            "${BOOT_URL}" \
            -o artifacts/boot/boot-stock-kiev-20260809.img

          file \
            artifacts/boot/boot-stock-kiev-20260809.img

          ls -lh \
            artifacts/boot/boot-stock-kiev-20260809.img

      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set -e

          mkdir -p artifacts/diagnostic

          if [ -d "${KERNEL_PATH}" ]; then

            find "${KERNEL_PATH}" \
              -type f \
              \( -name "*.rej" -o -name "*.orig" \) \
              -print \
              > artifacts/diagnostic/rejects.txt \
              || true

            git -C "${KERNEL_PATH}" diff \
              > artifacts/diagnostic/kernel.diff \
              || true

          fi

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload successful build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-resukisu-susfs-4.19-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-resukisu-susfs-diagnostics-${{ github.run_number }}
          path: artifacts/diagnostic/
          if-no-files-found: warn
          retention-days: 14
