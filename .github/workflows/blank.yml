name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: LineageOS/android_kernel_motorola_sm8250
  KERNEL_BRANCH: lineage-23.2

  KERNEL_PATH: kernel_src
  BUILD_DIR: out

  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

jobs:
  build:
    name: Build ReSukiSU + SuSFS
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout kernel
      # ==========================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: ${{ env.KERNEL_PATH }}
          fetch-depth: 1

      # ==========================================================
      # 2. Dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            device-tree-compiler

      # ==========================================================
      # 3. Verify kernel version
      # ==========================================================
      - name: Verify kernel version
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          VERSION="$(sed -n 's/^VERSION = //p' Makefile | head -1)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -1)"

          echo "Kernel version: ${VERSION}.${PATCHLEVEL}"

          test "${VERSION}" = "4"
          test "${PATCHLEVEL}" = "19"

      # ==========================================================
      # 4. Fetch JackA1ltman tools
      # ==========================================================
      - name: Fetch NonGKI tools
        run: |
          set -eux

          rm -rf non_gki_tools

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            non_gki_tools

          test -f \
            non_gki_tools/Bin/clean_hook.sh

          test -f \
            non_gki_tools/Patches/susfs_inline_hook_patches.sh

          test -f \
            non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch

          echo "JackA1ltman tools verified."

      # ==========================================================
      # 5. Clean old KernelSU integration
      # ==========================================================
      - name: Clean previous KernelSU integration
        run: |
          set -eux

          if [ -d "${KERNEL_PATH}/KernelSU" ]; then

            echo "Existing KernelSU directory detected."

            cp \
              non_gki_tools/Bin/clean_hook.sh \
              "${KERNEL_PATH}/clean_hook.sh"

            chmod +x \
              "${KERNEL_PATH}/clean_hook.sh"

            (
              cd "${KERNEL_PATH}"
              bash clean_hook.sh
            )

            rm -f \
              "${KERNEL_PATH}/clean_hook.sh"

          else
            echo "No previous KernelSU tree found."
          fi

      # ==========================================================
      # 6. Install CURRENT ReSukiSU
      #
      # setup.sh uses pwd() as GKI_ROOT.
      # Therefore it MUST run from kernel_src.
      # ==========================================================
      - name: Install current ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          test -d drivers
          test -f drivers/Makefile
          test -f drivers/Kconfig

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "${RESUKISU_SETUP}" \
            | bash -s main

          test -d KernelSU

          test -f \
            KernelSU/kernel/Kconfig

          test -f \
            KernelSU/kernel/Makefile

          test -L \
            drivers/kernelsu

          echo
          echo "=========================================="
          echo "ReSukiSU installation verified"
          echo "=========================================="

          ls -ld KernelSU
          ls -l drivers/kernelsu

      # ==========================================================
      # 7. Configure lito-perf_defconfig
      # ==========================================================
      - name: Enable ReSukiSU and SuSFS
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          DEFCONFIG_FILE="arch/arm64/configs/vendor/lito-perf_defconfig"

          test -f "${DEFCONFIG_FILE}"

          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/vendor/lito-perf_defconfig")

          text = path.read_text()
          lines = text.splitlines()

          configs = {
              "CONFIG_KSU": "y",
              "CONFIG_KSU_MANUAL_HOOK": "y",

              "CONFIG_KALLSYMS": "y",
              "CONFIG_KALLSYMS_ALL": "y",

              "CONFIG_KSU_SUSFS": "y",
              "CONFIG_KSU_SUSFS_SUS_PATH": "y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT": "y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT": "y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME": "y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG": "y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS": "y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG": "y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT": "y",
              "CONFIG_KSU_SUSFS_SUS_MAP": "y",
          }

          result = []

          for line in lines:
              stripped = line.strip()

              if "=" in stripped:
                  key = stripped.split("=", 1)[0]

                  if key in configs:
                      continue

              if (
                  stripped.startswith("# CONFIG_")
                  and stripped.endswith(" is not set")
              ):
                  key = stripped[2:-len(" is not set")]

                  if key in configs:
                      continue

              result.append(line)

          for key, value in configs.items():
              result.append(f"{key}={value}")

          path.write_text(
              "\n".join(result) + "\n"
          )
          PY

          echo
          echo "=========================================="
          echo "Defconfig ReSukiSU + SuSFS"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS)' \
            "${DEFCONFIG_FILE}"

      # ==========================================================
      # 8. Apply SuSFS 4.19 patch
      #
      # The upstream JackA1ltman 4.19 patch applies almost
      # completely to this kernel.
      #
      # Three known context differences are repaired below:
      #
      #   fs/namespace.c:
      #     - include / declarations
      #     - clone_mnt()
      #
      #   fs/proc/task_mmu.c:
      #     - pagemap_read()
      #
      # IMPORTANT:
      # Do NOT use "|| true" blindly.
      # The exit status is captured and the remaining rejects
      # are explicitly checked.
      # ==========================================================
      - name: Apply SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -u

          PATCH_FILE="${GITHUB_WORKSPACE}/non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch"

          test -f "${PATCH_FILE}"

          cp \
            "${PATCH_FILE}" \
            susfs_patch_to_4.19.patch

          echo
          echo "=========================================="
          echo "Applying JackA1ltman SuSFS 4.19 patch"
          echo "=========================================="

          PATCH_STATUS=0

          patch \
            --batch \
            --forward \
            --reject-file=- \
            -p1 \
            < susfs_patch_to_4.19.patch \
            || PATCH_STATUS=$?

          echo
          echo "Initial patch exit status: ${PATCH_STATUS}"

          exit 0

      # ==========================================================
      # 9. Resolve the three known 4.19 context differences
      #
      # This is NOT a generic reject bypass.
      #
      # Every insertion is checked against the exact current
      # LineageOS sm8250 4.19 source tree.
      # ==========================================================
      - name: Resolve known SuSFS 4.19 context differences
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          # ========================================================
          # fs/namespace.c
          # ========================================================

          path = Path("fs/namespace.c")
          text = path.read_text()

          # --------------------------------------------------------
          # Difference #1:
          # SuSFS include + declarations.
          #
          # The Motorola tree has:
          #
          #   #include <linux/sched/task.h>
          #   #include <linux/fs_context.h>
          #
          # while the patch context was based on the older layout.
          # --------------------------------------------------------

          if "#include <linux/susfs_def.h>" not in text:

              anchor = "#include <linux/sched/task.h>"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: "
                      "sched/task include anchor not found."
                  )

              insertion = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          #include <linux/susfs_def.h>
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          """

              text = text.replace(
                  anchor,
                  anchor + "\n" + insertion.rstrip(),
                  1
              )

          if "susfs_is_current_ksu_domain" not in text:

              anchor = """#include "internal.h"
          """

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: "
                      "internal.h anchor not found."
                  )

              insertion = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          extern bool susfs_is_current_ksu_domain(void);
          extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;

          #define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */

          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          """

              text = text.replace(
                  anchor,
                  anchor + "\n" + insertion.rstrip() + "\n",
                  1
              )

          # --------------------------------------------------------
          # Difference #2:
          # clone_mnt()
          #
          # The patch expects the SuSFS allocation flow before the
          # original alloc_vfsmnt().
          # --------------------------------------------------------

          if "susfs_alloc_unshare_ksu_vfsmnt" in text:

              if "bool is_mnt_ksu_unshared = false;" not in text:

                  anchor = """\tstruct mount *mnt;
          \tint err;
          """

                  if anchor not in text:
                      raise SystemExit(
                          "ERROR: fs/namespace.c: "
                          "clone_mnt() declaration anchor not found."
                      )

                  insertion = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tbool is_mnt_ksu_unshared = false;

          \t// - We will just stop checking for ksu process if /sdcard/Android is accessible,
          \t//   for the sake of performance
          \tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {
          \t// - If /sdcard/Android is still not accessible, we keep checking for mounts
          \t//   mounted by ksu process
          \t\tif (susfs_is_current_ksu_domain()) {
          \t\t\t// - If it is unsharing, we re-use the old->mnt_id assign it for
          \t\t\t//   mnt->mnt_id directly without going thru ida.
          \t\t\tif (flag & CL_COPY_MNT_NS) {
          \t\t\t\tmnt = susfs_alloc_unshare_ksu_vfsmnt(
          \t\t\t\t\told->mnt_devname,
          \t\t\t\t\told->mnt_id);
          \t\t\t\tis_mnt_ksu_unshared = true;
          \t\t\t\tgoto bypass_orig_flow;
          \t\t\t}

          \t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(
          \t\t\t\told->mnt_devname);
          \t\t\tgoto bypass_orig_flow;
          \t\t}
          \t}

          \tif (old->mnt_id >= DEFAULT_KSU_MNT_ID) {
          \t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(
          \t\t\told->mnt_devname);
          \t\tgoto bypass_orig_flow;
          }
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          """

                  text = text.replace(
                      anchor,
                      anchor + "\n" + insertion.rstrip(),
                      1
                  )

          # --------------------------------------------------------
          # Ensure bypass label exists immediately after original
          # alloc_vfsmnt() in clone_mnt().
          # --------------------------------------------------------

          clone_start = text.find(
              "static struct mount *clone_mnt("
          )

          if clone_start == -1:
              raise SystemExit(
                  "ERROR: fs/namespace.c: clone_mnt() not found."
              )

          clone_end = text.find(
              "static void cleanup_mnt(",
              clone_start
          )

          if clone_end == -1:
              raise SystemExit(
                  "ERROR: fs/namespace.c: clone_mnt() end not found."
              )

          clone = text[clone_start:clone_end]

          if (
              "bypass_orig_flow:" not in clone
              and "mnt = alloc_vfsmnt(old->mnt_devname);" in clone
          ):

              old = """\tmnt = alloc_vfsmnt(old->mnt_devname);
          \tif (!mnt)
          """

              new = """\tmnt = alloc_vfsmnt(old->mnt_devname);
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          bypass_orig_flow:
          #endif
          \tif (!mnt)
          """

              if old not in clone:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: "
                      "alloc_vfsmnt() anchor not found."
                  )

              clone = clone.replace(old, new, 1)

              text = (
                  text[:clone_start]
                  + clone
                  + text[clone_end:]
              )

          # --------------------------------------------------------
          # Ensure unshared mount flag is set.
          # --------------------------------------------------------

          clone_start = text.find(
              "static struct mount *clone_mnt("
          )

          clone_end = text.find(
              "static void cleanup_mnt(",
              clone_start
          )

          clone = text[clone_start:clone_end]

          if (
              "VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT"
              not in clone
          ):

              anchor = """\tmnt->mnt.mnt_flags = old->mnt.mnt_flags;
          \tmnt->mnt.mnt_flags &= ~(MNT_WRITE_HOLD|MNT_MARKED|MNT_INTERNAL);
          """

              if anchor not in clone:
                  raise SystemExit(
                      "ERROR: fs/namespace.c: "
                      "mount flags anchor not found."
                  )

              insertion = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tif (unlikely(is_mnt_ksu_unshared))
          \t\tmnt->mnt.mnt_flags |= VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT;

          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          """

              clone = clone.replace(
                  anchor,
                  anchor + "\n" + insertion.rstrip() + "\n",
                  1
              )

              text = (
                  text[:clone_start]
                  + clone
                  + text[clone_end:]
              )

          path.write_text(text)

          # ========================================================
          # fs/proc/task_mmu.c
          # ========================================================

          path = Path("fs/proc/task_mmu.c")
          text = path.read_text()

          # The declaration hunk normally applies automatically.
          # Add it here only if it did not.
          if (
              "struct vm_area_struct *vma;"
              not in text[text.find("static ssize_t pagemap_read"):
                          text.find("static ssize_t pagemap_read") + 1200]
          ):

              start = text.find(
                  "static ssize_t pagemap_read("
              )

              if start == -1:
                  raise SystemExit(
                      "ERROR: fs/proc/task_mmu.c: "
                      "pagemap_read() not found."
                  )

              body_end = text.find(
                  "\n}",
                  start
              )

              if body_end == -1:
                  raise SystemExit(
                      "ERROR: fs/proc/task_mmu.c: "
                      "pagemap_read() end not found."
                  )

              function = text[start:body_end]

              anchor = """\tint ret = 0, copied = 0;
          """

              if anchor not in function:
                  raise SystemExit(
                      "ERROR: fs/proc/task_mmu.c: "
                      "pagemap declaration anchor not found."
                  )

              insertion = """#ifdef CONFIG_KSU_SUSFS_SUS_MAP
          \tstruct vm_area_struct *vma;
          #endif
          """

              function = function.replace(
                  anchor,
                  anchor + insertion,
                  1
              )

              text = (
                  text[:start]
                  + function
                  + text[body_end:]
              )

          # --------------------------------------------------------
          # pagemap_read() actual 4.19 locking flow.
          #
          # Current tree uses:
          #
          #   down_read_killable(&mm->mmap_sem)
          #   walk_page_range()
          #   up_read(&mm->mmap_sem)
          #
          # This is the exact 4.19 form expected by the patch.
          # --------------------------------------------------------

          if "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))" not in text:

              marker = """\t\tret = down_read_killable(&mm->mmap_sem);
          \t\tif (ret)
          \t\t\tgoto out_free;
          \t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);
          \t\tup_read(&mm->mmap_sem);
          """

              replacement = """\t\tret = down_read_killable(&mm->mmap_sem);
          \t\tif (ret)
          \t\t\tgoto out_free;

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          \t\tvma = find_vma(mm, start_vaddr);
          \t\tif (vma && vma->vm_file &&
          \t\t    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))
          \t\t\tgoto bypass_orig_flow;
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP

          \t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          bypass_orig_flow:
          #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP

          \t\tup_read(&mm->mmap_sem);
          """

              if marker not in text:
                  raise SystemExit(
                      "ERROR: fs/proc/task_mmu.c: "
                      "pagemap_read() locking anchor not found."
                  )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)

          print("Known SuSFS 4.19 context differences resolved.")
          PY

      # ==========================================================
      # 10. Verify SuSFS patch result
      # ==========================================================
      - name: Verify SuSFS patch result
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          echo
          echo "=========================================="
          echo "SuSFS reject audit"
          echo "=========================================="

          REJECT_COUNT="$(
            find . \
              -type f \
              -name '*.rej' \
              | wc -l
          )"

          echo "Reject files: ${REJECT_COUNT}"

          if [ "${REJECT_COUNT}" -ne 0 ]; then

            echo "::error::Remaining SuSFS rejected hunks."

            find . \
              -type f \
              -name '*.rej' \
              -print

            exit 1
          fi

          # --------------------------------------------------------
          # Verify namespace integration.
          # --------------------------------------------------------

          grep -q \
            "susfs_is_current_ksu_domain" \
            fs/namespace.c

          grep -q \
            "susfs_alloc_non_unshare_ksu_vfsmnt" \
            fs/namespace.c

          grep -q \
            "susfs_alloc_unshare_ksu_vfsmnt" \
            fs/namespace.c

          grep -q \
            "CL_COPY_MNT_NS" \
            fs/namespace.c

          # --------------------------------------------------------
          # Verify pagemap integration.
          # --------------------------------------------------------

          grep -q \
            "SUSFS_IS_INODE_SUS_MAP" \
            fs/proc/task_mmu.c

          # --------------------------------------------------------
          # Verify SuSFS source files.
          # --------------------------------------------------------

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          echo
          echo "=========================================="
          echo "SuSFS 4.19 integration verified"
          echo "=========================================="

      # ==========================================================
      # 11. Apply JackA1ltman inline hooks
      # ==========================================================
      - name: Apply JackA1ltman SuSFS inline hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          cp \
            "${GITHUB_WORKSPACE}/non_gki_tools/Patches/susfs_inline_hook_patches.sh" \
            ./susfs_inline_hook_patches.sh

          chmod +x \
            ./susfs_inline_hook_patches.sh

          bash \
            ./susfs_inline_hook_patches.sh

          rm -f \
            ./susfs_inline_hook_patches.sh

      # ==========================================================
      # 12. Add ReSukiSU stat return hooks
      # ==========================================================
      - name: Add ReSukiSU stat return hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          path = Path("fs/stat.c")
          text = path.read_text()

          # ========================================================
          # newfstat return hook
          # ========================================================

          if "ksu_handle_newfstat_ret" not in text:

              declaration = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern void ksu_handle_newfstat_ret(
              unsigned int *fd,
              struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd,
              struct stat64 __user **statbuf_ptr);
          #endif
          #endif
          """

              anchors = [
                  "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)",
                  "#if !defined(__ARCH_WANT_STAT64)",
                  "SYSCALL_DEFINE4(newfstatat",
              ]

              anchor = next(
                  (a for a in anchors if a in text),
                  None
              )

              if anchor is None:
                  raise SystemExit(
                      "ERROR: fs/stat.c: "
                      "cannot locate stat declaration anchor."
                  )

              text = text.replace(
                  anchor,
                  declaration.strip("\n") + "\n\n" + anchor,
                  1
              )

          # ========================================================
          # Insert newfstat return hook.
          # ========================================================

          if "ksu_handle_newfstat_ret(&fd, &statbuf);" not in text:

              start = text.find(
                  "SYSCALL_DEFINE2(newfstat,"
              )

              if start == -1:
                  raise SystemExit(
                      "ERROR: fs/stat.c: "
                      "SYSCALL_DEFINE2(newfstat) not found."
                  )

              end = text.find(
                  "\n}",
                  start
              )

              if end == -1:
                  raise SystemExit(
                      "ERROR: fs/stat.c: "
                      "newfstat end not found."
                  )

              function = text[start:end]

              if "cp_new_stat(&stat, statbuf)" not in function:
                  raise SystemExit(
                      "ERROR: fs/stat.c: "
                      "unexpected newfstat implementation."
                  )

              hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          \treturn error;"""

              function = function.replace(
                  "\treturn error;",
                  hook,
                  1
              )

              text = (
                  text[:start]
                  + function
                  + text[end:]
              )

          # ========================================================
          # Optional fstat64 hook.
          # ========================================================

          if (
              "SYSCALL_DEFINE2(fstat64" in text
              and
              "ksu_handle_fstat64_ret(&fd, &statbuf);" not in text
          ):

              start = text.find(
                  "SYSCALL_DEFINE2(fstat64"
              )

              end = text.find(
                  "\n}",
                  start
              )

              if start == -1 or end == -1:
                  raise SystemExit(
                      "ERROR: fs/stat.c: "
                      "fstat64 implementation not found."
                  )

              function = text[start:end]

              if "cp_new_stat64(&stat, statbuf)" not in function:
                  raise SystemExit(
                      "ERROR: fs/stat.c: "
                      "unexpected fstat64 implementation."
                  )

              hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          \treturn error;"""

              function = function.replace(
                  "\treturn error;",
                  hook,
                  1
              )

              text = (
                  text[:start]
                  + function
                  + text[end:]
              )

          path.write_text(text)
          PY

          grep -n \
            "ksu_handle_newfstat_ret" \
            fs/stat.c

          if grep -q \
            "SYSCALL_DEFINE2(fstat64" \
            fs/stat.c; then

            grep -n \
              "ksu_handle_fstat64_ret" \
              fs/stat.c || true

          fi

      # ==========================================================
      # 13. Verify ReSukiSU manual hooks
      # ==========================================================
      - name: Verify ReSukiSU manual hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          echo
          echo "=========================================="
          echo "Checking ReSukiSU manual hooks"
          echo "=========================================="

          grep -q \
            "ksu_handle_execveat" \
            fs/exec.c

          grep -q \
            "ksu_handle_faccessat" \
            fs/open.c

          grep -q \
            "ksu_handle_stat" \
            fs/stat.c

          grep -q \
            "ksu_handle_newfstat_ret" \
            fs/stat.c

          grep -q \
            "ksu_handle_sys_reboot" \
            kernel/reboot.c

          grep -q \
            "ksu_handle_setresuid" \
            kernel/sys.c

          grep -q \
            "ksu_handle_sys_read" \
            fs/read_write.c

          grep -q \
            "ksu_handle_input_handle_event" \
            drivers/input/input.c

          echo "All required ReSukiSU manual hooks detected."

      # ==========================================================
      # 14. Prepare build directory
      # ==========================================================
      - name: Prepare build directory
        run: |
          set -eux

          rm -rf \
            "${BUILD_DIR}"

          mkdir -p \
            "${BUILD_DIR}"

      # ==========================================================
      # 15. Generate defconfig
      # ==========================================================
      - name: Configure kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          make \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            SUBARCH="${SUBARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            "${DEFCONFIG}"

      # ==========================================================
      # 16. Verify final configuration
      # ==========================================================
      - name: Verify final configuration
        run: |
          set -eux

          CONFIG="${BUILD_DIR}/.config"

          test -f \
            "${CONFIG}"

          REQUIRED_CONFIGS=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for CONFIG_NAME in "${REQUIRED_CONFIGS[@]}"; do

            if ! grep -q \
              "^${CONFIG_NAME}=y$" \
              "${CONFIG}"; then

              echo "::error::${CONFIG_NAME} is not enabled."
              exit 1

            fi

          done

          echo
          echo "=========================================="
          echo "ReSukiSU + SuSFS configuration verified"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS)' \
            "${CONFIG}"

      # ==========================================================
      # 17. Build kernel
      # ==========================================================
      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            SUBARCH="${SUBARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            2>&1 \
            | tee \
            "${GITHUB_WORKSPACE}/kernel-build.log"

      # ==========================================================
      # 18. Verify Image
      # ==========================================================
      - name: Verify kernel image
        run: |
          set -eux

          IMAGE="${BUILD_DIR}/arch/arm64/boot/Image"

          test -f \
            "${IMAGE}"

          ls -lh \
            "${IMAGE}"

          file \
            "${IMAGE}"

      # ==========================================================
      # 19. Download stock boot
      # ==========================================================
      - name: Download stock boot image
        run: |
          set -eux

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "${BOOT_URL}" \
            -o stock-boot.img

          test -s \
            stock-boot.img

          file \
            stock-boot.img

      # ==========================================================
      # 20. Package artifacts
      # ==========================================================
      - name: Package artifacts
        run: |
          set -eux

          rm -rf \
            release

          mkdir -p \
            release

          cp \
            "${BUILD_DIR}/arch/arm64/boot/Image" \
            release/Image

          cp \
            stock-boot.img \
            release/stock-boot.img

          cp \
            kernel-build.log \
            release/kernel-build.log

          tar \
            -czf \
            resukisu-susfs-kernel.tar.gz \
            -C release \
            .

      # ==========================================================
      # 21. Upload artifacts
      # ==========================================================
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-susfs-kernel
          path: |
            release/
            kernel-build.log
            resukisu-susfs-kernel.tar.gz
          if-no-files-found: warn
