name: Kernel CI — KernelSU modern test

on:
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex glibc-source \
            libelf-dev libssl-dev libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang llvm lld device-tree-compiler \
            zip unzip curl git

      - name: Download Stock Boot Image
        shell: bash
        run: |
          set -euo pipefail
          echo "📥 Téléchargement du boot.img..."
          curl -fLo boot-stock.img "${{ env.BOOT_URL }}"

      - name: Clone Kernel Source
        run: |
          set -euo pipefail
          git clone \
            https://github.com/Albanel22/android_kernel_motorola_sm8250.git \
            -b lineage-23.2 \
            --depth=1 \
            "${{ env.KERNEL_PATH }}"

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-kernel-modern
          restore-keys: |
            ${{ runner.os }}-ccache-kernel-
            ${{ runner.os }}-ccache-

      - name: Integrate KernelSU & SUSFS
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== KernelSU ==="

          # TEST : version KernelSU à définir ici
          # NE PAS mettre 32525 : ce numéro correspond au Manager.
          KSU_VERSION="v0.9.5"

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "$KSU_VERSION"

          if ! grep -q 'drivers/kernelsu/Kconfig' init/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> init/Kconfig
          fi

          echo "=== SUSFS ==="
          git clone https://gitlab.com/simonpunk/susfs4ksu.git

          echo "=== Vérification patch KernelSU/SUSFS ==="
          ls -l susfs4ksu/kernel_patches/KernelSU/

          echo "=== Application du patch KernelSU/SUSFS ==="
          cd KernelSU
          patch -p1 < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd ..

          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
      
      - name: Inspecter Kconfig SUSFS
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
         echo "=== Kconfig dans susfs4ksu ==="
         find susfs4ksu -type f \( -name 'Kconfig' -o -name '*Kconfig*' \) -print

         echo "=== Symboles SUSFS dans susfs4ksu ==="
         grep -Rns "config KSU_SUSFS" susfs4ksu 2>/dev/null || true
         grep -Rns "KSU_SUSFS" susfs4ksu 2>/dev/null | head -200 || true

          echo "=== Application du patch SUSFS personnalisé ==="

          patch -p1 -f \
            < "${GITHUB_WORKSPACE}/patches/50_add_susfs_in_kernel-4.19.patch"

          echo "=== Vérification des rejects ==="

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "❌ Des fichiers .rej ont été générés."
            find . -name '*.rej' -print
            exit 1
          fi

          echo "✅ SUSFS appliqué sans aucun .rej"

      - name: Vérifier Kconfig SUSFS
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
         echo "=== Recherche CONFIG_KSU_SUSFS ==="
         grep -Rns "config KSU_SUSFS" drivers include init 2>/dev/null || true

         echo "=== Recherche KSU_SUSFS dans tout le kernel ==="
         grep -Rns "KSU_SUSFS" drivers init fs include 2>/dev/null | head -100 || true

         echo "=== Kconfig KernelSU ==="
         grep -n -A20 -B5 "KSU" drivers/kernelsu/Kconfig || true

         echo "=== Kconfig SUSFS ==="
         find . -iname "*susfs*Kconfig*" -o -iname "*Kconfig*" | grep -i susfs || true

      - name: Debug SUSFS
        if: always()
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          echo "=== Recherche des .rej ==="
          find . -name '*.rej' -print || true

          echo "=== Vérification fs/open.c ==="
          grep -n "CONFIG_KSU_SUSFS_SUS_PATH" fs/open.c || true

          echo "=== Vérification task_mmu.c ==="
          grep -n "linux/susfs.h" fs/proc/task_mmu.c || true

      - name: Collect SUSFS patch rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-patch-rejects-modern-test
          path: |
            ${{ env.KERNEL_PATH }}/**/*.rej
          if-no-files-found: ignore

      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          ccache -C

          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export USE_CCACHE=1
          export CCACHE_EXEC="$(which ccache)"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"

          echo "📂 Préparation du defconfig..."

          cp \
            "arch/arm64/configs/vendor/${{ env.DEFCONFIG }}" \
            "arch/arm64/configs/${{ env.DEFCONFIG }}"

          echo "📂 Génération de la configuration..."

          make \
            O="${{ env.BUILD_DIR }}" \
            LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "${{ env.DEFCONFIG }}"

          echo "🔧 Activation KSU/SUSFS/KPROBES..."

          ./scripts/config --file "out/.config" \
          -e CONFIG_KSU \
          -e CONFIG_KSU_SUSFS \
          -e CONFIG_KSU_SUSFS_SUS_PATH \
          -e CONFIG_KPROBES \
          -e CONFIG_KRETPROBES

          echo "⚡ olddefconfig..."
          make \
          O="$BUILD_DIR" \
          LLVM=1 \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          olddefconfig

          echo "🔍 Vérification configuration finale..."

          echo "=== KernelSU ==="
          grep -E '^CONFIG_KSU(=|_)' "out/.config" || true

          echo "=== SUSFS ==="
          grep -E '^CONFIG_KSU_SUSFS(=|_)' "out/.config" || true

          echo "=== KPROBES ==="
          grep -E '^CONFIG_(KPROBES|KRETPROBES)(=|_)' "out/.config" || true

          grep -q '^CONFIG_KSU=y$' "out/.config" || {
          echo "❌ CONFIG_KSU n'est pas activé"
          exit 1
          }

          grep -q '^CONFIG_KSU_SUSFS=y$' "out/.config" || {
          echo "❌ CONFIG_KSU_SUSFS n'est pas activé"
          exit 1
          }

          grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y$' "out/.config" || {
          echo "❌ CONFIG_KSU_SUSFS_SUS_PATH n'est pas activé"
          exit 1
          }

          grep -q '^CONFIG_KPROBES=y$' "out/.config" || {
          echo "❌ CONFIG_KPROBES n'est pas activé"
          exit 1
          }

          echo "✅ KSU + SUSFS + SUS_PATH + KPROBES correctement activés"

          echo "🔍 Vérification détaillée de la configuration..."

          echo "=== KSU ==="
          grep -E '^CONFIG_KSU(=|_)|^# CONFIG_KSU' \
          "${{ env.BUILD_DIR }}/.config" || true

          echo "=== SUSFS ==="
          grep -E '^CONFIG_KSU_SUSFS(=|_)|^# CONFIG_KSU_SUSFS' \
          "${{ env.BUILD_DIR }}/.config" || true

          echo "=== KPROBES ==="
          grep -E '^CONFIG_(KPROBES|HAVE_KPROBES|KRETPROBES)(=|_)|^# CONFIG_(KPROBES|HAVE_KPROBES|KRETPROBES)' \
          "${{ env.BUILD_DIR }}/.config" || true

          echo "🚀 Compilation..."

          make \
            O="${{ env.BUILD_DIR }}" \
            LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            KCFLAGS="$KCFLAGS" \
            -j"$(nproc)" \
            Image

      - name: Repack & Finalize
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p repack

          cp boot-stock.img repack/boot.img

          wget -q \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk \
            -O Magisk-v27.0.apk

          unzip -q \
            Magisk-v27.0.apk \
            lib/x86_64/libmagiskboot.so

          mv lib/x86_64/libmagiskboot.so repack/magiskboot
          chmod +x repack/magiskboot

          cd repack

          ./magiskboot unpack boot.img

          cp \
            "${GITHUB_WORKSPACE}/${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image" \
            kernel

          ./magiskboot repack boot.img new-boot.img

          mv new-boot.img ../final_boot.img

          cd ..

          mkdir -p final_output

          mv final_boot.img final_output/boot.img

      - name: Upload Finished Packaged Assets
        uses: actions/upload-artifact@v4
        with:
          name: kernel-motorola-modern-test
          path: final_output/boot.img
