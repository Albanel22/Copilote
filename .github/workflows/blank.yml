name: Kernel CI — KernelSU

on:
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            glibc-source \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang \
            llvm \
            lld \
            device-tree-compiler \
            zip \
            unzip \
            curl \
            git

      - name: Download Stock Boot Image
        shell: bash
        run: |
          set -euo pipefail

          echo "📥 Téléchargement du boot.img..."
          curl -fLo boot-stock.img "${{ env.BOOT_URL }}"

          test -s boot-stock.img

          echo "✅ boot-stock.img téléchargé"

      - name: Clone Kernel Source
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            https://github.com/Albanel22/android_kernel_motorola_sm8250.git \
            -b lineage-23.2 \
            --depth=1 \
            "${{ env.KERNEL_PATH }}"

          cd "${{ env.KERNEL_PATH }}"

          echo "=== Kernel source ==="
          git rev-parse HEAD
          git branch --show-current

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-kernel-modern
          restore-keys: |
            ${{ runner.os }}-ccache-kernel-
            ${{ runner.os }}-ccache-

      - name: Integrate KernelSU 3.2.5 & SUSFS 1.4.2
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== KernelSU v3.2.5 ==="
          echo "========================================"

          KSU_VERSION="v3.2.5"

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "$KSU_VERSION"

          echo "=== Vérification KernelSU ==="

          test -d KernelSU
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile

          if ! grep -q "drivers/kernelsu/Kconfig" init/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> init/Kconfig
          fi

          echo "=== KernelSU Kconfig ==="
          grep -n "config KSU" KernelSU/kernel/Kconfig | head -20 || true

          echo "========================================"
          echo "=== SUSFS 1.4.2-kernel-4.19 ==="
          echo "========================================"

          git clone \
            --branch 1.4.2-kernel-4.19 \
            --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git

          cd susfs4ksu

          echo "=== Version SUSFS ==="
          git describe --tags --always
          git rev-parse HEAD

          test "$(git describe --tags --always)" = "1.4.2-kernel-4.19"

          cd ..

          echo "=== Vérification 10_enable_susfs_for_ksu.patch ==="

          test -f \
            susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          ls -lh \
            susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          echo "=== Vérification path_umount dans le patch 10 ==="

          grep -n -E \
            "path_umount|PATH_UMOUNT|namespace.c" \
            susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            || true

          echo "========================================"
          echo "=== Application patch KernelSU/SUSFS ==="
          echo "========================================"

          cd KernelSU

          patch -p1 \
            < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          cd ..

          echo "=== Vérification application patch ==="

          if find KernelSU -name '*.rej' -print -quit | grep -q .; then
            echo "❌ Le patch 10_enable_susfs_for_ksu.patch a généré un .rej"
            find KernelSU -name '*.rej' -print
            exit 1
          fi

          echo "✅ Patch 10 appliqué sans .rej"

          echo "========================================"
          echo "=== Installation des fichiers SUSFS ==="
          echo "========================================"

          cp \
            susfs4ksu/kernel_patches/fs/susfs.c \
            fs/

          cp \
            susfs4ksu/kernel_patches/include/linux/susfs.h \
            include/linux/

          echo "=== Vérification susfs.c ==="
          test -f fs/susfs.c
          test -f include/linux/susfs.h

          echo "========================================"
          echo "=== Patch kernel 4.19 ==="
          echo "========================================"

          patch -p1 -f \
            < "${GITHUB_WORKSPACE}/patches/50_add_susfs_in_kernel-4.19.patch"

          echo "=== Vérification rejects ==="

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "❌ Des .rej ont été générés"
            find . -name '*.rej' -print
            exit 1
          fi

          echo "✅ Patch 50 appliqué sans .rej"

      - name: Verify Modern KernelSU / SUSFS Integration
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "=== Vérification KernelSU ==="
          echo "========================================"

          grep -Rns \
            "KSU" \
            KernelSU/kernel/Kconfig \
            KernelSU/kernel/Makefile \
            | head -100 || true

          echo "========================================"
          echo "=== Vérification SUSFS ==="
          echo "========================================"

          grep -Rns \
            "KSU_SUSFS" \
            KernelSU/kernel/Kconfig \
            KernelSU/kernel/Makefile \
            | head -150 || true

          echo "========================================"
          echo "=== Vérification path_umount ==="
          echo "========================================"

          grep -Rns \
            "path_umount" \
            . \
            --include='*.c' \
            --include='*.h' \
            --exclude-dir=.git \
            | head -100 || true

          echo "========================================"
          echo "=== Vérification kernel/Makefile ==="
          echo "========================================"

          grep -n -A40 -B10 \
            "PATH_UMOUNT" \
            KernelSU/kernel/Makefile \
            || true

      - name: Debug and Print Patch Failures
        if: always()
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          echo "=== Recherche des .rej ==="
          find . -name '*.rej' -print || true

          echo "=== fs/open.c ==="
          [ -f fs/open.c.rej ] && cat fs/open.c.rej || true

          echo "=== fs/namespace.c path_umount ==="
          grep -n -A25 -B10 \
            "int path_umount" \
            fs/namespace.c \
            || true

          echo "=== KernelSU Makefile PATH_UMOUNT ==="
          grep -n -A50 -B10 \
            "PATH_UMOUNT" \
            KernelSU/kernel/Makefile \
            || true

      - name: Collect SUSFS patch rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-modern-test-rejects
          path: |
            ${{ env.KERNEL_PATH }}/**/*.rej
          if-no-files-found: warn

      - name: Download Manager 3.2.5
        shell: bash
        run: |
          set -euo pipefail

          echo "📱 Téléchargement KernelSU Manager v3.2.5..."

          curl -fL \
            "https://github.com/tiann/KernelSU/releases/download/v3.2.5/KernelSU_v3.2.5_32525-release.apk" \
            -o KernelSU_v3.2.5_32525-release.apk

          test -s KernelSU_v3.2.5_32525-release.apk

          echo "✅ Manager 3.2.5 téléchargé"

      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -uo pipefail

          ccache -C

          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export USE_CCACHE=1
          export CCACHE_EXEC="$(which ccache)"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"

          echo "📂 Préparation du defconfig..."

          cp \
            "arch/arm64/configs/vendor/${{ env.DEFCONFIG }}" \
            "arch/arm64/configs/${{ env.DEFCONFIG }}"

          echo "📂 Génération de la configuration..."

          make \
            O="${{ env.BUILD_DIR }}" \
            LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "${{ env.DEFCONFIG }}"

          echo "🔧 Activation KSU/SUSFS/KPROBES..."

          ./scripts/config \
            --file "${{ env.BUILD_DIR }}/.config" \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KPROBES \
            -e CONFIG_KRETPROBES

          echo "⚡ olddefconfig..."

          make \
            O="${{ env.BUILD_DIR }}" \
            LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          echo "========================================"
          echo "=== CONFIGURATION FINALE ==="
          echo "========================================"

          grep -E \
            '^CONFIG_KSU(=|_)' \
            "${{ env.BUILD_DIR }}/.config" \
            || true

          grep -E \
            '^CONFIG_KSU_SUSFS(=|_)' \
            "${{ env.BUILD_DIR }}/.config" \
            || true

          grep -E \
            '^CONFIG_KPROBES(=|_)|^CONFIG_KRETPROBES(=|_)' \
            "${{ env.BUILD_DIR }}/.config" \
            || true

          grep -q '^CONFIG_KSU=y$' \
            "${{ env.BUILD_DIR }}/.config" \
            || {
              echo "❌ CONFIG_KSU absent"
              exit 1
            }

          grep -q '^CONFIG_KSU_SUSFS=y$' \
            "${{ env.BUILD_DIR }}/.config" \
            || {
              echo "❌ CONFIG_KSU_SUSFS absent"
              exit 1
            }

          grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y$' \
            "${{ env.BUILD_DIR }}/.config" \
            || {
              echo "❌ CONFIG_KSU_SUSFS_SUS_PATH absent"
              exit 1
            }

          grep -q '^CONFIG_KPROBES=y$' \
            "${{ env.BUILD_DIR }}/.config" \
            || {
              echo "❌ CONFIG_KPROBES absent"
              exit 1
            }

          echo "✅ KSU + SUSFS + SUS_PATH + KPROBES activés"

          echo "🔓 Force-pass des signatures..."

          sed -i \
            's/if (!check_version(/if (0 \&\& !check_version(/g' \
            kernel/module.c

          echo "💉 Injection patch tactile..."

          printf "\n/* --- Début Patch Tactile --- */\n#include <linux/notifier.h>\n#include <linux/module.h>\nstatic BLOCKING_NOTIFIER_HEAD(motorola_panel_notifier_list);\nint panel_register_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_register(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_register_notifier);\nint panel_unregister_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_unregister(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_unregister_notifier);\nvoid touch_set_state(int state) { return; }\nEXPORT_SYMBOL(touch_set_state);\n/* --- Fin Patch Tactile --- */\n" >> techpack/display/msm/msm_drv.c

          echo "🚀 Compilation finale du noyau..."

          make \
            O="${{ env.BUILD_DIR }}" \
            LLVM=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            KCFLAGS="$KCFLAGS" \
            -j"$(nproc)" \
            Image

      - name: Repack & Finalize
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p repack

          cp boot-stock.img repack/boot.img

          wget -q \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk \
            -O Magisk-v27.0.apk

          unzip -q \
            Magisk-v27.0.apk \
            lib/x86_64/libmagiskboot.so

          mv \
            lib/x86_64/libmagiskboot.so \
            repack/magiskboot

          chmod +x repack/magiskboot

          cd repack

          ./magiskboot unpack boot.img

          cp \
            "${GITHUB_WORKSPACE}/${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image" \
            kernel

          ./magiskboot repack boot.img new-boot.img

          mv new-boot.img ../final_boot.img

          cd ..

          mkdir -p final_output

          mv final_boot.img final_output/boot.img

      - name: Upload Finished Packaged Assets
        uses: actions/upload-artifact@v4
        with:
          name: kernel-motorola-modern-ksu325
          path: final_output/boot.img

      - name: Upload KernelSU Manager 3.2.5
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Manager-v3.2.5
          path: KernelSU_v3.2.5_32525-release.apk
