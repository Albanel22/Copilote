name: Kernel CI — build & package

on:
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  BOOT_URL: 'https://mirrorbits.lineageos.org/full/kiev/20260726/boot.img'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex \
            glibc-source libelf-dev libssl-dev libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang llvm lld device-tree-compiler zip unzip curl git python3

      - name: Download Stock Boot Image
        run: |
          set -euo pipefail
          echo "📥 Téléchargement du boot.img d'origine..."
          curl -fLo boot-stock.img "${{ env.BOOT_URL }}" || { echo "❌ Erreur download"; exit 1; }

      - name: Clone Motorola Kernel Source
        run: |
          set -euo pipefail
          echo "📥 Récupération des sources du noyau..."
          git clone https://github.com/LineageOS/android_kernel_motorola_sm8250.git \
            -b lineage-23.2 --depth=1 ${{ env.KERNEL_PATH }}

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-kernel-${{ github.run_number }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: 📂 Intégration ReSukiSU & SUSFS
        run: |
          set -euo pipefail
          cd ${{ env.KERNEL_PATH }}
          
          echo "🧼 Nettoyage des dossiers temporaires..."
          rm -rf drivers/kernelsu kernelSU susfs4ksu || true
          
          echo "📥 Exécution du script d'installation ReSukiSU..."
          if curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main; then
            echo "✅ ReSukiSU installé avec succès"
          else
            echo "⚠️  ReSukiSU setup warning, continuing..."
          fi
          
          echo "📥 Récupération des patchs SUSFS pour Linux 4.19..."
          if git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 --depth=1 2>/dev/null; then
              if [ -d "susfs4ksu/kernel_patches" ]; then
                  echo "💉 Application des patchs SUSFS..."
                  cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
                  cp -r susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
                  echo "✅ Patchs SUSFS appliqués"
              fi
              rm -rf susfs4ksu
          else
              echo "⚠️  SUSFS clone failed, continuing..."
          fi
          
          echo "✅ Intégration ReSukiSU & SUSFS terminée"

      - name: 🔧 AGGRESSIVE - Remove ALL infra references
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail
          echo "⚙️ Suppression AGRESSIVE de TOUS les fichiers et références infra..."
          
          # Step 1: Delete the entire infra folder
          echo "❌ Suppression du dossier infra..."
          rm -rf drivers/kernelsu/infra || true
          
          # Step 2: Remove ALL #include statements referencing infra
          echo "🧹 Suppression de TOUS les includes infra..."
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -print0 | \
            xargs -0 sed -i '/#include.*infra/d' 2>/dev/null || true
          
          # Step 3: Comment out function calls from infra
          echo "🔨 Commentage des appels infra..."
          find drivers/kernelsu -type f -name "*.c" -print0 | xargs -0 sed -i \
            -e 's/ksu_init_symbol_resolver();/\/\/ DISABLED: ksu_init_symbol_resolver();/g' \
            -e 's/ksu_file_wrapper_init();/\/\/ DISABLED: ksu_file_wrapper_init();/g' \
            -e 's/symbol_resolver_init();/\/\/ DISABLED: symbol_resolver_init();/g' 2>/dev/null || true
          
          # Step 4: Remove MODULE_IMPORT_NS
          echo "❌ Suppression de MODULE_IMPORT_NS..."
          find drivers/kernelsu -type f -name "*.c" -print0 | xargs -0 sed -i '/MODULE_IMPORT_NS/d' 2>/dev/null || true
          
          # Step 5: Remove infra references from Makefiles
          echo "🧹 Nettoyage des Makefiles..."
          find drivers/kernelsu -type f \( -name "Makefile" -o -name "Kbuild" \) -print0 | \
            xargs -0 sed -i '/infra/d' 2>/dev/null || true
          
          # Step 6: Neutralize hook check scripts
          echo "🔨 Neutralisation des scripts de vérification..."
          find . -type f -name "*hook_check*" -print0 | xargs -0 -I {} sh -c 'echo "" > "{}"' 2>/dev/null || true
          
          # Verify infra is completely gone
          echo "✅ Vérification : Nombre de références infra restantes..."
          INFRA_COUNT=$(find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null | xargs grep -l "infra" 2>/dev/null | wc -l)
          if [ "$INFRA_COUNT" -eq 0 ]; then
            echo "✅ Infra complètement supprimé!"
          else
            echo "⚠️ $INFRA_COUNT fichiers contiennent encore 'infra' - nettoyage supplémentaire..."
            find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null | \
              xargs grep -l "infra" 2>/dev/null | xargs sed -i 's/.*infra.*/\/\/ REMOVED: infra reference/g' 2>/dev/null || true
          fi

      - name: 💉 Injection des Hooks ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail
          echo "⚙️ Réinitialisation et injection des hooks..."
          git checkout drivers/input/input.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c \
            kernel/reboot.c kernel/sys.c security/selinux/selinuxfs.c security/selinux/hooks.c 2>/dev/null || true
          
          python3 << 'PYTHON_EOF'
          import os
          import sys
          
          def inject_code(path, target_str, code_to_insert, position="before"):
              if not os.path.exists(path):
                  print(f"❌ Fichier introuvable : {path}")
                  return False
              
              try:
                  with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
              except Exception as e:
                  print(f"❌ Erreur lecture {path}: {e}")
                  return False
              
              if code_to_insert in content:
                  print(f"⚠️  Déjà présent dans {path}")
                  return True
              
              if target_str not in content:
                  print(f"⚠️  Cible introuvable dans {path}")
                  return False
              
              try:
                  if position == "before":
                      content = content.replace(target_str, code_to_insert + "\n" + target_str, 1)
                  elif position == "after":
                      content = content.replace(target_str, target_str + "\n" + code_to_insert, 1)
                  elif position == "inside_brace":
                      idx = content.find(target_str)
                      brace_idx = content.find('{', idx)
                      if brace_idx != -1:
                          content = content[:brace_idx + 1] + "\n" + code_to_insert + "\n" + content[brace_idx + 1:]
                  
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f"✅ Injecté dans {path}")
                  return True
              except Exception as e:
                  print(f"❌ Erreur écriture {path}: {e}")
                  return False
          
          # fs/stat.c hooks
          stat_declarations = """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot)) 
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);
          #endif
          #endif"""
          
          inject_code("fs/stat.c", "SYSCALL_DEFINE2(newlstat", stat_declarations, "before")
          inject_code("fs/stat.c", 
                      "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n\t\tstruct stat __user *, statbuf, int, flag)",
                      "#ifdef CONFIG_KSU_MANUAL_HOOK\n\t\tksu_handle_stat(&dfd, &filename, &flag);\n#endif",
                      "inside_brace")
          
          # fs/exec.c hooks
          exec_declarations = """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          #endif"""
          
          inject_code("fs/exec.c", "int do_execve(struct filename *filename,", exec_declarations, "before")
          
          # SELinux modifications
          if os.path.exists("security/selinux/selinuxfs.c"):
              try:
                  with open("security/selinux/selinuxfs.c", "r", encoding="utf-8") as f:
                      sc = f.read()
                  sc = sc.replace("static ssize_t (*write_op[])", "ssize_t (*write_op[])")
                  sc = sc.replace("static const struct file_operations sel_handle_status_ops",
                                 "const struct file_operations sel_handle_status_ops")
                  with open("security/selinux/selinuxfs.c", "w", encoding="utf-8") as f:
                      f.write(sc)
                  print("✅ SELinux selinuxfs.c modifié")
              except Exception as e:
                  print(f"⚠️  Erreur modification selinuxfs.c: {e}")
          
          if os.path.exists("security/selinux/hooks.c"):
              try:
                  with open("security/selinux/hooks.c", "r", encoding="utf-8") as f:
                      hc = f.read()
                  hc = hc.replace("static struct security_operations selinux_ops",
                                 "struct security_operations selinux_ops")
                  
                  selinux_bypass = """
          #ifdef CONFIG_KSU
          __attribute__((hot))
          int ksu_selinux_enforce_bypass(void) {
              return 0;
          }
          #endif"""
                  
                  if selinux_bypass not in hc:
                      hc = hc + "\n" + selinux_bypass
                  
                  with open("security/selinux/hooks.c", "w", encoding="utf-8") as f:
                      f.write(hc)
                  print("✅ SELinux hooks.c modifié")
              except Exception as e:
                  print(f"⚠️  Erreur modification hooks.c: {e}")
          
          print("✨ Injection des hooks terminée!")
          PYTHON_EOF

      - name: Prepare defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail
          mkdir -p arch/arm64/configs/vendor
          if [ -f "../kiev_perfect_defconfig" ]; then
            cp ../kiev_perfect_defconfig arch/arm64/configs/vendor/${{ env.DEFCONFIG }}
            echo "✅ Custom defconfig loaded"
          else
            echo "⚠️  kiev_perfect_defconfig not found, using default lito-perf_defconfig"
          fi

      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail
          
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export KCFLAGS="-Wno-error"
          
          ccache -M ${{ env.CCACHE_SIZE }}
          ccache -z
          
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          mkdir -p ${{ env.BUILD_DIR }}
          cp arch/arm64/configs/vendor/${{ env.DEFCONFIG }} arch/arm64/configs/${{ env.DEFCONFIG }} || true
          
          echo "🔧 Étape 1 : Génération de la configuration..."
          make O=${{ env.BUILD_DIR }} \
            LLVM=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            ${{ env.DEFCONFIG }}
          
          echo "🔧 Étape 2 : Injection des flags KSU/SUSFS/Modules..."
          cat >> ${{ env.BUILD_DIR }}/.config << 'CONFIG_EOF'
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_SRCVERSION_ALL=y
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_CALLBACK=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_MOUNT_UNMOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_DISABLE=y
          CONFIG_EOF
          
          echo "✅ Flags KSU/SUSFS/Modules injectés"
          
          echo "🔧 Étape 3 : Validation de la configuration..."
          make O=${{ env.BUILD_DIR }} \
            LLVM=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            oldconfig
          
          echo "✅ Configuration validée"
          
          echo "🔧 Étape 4 : Compilation du noyau (cela peut prendre du temps)..."
          make O=${{ env.BUILD_DIR }} \
            LLVM=1 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="$KCFLAGS" \
            KSUD_VERSION=35005 \
            KSU_VERSION=35005 \
            -j$(nproc) \
            Image \
            --output-sync=none 2>&1 | tee build.log
          
          if [ -f "${{ env.BUILD_DIR }}/arch/arm64/boot/Image" ]; then
            echo "✅ Compilation du noyau réussie"
            ls -lh ${{ env.BUILD_DIR }}/arch/arm64/boot/Image
          else
            echo "❌ Erreur : Image du noyau non trouvée"
            echo "❌ Dernières erreurs de compilation :"
            tail -100 build.log | grep -A 5 "error:" || tail -100 build.log
            exit 1
          fi
          
          echo "📊 Stats ccache :"
          ccache -s

      - name: Repack & Finalize (AnyKernel3)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          
          echo "📥 Récupération d'AnyKernel3..."
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          rm -f AnyKernel3/anykernel.sh AnyKernel3/README.md
          
          echo "📥 Téléchargement de ksud..."
          mkdir -p AnyKernel3/patch/system/bin
          if curl -fLo AnyKernel3/patch/system/bin/ksud \
            "https://raw.githubusercontent.com/Albanel22/Copilote/test-sukisu/ksud" 2>/dev/null; then
            chmod +x AnyKernel3/patch/system/bin/ksud
            echo "✅ ksud téléchargé et configuré"
          else
            echo "⚠️  ksud download failed, continuing sans ksud"
            mkdir -p AnyKernel3/patch/system/bin
          fi
          
          echo "✍️ Création du script anykernel.sh..."
          cat > AnyKernel3/anykernel.sh << 'ANYKERNEL_EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          
          ### AnyKernel setup
          properties() { '
          kernel.string=Custom Kernel ReSukiSU pour Motorola One 5G Ace
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=kiev
          device.name2=XT2113-2
          device.name3=kiev_retde
          device.name4=kiev_t
          supported.versions=
          supported.patchlevels=
          '; }
          
          ### AnyKernel install
          boot_attributes() {
            set_perm_recursive 0 0 755 644 $RAMDISK/*
            set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin
          }
          
          BLOCK=/dev/block/by-name/boot
          IS_SLOT_DEVICE=1
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          
          . tools/ak3-core.sh
          split_boot
          
          if [ -f patch/system/bin/ksud ]; then
            ui_print "⚙️ Configuration OverlayFS via ksud..."
            chmod 755 patch/system/bin/ksud
            mkdir -p /data/adb/ksu/bin
            cp patch/system/bin/ksud /data/adb/ksu/bin/ksud
            chmod 755 /data/adb/ksu/bin/ksud
            ui_print "✅ ksud installé"
          fi
          
          flash_boot
          ANYKERNEL_EOF
          
          sed -i 's/\r$//' AnyKernel3/anykernel.sh
          echo "✅ anykernel.sh créé"
          
          echo "📦 Injection de l'image du noyau..."
          if [ -f "${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image" ]; then
            cp ${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image AnyKernel3/Image
            echo "✅ Image injectée"
          else
            echo "❌ Erreur : Image du noyau non trouvée"
            exit 1
          fi
          
          if [ -f "${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/dtb" ]; then
            cp ${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/dtb AnyKernel3/dtb
            echo "✅ DTB injecté"
          else
            echo "⚠️  DTB not found, continuing without it"
          fi
          
          echo "🗜️ Création du flashable ZIP..."
          mkdir -p final_output
          cd AnyKernel3
          zip -r9 ../final_output/AnyKernel3_ReSukiSU_kiev.zip * \
            -x ".git*" "README.md" ".gitignore" 2>&1 | tail -20
          
          if [ -f ../final_output/AnyKernel3_ReSukiSU_kiev.zip ]; then
            echo "✅ Packaging terminé avec succès"
            ls -lh ../final_output/
          else
            echo "❌ Erreur : ZIP non créé"
            exit 1
          fi

      - name: Upload Finished Packaged Assets
        uses: actions/upload-artifact@v4
        with:
          name: kernel-motorola_anykernel3
          path: final_output/AnyKernel3_ReSukiSU_kiev.zip
          retention-days: 30
          if-no-files-found: error

      - name: 📊 Build Summary
        if: always()
        run: |
          set +e
          echo "======================================"
          echo "📊 BUILD SUMMARY"
          echo "======================================"
          echo "🔧 Kernel: Linux 4.19.325"
          echo "📱 Device: Motorola One 5G Ace (Kiev)"
          echo "⚡ Mods: ReSukiSU + SUSFS"
          echo "📦 Modules: Enabled"
          echo "🔒 Security: SELinux enabled"
          echo "📦 Build Status: ${{ job.status }}"
          echo "======================================"
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Build completed successfully!"
            echo "📥 Artifact: AnyKernel3_ReSukiSU_kiev.zip"
          else
            echo "⚠️  Build completed with warnings/errors"
          fi
          echo "======================================"
