name: Kernel CI — build & package

on:
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  BOOT_URL: 'https://mirrorbits.lineageos.org/full/kiev/20260726/boot.img'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex glibc-source libelf-dev libssl-dev libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang llvm lld device-tree-compiler zip unzip curl git python3

      - name: Download Stock Boot Image
        shell: bash
        run: |
          set -euo pipefail
          echo "📥 Téléchargement du boot.img d'origine..."
          curl -fLo boot-stock.img "${{ env.BOOT_URL }}" || { echo "❌ Erreur download"; exit 1; }

      - name: Clone Motorola Kernel Source
        run: |
          echo "📥 Récupération des sources du noyau..."
          git clone https://github.com/LineageOS/android_kernel_motorola_sm8250.git -b lineage-23.2 --depth=1 ${{ env.KERNEL_PATH }}

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-kernel
          restore-keys: ${{ runner.os }}-ccache-

      - name: 📂 Intégration ReSukiSU & Correction 4.19 (init.c)
        run: |
          set -e
          
          # Copie de ton defconfig personnel dans les sources clonées
          cp kiev_perfect_defconfig ${{ env.KERNEL_PATH }}/arch/arm64/configs/vendor/${{ env.DEFCONFIG }}
          cd ${{ env.KERNEL_PATH }}
          
          echo "🧼 Nettoyage des dossiers temporaires ou obsolètes..."
          rm -rf drivers/kernelsu kernelSU susfs4ksu || true
          
          echo "📥 Exécution du script d'installation ReSukiSU en mode manuel..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s manual
          
          echo "🩹 Suppression chirurgicale de MODULE_IMPORT_NS dans drivers/kernelsu/core/init.c..."
          python3 -c '
          init_path = "drivers/kernelsu/core/init.c"
          if __import__("os").path.exists(init_path):
              with open(init_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              with open(init_path, "w", encoding="utf-8") as f:
                  for line in lines:
                      if "MODULE_IMPORT_NS" in line:
                          f.write("// " + line)
                      else:
                          f.write(line)
              print("✅ MODULE_IMPORT_NS neutralisé avec succès dans init.c")
          else:
              print("⚠️ init.c introuvable !")
          '
          
          echo "🔨 Neutralisation radicale de TOUS les scripts de vérification des hooks..."
          find . -type f -name "*hook_check.mk" -exec sh -c 'echo "" > "$1"' _ {} \;

                - name: 🔧 Fix fsnotify API compatibility (4.19)
          working-directory: ${{ env.KERNEL_PATH }}
          run: |
          set -euo pipefail
          echo "⚙️ Correction de la compatibilité fsnotify pour Linux 4.19..."
          
          if [ -f drivers/kernelsu/manager/pkg_observer.c ]; then
            echo "🔨 Patching pkg_observer.c..."
            python3 << 'PYTHON_FIX'
          import re
          
          with open("drivers/kernelsu/manager/pkg_observer.c", "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()
          
          # Fix 1: Replace handle_inode_event with handle_event
          content = re.sub(
              r'\.handle_inode_event\s*=\s*ksu_handle_inode_event',
              '.handle_event = ksu_handle_event',
              content
          )
          
          # Fix 2: Update function signature to match fsnotify_ops (4.19)
          old_sig = r'static int ksu_handle_inode_event\s*\([^)]*\)'
          new_sig = '''static int ksu_handle_event(struct fsnotify_group *group,
                                      struct inode *inode,
                                      u32 mask,
                                      const void *data,
                                      int data_type,
                                      const unsigned char *file_name,
                                      u32 name_len,
                                      struct fsnotify_iter_info *iter_info)'''
          
          content = re.sub(old_sig, new_sig, content, flags=re.DOTALL)
          
          # Fix 3: Update include if needed
          content = re.sub(
              r'#include\s+[<"]linux/fsnotify\.h[>"]',
              '#include <linux/fsnotify_backend.h>',
              content
          )
          
          with open("drivers/kernelsu/manager/pkg_observer.c", "w", encoding="utf-8") as f:
              f.write(content)
          
          print("✅ pkg_observer.c patched for 4.19 compatibility")
          PYTHON_FIX
          fi
          
          # Additional fsnotify fixes for all manager files
          if [ -d drivers/kernelsu/manager ]; then
            find drivers/kernelsu/manager -name "*.c" -type f -exec sed -i \
              's/handle_inode_event/handle_event/g' {} +
          fi
          
          echo "✅ fsnotify API compatibility fixes applied"

      - name: 💉 Injection chirurgicale des Hooks ReSukiSU via Python
        run: |
          cd ${{ env.KERNEL_PATH }}
          echo "⚙️ Réinitialisation et injection propre des hooks (Version 4.19 Corrigée)..."
          git checkout drivers/input/input.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c fs/devpts/inode.c kernel/reboot.c kernel/sys.c security/selinux/selinuxfs.c security/selinux/hooks.c drivers/kernelsu/infra/file_wrapper.c || true
          python3 - << 'PYTHON_EOF'
          import os

          def inject_code(path, target_str, code_to_insert, position="before", optional=False):
              if not os.path.exists(path):
                  print(f"❌ Fichier introuvable : {path}")
                  return False
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              
              if code_to_insert in content:
                  print(f"⚠️ Déjà présent dans {path}")
                  return True
              
              if target_str in content:
                  if position == "before":
                      content = content.replace(target_str, code_to_insert + "\n" + target_str, 1)
                  elif position == "after":
                      content = content.replace(target_str, target_str + "\n" + code_to_insert, 1)
                  elif position == "inside_brace":
                      idx = content.find(target_str)
                      brace_idx = content.find('{', idx)
                      if brace_idx != -1:
                          content = content[:brace_idx + 1] + "\n" + code_to_insert + "\n" + content[brace_idx + 1:]
                  
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f"✅ Injecté avec succès dans {path}")
                  return True
              else:
                  if not optional:
                      print(f"❌ Cible introuvable dans {path}")
                  return False

          # 1. drivers/input/input.c (Safe Mode)
          input_patch_declarations = """
          #ifdef CONFIG_KSU
          extern bool ksu_input_hook __read_mostly;
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          #endif
          """
          inject_code("drivers/input/input.c", "static void input_handle_event(", input_patch_declarations, "before", optional=False)
          inject_code("drivers/input/input.c", "static void input_handle_event(", 
                      "#ifdef CONFIG_KSU\n\tksu_handle_input_handle_event(&type, &code, &value);\n#endif", 
                      "inside_brace", optional=False)

          # 2. fs/devpts/inode.c
          devpts_patch_declarations = """
          #ifdef CONFIG_KSU
          extern int ksu_handle_devpts(struct inode *inode);
          #endif
          """
          inject_code("fs/devpts/inode.c", "void *devpts_get_priv(", devpts_patch_declarations, "before")
          inject_code("fs/devpts/inode.c", "void *devpts_get_priv(struct dentry *dentry)", 
                      "#ifdef CONFIG_KSU\n\tksu_handle_devpts(dentry->d_inode);\n#endif", "inside_brace")

          # 3. fs/exec.c (do_execveat_common)
          exec_patch_declarations = """
          #ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          #endif
          """
          inject_code("fs/exec.c", "static int do_execveat_common(", exec_patch_declarations, "before", optional=True)
          exec_patch_body = """
          #ifdef CONFIG_KSU
              if (unlikely(ksu_execveat_hook))
                  ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
              else
                  ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          #endif
          """
          inject_code("fs/exec.c", "static int do_execveat_common(", exec_patch_body, "inside_brace", optional=True)

          # 4. fs/open.c (do_faccessat)
          open_patch_declarations = """
          #ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
          #endif
          """
          inject_code("fs/open.c", "long do_faccessat(", open_patch_declarations, "before", optional=True)
          open_patch_body = """
          #ifdef CONFIG_KSU
              ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          """
          inject_code("fs/open.c", "long do_faccessat", open_patch_body, "inside_brace", optional=True)

          # 5. fs/read_write.c (vfs_read)
          read_patch_declarations = """
          #ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);
          #endif
          """
          inject_code("fs/read_write.c", "ssize_t vfs_read(", read_patch_declarations, "before", optional=True)
          read_patch_body = """
          #ifdef CONFIG_KSU
              if (unlikely(ksu_vfs_read_hook))
                  ksu_handle_vfs_read(&file, &buf, &count, &pos);
          #endif
          """
          inject_code("fs/read_write.c", "ssize_t vfs_read", read_patch_body, "inside_brace", optional=True)

          # 6. Correction robuste de file_wrapper.c pour le noyau 4.19 (Désactivation iopoll / remap_file_range)
          fw_path = "drivers/kernelsu/infra/file_wrapper.c"
          if os.path.exists(fw_path):
              with open(fw_path, 'r', encoding='utf-8', errors='ignore') as f:
                  fw_content = f.read()
              
              fw_content = fw_content.replace(
                  "return orig->f_op->iopoll(kiocb, spin);", 
                  "return -EOPNOTSUPP;"
              )
              fw_content = fw_content.replace(
                  "if (remap_flags & REMAP_FILE_DEDUP)", 
                  "if (0)"
              )
              fw_content = fw_content.replace(
                  "return orig->f_op->remap_file_range(file_in, pos_in, orig, pos_out, len, remap_flags);", 
                  "return -EOPNOTSUPP;"
              )
              fw_content = fw_content.replace(
                  "return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);", 
                  "return -EOPNOTSUPP;"
              )
              fw_content = fw_content.replace(
                  "p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;", 
                  "/* p->ops.iopoll not available */"
              )
              fw_content = fw_content.replace(
                  "p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;", 
                  "/* p->ops.remap_file_range not available */"
              )

              with open(fw_path, 'w', encoding='utf-8') as f:
                  f.write(fw_content)
              print("✅ file_wrapper.c totalement nettoyé des symboles absents en 4.19")

          # 7. SELinux updates
          if os.path.exists("security/selinux/selinuxfs.c"):
              with open("security/selinux/selinuxfs.c", "r", encoding="utf-8") as f:
                  sc = f.read()
              sc = sc.replace("static ssize_t (*write_op[])", "ssize_t (*write_op[])")
              sc = sc.replace("static const struct file_operations sel_handle_status_ops", "const struct file_operations sel_handle_status_ops")
              with open("security/selinux/selinuxfs.c", "w", encoding="utf-8") as f:
                  f.write(sc)

          if os.path.exists("security/selinux/hooks.c"):
              with open("security/selinux/hooks.c", "r", encoding="utf-8") as f:
                  hc = f.read()
              hc = hc.replace("static struct security_operations selinux_ops", "struct security_operations selinux_ops")
              selinux_bypass_func = """
              #ifdef CONFIG_KSU
              __attribute__((hot))
              int ksu_selinux_enforce_bypass(void) {
                  return 0;
              }
              #endif
              """
              if "ksu_selinux_enforce_bypass" not in hc:
                  hc = hc + "\n" + selinux_bypass_func
              with open("security/selinux/hooks.c", "w", encoding="utf-8") as f:
                  f.write(hc)

          # 8. Ajout des définitions de secours pour le cache seccomp sur noyau 4.19
          seccomp_path = "drivers/kernelsu/infra/seccomp_cache.c"
          if os.path.exists(seccomp_path):
              with open(seccomp_path, 'r', encoding='utf-8', errors='ignore') as f:
                  sc_content = f.read()
              
              fallback_macros = """
              #ifndef SECCOMP_ARCH_NATIVE_NR
              #define SECCOMP_ARCH_NATIVE_NR __NR_syscalls
              #endif
              """
              if "#ifndef SECCOMP_ARCH_NATIVE_NR" not in sc_content:
                  sc_content = fallback_macros + "\n" + sc_content
              
              with open(seccomp_path, 'w', encoding='utf-8') as f:
                  f.write(sc_content)
              print("✅ seccomp_cache.c patché avec les macros de secours 4.19")

              # 9. Correction de su_mount_ns.c pour le noyau 4.19 (uapi/linux/mount.h manquant)
          mount_ns_path = "drivers/kernelsu/infra/su_mount_ns.c"
          if os.path.exists(mount_ns_path):
              with open(mount_ns_path, 'r', encoding='utf-8', errors='ignore') as f:
                  mn_content = f.read()
              
              # Remplacement de l'inclusion problématique par un header standard ou suppression
              mn_content = mn_content.replace(
                  "#include <uapi/linux/mount.h>",
                  "#include <linux/mount.h>"
              )
              
              with open(mount_ns_path, 'w', encoding='utf-8') as f:
                  f.write(mn_content)
              print("✅ su_mount_ns.c corrigé pour l'inclusion des en-têtes de montage")
          
      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -uo pipefail
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M ${{ env.CCACHE_SIZE }}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"
          
          mkdir -p ${{ env.BUILD_DIR }}
          cp arch/arm64/configs/vendor/${{ env.DEFCONFIG }} arch/arm64/configs/${{ env.DEFCONFIG }}
          
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 ${{ env.DEFCONFIG }}
          
          {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_MANUAL_HOOK=y"
              echo "CONFIG_KPROBES=y"
              echo "CONFIG_HAVE_KPROBES=y"
              echo "CONFIG_KRETPROBES=y"
              echo "CONFIG_OVERLAY_FS=y"
              echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y"
              echo "CONFIG_KALLSYMS=y"
              echo "CONFIG_KALLSYMS_ALL=y"
              echo "CONFIG_SECURITY_SELINUX=y"
              echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y"
              echo "CONFIG_SECURITY_SELINUX_DISABLE=y"
          } >> ${{ env.BUILD_DIR }}/.config
          
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 olddefconfig
          
          sed -i 's/if (!check_version(/if (0 \&\& !check_version(/g' kernel/module.c
          printf "\n/* --- Patch Tactile --- */\n#include <linux/notifier.h>\n#include <linux/module.h>\nstatic BLOCKING_NOTIFIER_HEAD(motorola_panel_notifier_list);\nint panel_register_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_register(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_register_notifier);\nint panel_unregister_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_unregister(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_unregister_notifier);\nvoid touch_set_state(int state) { return; }\nEXPORT_SYMBOL(touch_set_state);\n" >> techpack/display/msm/msm_drv.c
          
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 KCFLAGS="$KCFLAGS" KSUD_VERSION=35005 KSU_VERSION=35005 -j$(nproc) Image --output-sync=none

      - name: Repack & Finalize (AnyKernel3 + Custom ksud & OverlayFS)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          
          echo "📥 Récupération d'AnyKernel3..."
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          rm -f AnyKernel3/anykernel.sh
          
          echo "📥 Téléchargement de ton binaire ksud personnalisé..."
          mkdir -p AnyKernel3/patch/system/bin
          curl -fLo AnyKernel3/patch/system/bin/ksud https://raw.githubusercontent.com/Albanel22/Copilote/main/ksud
          chmod +x AnyKernel3/patch/system/bin/ksud

          echo "✍️ Création du script anykernel.sh avec intégration native d'OverlayFS..."
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Custom Kernel avec Risukisu pour Motorola One 5G Ace
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=kiev
          device.name2=XT2113-2
          device.name3=kiev_retde
          device.name4=kiev_t
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;

          if [ -f patch/system/bin/ksud ]; then
            ui_print "⚙️ Configuration de l'environnement OverlayFS via ksud..."
            chmod 755 patch/system/bin/ksud
            ./patch/system/bin/ksud kernel setup-script
          fi

          flash_boot;

          if [ -f patch/system/bin/ksud ]; then
            mkdir -p /data/adb/ksu/bin
            cp -f patch/system/bin/ksud /data/adb/ksu/bin/ksud
            chmod 755 /data/adb/ksu/bin/ksud
          fi
          EOF
          
          sed -i 's/\r$//' AnyKernel3/anykernel.sh
          
          echo "📦 Injection de l'image du noyau brut (Image)..."
          cp ${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image AnyKernel3/Image
          
          if [ -f ${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/dtb ]; then
            cp ${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/dtb AnyKernel3/dtb
          fi

          echo "🗜️ Création de l'archive flashable finale..."
          mkdir -p final_output
          cd AnyKernel3
          zip -r9 ../final_output/AnyKernel3_Risukisu_kiev.zip * -x .git* README.md
          
      - name: Upload Finished Packaged Assets
        uses: actions/upload-artifact@v4
        with:
          name: kernel-motorola_anykernel3
          path: final_output/AnyKernel3_Risukisu_kiev.zip
