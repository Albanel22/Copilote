 name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

jobs:

  build:
    name: ReSukiSU + SuSFS 4.19
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lld \
            llvm \
            patch \
            perl \
            python3 \
            rsync \
            curl \
            wget \
            unzip \
            zip \
            lz4 \
            device-tree-compiler

      # ==========================================================
      # CCACHE
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-sm8250-4.19-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-sm8250-4.19-

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ~/.cache/ccache

          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats

      # ==========================================================
      # LINEAGEOS KERNEL
      # ==========================================================

      - name: Clone LineageOS kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${KERNEL_PATH}"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "=========================================="
          echo "Kernel"
          echo "=========================================="

          git branch --show-current
          git rev-parse HEAD

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

      - name: Verify Linux 4.19
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(awk -F'= ' '/^VERSION = / {print $2; exit}' Makefile)"
          PATCHLEVEL="$(awk -F'= ' '/^PATCHLEVEL = / {print $2; exit}' Makefile)"

          if [ "${VERSION}.${PATCHLEVEL}" != "4.19" ]; then
            echo "::error::Expected Linux 4.19, detected ${VERSION}.${PATCHLEVEL}"
            exit 1
          fi

      - name: Verify lito-perf_defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "arch/arm64/configs/${DEFCONFIG}"

      # ==========================================================
      # JACKA1LTMAN
      # ==========================================================

      - name: Clone JackA1ltman repository
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf NonGKI_Kernel_Build_2nd

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            NonGKI_Kernel_Build_2nd

          test -f \
            NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh

          test -f \
            NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch

      # ==========================================================
      # RESUKISU
      # ==========================================================

      - name: Embed current ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL \
            "${RESUKISU_SETUP}" \
            -o setup.sh

          chmod +x setup.sh

          bash ./setup.sh

          rm -f setup.sh

          test -d KernelSU
          test -L drivers/kernelsu

          echo
          echo "ReSukiSU commit:"
          git -C KernelSU rev-parse HEAD

      # ==========================================================
      # DETECT MANUAL HOOK SUPPORT
      # ==========================================================

      - name: Inspect ReSukiSU hook configuration
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "ReSukiSU Kconfig symbols"
          echo "=========================================="

          grep -R \
            -n \
            -E \
            'config KSU(_|$)|MANUAL_HOOK|TRACEPOINT_HOOK' \
            KernelSU/kernel \
            --include='Kconfig*' \
            || true

          echo
          echo "=========================================="
          echo "Manual hook build checks"
          echo "=========================================="

          find KernelSU/kernel \
            -type f \
            -name '*manual*hook*' \
            -print \
            || true

      # ==========================================================
      # MANUAL HOOK CONFIG
      # ==========================================================

      - name: Enable ReSukiSU Manual Hook
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG="arch/arm64/configs/${DEFCONFIG}"

          echo "CONFIG_KSU=y" >> "${DEFCONFIG}"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "${DEFCONFIG}"

          echo "CONFIG_KALLSYMS=y" >> "${DEFCONFIG}"
          echo "CONFIG_KALLSYMS_ALL=y" >> "${DEFCONFIG}"

          echo
          echo "Added:"
          tail -n 10 "${DEFCONFIG}"

      # ==========================================================
      # JACKA1LTMAN INLINE HOOKS
      # ==========================================================

      - name: Apply ReSukiSU SuSFS inline hooks
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh \
            ./susfs_inline_hook_patches.sh

          chmod +x ./susfs_inline_hook_patches.sh

          echo "=========================================="
          echo "Applying inline hooks"
          echo "=========================================="

          bash ./susfs_inline_hook_patches.sh

          rm -f ./susfs_inline_hook_patches.sh

      # ==========================================================
      # VERIFY MANUAL HOOK SOURCES
      # ==========================================================

      - name: Verify hook integration
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "Searching for ReSukiSU hook markers"
          echo "=========================================="

          grep -R \
            -n \
            -E \
            'KSU|ksu_' \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            kernel/sys.c \
            2>/dev/null \
            | head -n 100 \
            || true

      # ==========================================================
      # SUSFS PATCH
      # ==========================================================

      - name: Apply SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set +e

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch \
            ./susfs_patch_to_4.19.patch

          patch \
            -p1 \
            < ./susfs_patch_to_4.19.patch

          STATUS=$?

          echo
          echo "Patch exit code: ${STATUS}"

          # The two known 4.19 hunks are adapted below.
          exit 0

      # ==========================================================
      # ADAPT KNOWN 4.19 HUNKS
      # ==========================================================

      - name: Adapt SuSFS 4.19 rejected hunks
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          # ------------------------------------------------------
          # fs/namespace.c
          # ------------------------------------------------------

          path = Path("fs/namespace.c")
          text = path.read_text()

          if "linux/susfs_def.h" not in text:

              anchor = "#include <linux/sched/task.h>\n"

              if anchor not in text:
                  raise SystemExit(
                      "fs/namespace.c: include anchor not found"
                  )

              text = text.replace(
                  anchor,
                  anchor +
                  """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          #include <linux/susfs_def.h>
          #endif
          """,
                  1
              )

          # ------------------------------------------------------
          # vfs_kern_mount() / vfs_create_mount()
          # ------------------------------------------------------

          if "susfs_alloc_non_unshare_ksu_vfsmnt" not in text:

              # This tree uses fs_context/vfs_create_mount().
              anchor = 'mnt = alloc_vfsmnt(fc->source ?: "none");'

              if anchor in text:

                  replacement = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          if (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {
              if (susfs_is_current_ksu_domain()) {
                  mnt = susfs_alloc_non_unshare_ksu_vfsmnt(
                      fc->source ?: "none");
                  goto bypass_orig_flow;
              }
          }
          #endif

              mnt = alloc_vfsmnt(fc->source ?: "none");

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          bypass_orig_flow:
          #endif
          """

                  text = text.replace(
                      anchor,
                      replacement,
                      1
                  )

              else:
                  raise SystemExit(
                      "fs/namespace.c: vfs_create_mount anchor not found"
                  )

          path.write_text(text)

          # ------------------------------------------------------
          # fs/proc/task_mmu.c
          # ------------------------------------------------------

          path = Path("fs/proc/task_mmu.c")
          text = path.read_text()

          marker = "SUSFS_IS_INODE_SUS_MAP"

          if marker not in text:

              anchor = """        ret = mmap_read_lock_killable(mm);
          if (ret)
              goto out_free;
          """

              if anchor not in text:
                  raise SystemExit(
                      "task_mmu.c: mmap lock anchor not found"
                  )

              hook = """#ifdef CONFIG_KSU_SUSFS_SUS_MAP
          {
              struct vm_area_struct *vma;

              vma = find_vma(mm, start_vaddr);

              if (vma &&
                  vma->vm_file &&
                  SUSFS_IS_INODE_SUS_MAP(
                      file_inode(vma->vm_file)))
                  goto bypass_orig_flow;
          }
          #endif
          """

              text = text.replace(
                  anchor,
                  anchor + hook,
                  1
              )

              anchor = """        ret = walk_page_range(
              start_vaddr, end, &pagemap_walk);
          mmap_read_unlock(mm);
          """

              if anchor not in text:
                  raise SystemExit(
                      "task_mmu.c: walk_page_range anchor not found"
                  )

              replacement = """        ret = walk_page_range(
              start_vaddr, end, &pagemap_walk);

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          bypass_orig_flow:
          #endif

          mmap_read_unlock(mm);
          """

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          path.write_text(text)

          PY

          find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            -delete

      # ==========================================================
      # REJECT CHECK
      # ==========================================================

      - name: Verify SuSFS patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          REJECTS="$(
            find . \
              -type f \
              -name '*.rej' \
              | wc -l
          )"

          echo "Rejected hunks: ${REJECTS}"

          if [ "${REJECTS}" -ne 0 ]; then
            echo "::error::SuSFS still contains rejected hunks."

            find . \
              -type f \
              -name '*.rej' \
              -print

            exit 1
          fi

          echo "SuSFS patch: PASS"

      # ==========================================================
      # DEFCONFIG
      # ==========================================================

      - name: Generate kernel configuration
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "../${BUILD_DIR}"

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            "${DEFCONFIG}"

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            olddefconfig

      # ==========================================================
      # VERIFY KSU CONFIG
      # ==========================================================

      - name: Verify ReSukiSU configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${BUILD_DIR}/.config"

          test -f "${CONFIG}"

          echo "=========================================="
          echo "KSU configuration"
          echo "=========================================="

          grep -E \
            '^CONFIG_(KSU|KALLSYMS)' \
            "${CONFIG}" \
            || true

          REQUIRED=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
          )

          for CONFIG_NAME in "${REQUIRED[@]}"; do

            if ! grep -q "^${CONFIG_NAME}=y$" "${CONFIG}"; then
              echo "::error::${CONFIG_NAME} is not enabled"
              exit 1
            fi

            echo "PASS: ${CONFIG_NAME}=y"

          done

      # ==========================================================
      # VERIFY MANUAL HOOK CHECK
      # ==========================================================

      - name: Run ReSukiSU manual hook check
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "ReSukiSU manual hook validation"
          echo "=========================================="

          if [ -f KernelSU/kernel/tools/manual_hook_check.mk ]; then

            echo "manual_hook_check.mk found."

            grep -n \
              -E \
              'integrat|hook|KSU' \
              KernelSU/kernel/tools/manual_hook_check.mk \
              || true

          fi

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        env:
          CC: clang
          HOSTCC: clang
          CROSS_COMPILE: aarch64-linux-gnu-
          CLANG_TRIPLE: aarch64-linux-gnu-
        run: |
          set -euxo pipefail

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            -j"$(nproc)"

      # ==========================================================
      # COLLECT
      # ==========================================================

      - name: Collect kernel
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts/kernel

          find "${BUILD_DIR}/arch/arm64/boot" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          for f in \
            "${BUILD_DIR}/arch/arm64/boot/Image" \
            "${BUILD_DIR}/arch/arm64/boot/Image.gz" \
            "${BUILD_DIR}/arch/arm64/boot/Image.gz-dtb" \
            "${BUILD_DIR}/arch/arm64/boot/dt.img" \
            "${BUILD_DIR}/arch/arm64/boot/dtb.img"; do

            if [ -f "$f" ]; then
              cp "$f" artifacts/kernel/
            fi

          done

          cp \
            "${BUILD_DIR}/.config" \
            artifacts/kernel/kernel.config

          {
            echo "Kernel repository: ${KERNEL_REPO}"
            echo "Kernel branch: ${KERNEL_BRANCH}"
            echo "Kernel commit:"
            git -C "${KERNEL_PATH}" rev-parse HEAD

            echo
            echo "ReSukiSU commit:"
            git -C "${KERNEL_PATH}/KernelSU" rev-parse HEAD
          } > artifacts/kernel/BUILD_INFO.txt

      # ==========================================================
      # STOCK BOOT
      # ==========================================================

      - name: Download stock Kiev boot
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts/boot

          curl -fL \
            "${BOOT_URL}" \
            -o artifacts/boot/boot-stock-kiev-20260809.img

          file \
            artifacts/boot/boot-stock-kiev-20260809.img

      # ==========================================================
      # FAILURE DIAGNOSTICS
      # ==========================================================

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p artifacts/diagnostic

          if [ -d "${KERNEL_PATH}" ]; then

            find "${KERNEL_PATH}" \
              -type f \
              \( -name '*.rej' -o -name '*.orig' \) \
              -print \
              > artifacts/diagnostic/rejects.txt

            git -C "${KERNEL_PATH}" diff \
              > artifacts/diagnostic/kernel.diff

            grep -R \
              -n \
              -E \
              'KSU|MANUAL_HOOK|manual_hook' \
              "${KERNEL_PATH}/KernelSU/kernel" \
              > artifacts/diagnostic/ksu-hooks.txt \
              2>/dev/null

          fi

      - name: Upload successful build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-resukisu-susfs-4.19-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-resukisu-susfs-diagnostics-${{ github.run_number }}
          path: artifacts/diagnostic/
          if-no-files-found: warn
          retention-days: 14 
