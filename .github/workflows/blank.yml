name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2

  KERNEL_PATH: kernel_src
  BUILD_DIR: out

  ARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

  RESUKISU_SETUP:
    https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

jobs:

  build:
    name: Build ReSukiSU + SuSFS 4.19
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lld \
            llvm \
            patch \
            perl \
            python3 \
            rsync \
            curl \
            wget \
            unzip \
            zip \
            lz4 \
            device-tree-compiler


      # ==========================================================
      # CCACHE
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kiev-sm8250-4.19-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-kiev-sm8250-4.19-
            ${{ runner.os }}-kiev-sm8250-

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ~/.cache/ccache

          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats


      # ==========================================================
      # CLONE KERNEL
      # ==========================================================

      - name: Clone LineageOS kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${KERNEL_PATH}"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "=========================================="
          echo "Kernel"
          echo "=========================================="

          git branch --show-current
          git rev-parse HEAD

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile


      # ==========================================================
      # VERIFY KERNEL VERSION
      # ==========================================================

      - name: Verify Linux 4.19
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(
            awk -F'= ' '/^VERSION = / {
              print $2
              exit
            }' Makefile
          )"

          PATCHLEVEL="$(
            awk -F'= ' '/^PATCHLEVEL = / {
              print $2
              exit
            }' Makefile
          )"

          echo "Detected kernel version: ${VERSION}.${PATCHLEVEL}"

          if [ "${VERSION}.${PATCHLEVEL}" != "4.19" ]; then
            echo "::error::Expected Linux 4.19"
            exit 1
          fi


      # ==========================================================
      # VERIFY DEFCONFIG
      # ==========================================================

      - name: Verify lito-perf defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          if [ ! -f "${DEFCONFIG_FILE}" ]; then
            echo "::error::Missing ${DEFCONFIG_FILE}"
            exit 1
          fi

          echo "Using:"
          echo "${DEFCONFIG_FILE}"


      # ==========================================================
      # CLONE JACKA1LTMAN
      # ==========================================================

      - name: Clone JackA1ltman NonGKI tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf NonGKI_Kernel_Build_2nd

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            NonGKI_Kernel_Build_2nd

          test -f \
            NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh

          test -f \
            NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch


      # ==========================================================
      # EMBED RESUKISU
      # ==========================================================

      - name: Embed current ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL \
            "${RESUKISU_SETUP}" \
            -o setup.sh

          chmod +x setup.sh

          bash ./setup.sh

          rm -f setup.sh

          if [ ! -d KernelSU ]; then
            echo "::error::KernelSU directory was not created"
            exit 1
          fi

          if [ ! -e drivers/kernelsu ]; then
            echo "::error::drivers/kernelsu integration is missing"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "ReSukiSU commit"
          echo "=========================================="

          git -C KernelSU rev-parse HEAD


      # ==========================================================
      # ENABLE RESUKISU + KALLSYMS
      # ==========================================================

      - name: Configure ReSukiSU in defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          sed -i '/^CONFIG_KSU=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_MANUAL_HOOK=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KALLSYMS=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KALLSYMS_ALL=/d' "${DEFCONFIG_FILE}"

          cat >> "${DEFCONFIG_FILE}" <<'EOF'

          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF


      # ==========================================================
      # JACKA1LTMAN MANUAL HOOK PATCHES
      # ==========================================================

      - name: Apply SuSFS inline KernelSU hooks
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh \
            ./susfs_inline_hook_patches.sh

          chmod +x ./susfs_inline_hook_patches.sh

          echo "=========================================="
          echo "JackA1ltman SuSFS inline hooks"
          echo "=========================================="

          bash ./susfs_inline_hook_patches.sh

          rm -f ./susfs_inline_hook_patches.sh


      # ==========================================================
      # REPAIR REQUIRED RESUKISU newfstat HOOK
      # ==========================================================

      - name: Integrate missing ReSukiSU newfstat hook
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("fs/stat.c")
          text = path.read_text()

          # ------------------------------------------------------
          # Declarations
          # ------------------------------------------------------

          if "ksu_handle_newfstat_ret" not in text:

              marker = (
                  "#if !defined(__ARCH_WANT_STAT64) "
                  "|| defined(__ARCH_WANT_SYS_NEWFSTATAT)"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: fs/stat.c: declaration anchor not found"
                  )

              declaration = """#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_stat(
              int *dfd,
              const char __user **filename_user,
              int *flags);

          extern void ksu_handle_newfstat_ret(
              unsigned int *fd,
              struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd,
              struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          """

              text = text.replace(
                  marker,
                  declaration + marker,
                  1
              )

          # ------------------------------------------------------
          # newfstatat()
          # ------------------------------------------------------

          if "ksu_handle_stat(&dfd, &filename, &flag);" not in text:

              marker = """\tstruct kstat stat;
          \tint error;

          \terror = vfs_fstatat(dfd, filename, &stat, flag);
          """

              if marker not in text:
                  raise SystemExit(
                      "ERROR: fs/stat.c: newfstatat anchor not found"
                  )

              replacement = """\tstruct kstat stat;
          \tint error;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif

          \terror = vfs_fstatat(dfd, filename, &stat, flag);
          """

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          # ------------------------------------------------------
          # newfstat()
          # ------------------------------------------------------

          if "ksu_handle_newfstat_ret(&fd, &statbuf);" not in text:

              marker = """\tstruct kstat stat;
          \tint error = vfs_fstat(fd, &stat);
          \tif (!error)
          \t\terror = cp_new_stat(&stat, statbuf);

          \treturn error;
          }
          """

              if marker not in text:
                  raise SystemExit(
                      "ERROR: fs/stat.c: newfstat anchor not found"
                  )

              replacement = """\tstruct kstat stat;
          \tint error = vfs_fstat(fd, &stat);
          \tif (!error)
          \t\terror = cp_new_stat(&stat, statbuf);

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_newfstat_ret(&fd, &statbuf);
          #endif

          \treturn error;
          }
          """

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          # ------------------------------------------------------
          # fstat64()
          # ------------------------------------------------------

          if "SYSCALL_DEFINE2(fstat64" in text:
              if "ksu_handle_fstat64_ret(&fd, &statbuf);" not in text:

                  marker = """\tstruct kstat stat;
          \tint error = vfs_fstat(fd, &stat);

          \tif (!error)
          \t\terror = cp_new_stat64(&stat, statbuf);

          \treturn error;
          }
          """

                  if marker in text:

                      replacement = """\tstruct kstat stat;
          \tint error = vfs_fstat(fd, &stat);

          \tif (!error)
          \t\terror = cp_new_stat64(&stat, statbuf);

          #ifdef CONFIG_KSU_MANUAL_HOOK
          \tksu_handle_fstat64_ret(&fd, &statbuf);
          #endif

          \treturn error;
          }
          """

                      text = text.replace(
                          marker,
                          replacement,
                          1
                      )

          path.write_text(text)

          PY

          echo
          echo "=========================================="
          echo "Checking stat hooks"
          echo "=========================================="

          grep -n "ksu_handle_stat" fs/stat.c
          grep -n "ksu_handle_newfstat_ret" fs/stat.c

          if grep -q "SYSCALL_DEFINE2(fstat64" fs/stat.c; then
            grep -n "ksu_handle_fstat64_ret" fs/stat.c || true
          fi


      # ==========================================================
      # APPLY JACKA1LTMAN SUSFS PATCH
      # ==========================================================

      - name: Apply JackA1ltman SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set +e

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch \
            ./susfs_patch_to_4.19.patch

          patch \
            -p1 \
            < ./susfs_patch_to_4.19.patch

          PATCH_STATUS=$?

          echo
          echo "Patch command exit code: ${PATCH_STATUS}"

          # We intentionally continue here because the JackA1ltman
          # documentation requires manual adaptation of rejected hunks.
          exit 0


      # ==========================================================
      # MANUALLY ADAPT THE TWO KNOWN REJECTS
      # ==========================================================

      - name: Adapt rejected SuSFS 4.19 hunks
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          # ======================================================
          # fs/namespace.c
          #
          # Current LineageOS kernel uses:
          #
          # vfs_create_mount()
          # alloc_vfsmnt(fc->source ?: "none")
          #
          # This is explicitly the 4.19+ variant documented by
          # JackA1ltman.
          # ======================================================

          path = Path("fs/namespace.c")
          text = path.read_text()

          # ------------------------------------------------------
          # Include susfs_def.h
          # ------------------------------------------------------

          if "#include <linux/susfs_def.h>" not in text:

              anchor = "#include <linux/sched/task.h>"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: namespace.c: include anchor not found"
                  )

              text = text.replace(
                  anchor,
                  anchor + """
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          #include <linux/susfs_def.h>
          #endif
          """,
                  1
              )

          # ------------------------------------------------------
          # SuSFS declarations
          #
          # IMPORTANT:
          # Use the symbol expected by the actual JackA1ltman
          # 4.19 patch currently being applied.
          # ------------------------------------------------------

          if "susfs_is_current_ksu_domain" not in text:

              anchor = '#include "internal.h"'

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: namespace.c: internal.h anchor not found"
                  )

              declarations = """
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          extern bool susfs_is_current_ksu_domain(void);
          extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;

          #define CL_COPY_MNT_NS BIT(25)
          #endif
          """

              text = text.replace(
                  anchor,
                  anchor + declarations,
                  1
              )

          # ------------------------------------------------------
          # vfs_create_mount()
          # ------------------------------------------------------

          if "susfs_alloc_non_unshare_ksu_vfsmnt" not in text:

              anchor = """\tmnt = alloc_vfsmnt(fc->source ?: "none");
          \tif (!mnt)
          \t\treturn ERR_PTR(-ENOMEM);
          """

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: namespace.c: vfs_create_mount alloc_vfsmnt "
                      "anchor not found"
                  )

              replacement = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          	/*
          	 * Do not create a normal mount for the KSU domain while
          	 * Android/data is still protected.
          	 */
          	if (static_branch_unlikely(
          		&susfs_is_sdcard_android_data_not_decrypted)) {
          		if (susfs_is_current_ksu_domain()) {
          			mnt = susfs_alloc_non_unshare_ksu_vfsmnt(
          				fc->source ?: "none");
          			goto bypass_orig_flow;
          		}
          	}
          #endif

          	mnt = alloc_vfsmnt(fc->source ?: "none");

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          bypass_orig_flow:
          #endif

          	if (!mnt)
          		return ERR_PTR(-ENOMEM);
          """

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          path.write_text(text)

          # ======================================================
          # fs/proc/task_mmu.c
          #
          # seq_put_hex_ll exists in this kernel, so use the
          # JackA1ltman 4.19-5.4 variant.
          # ======================================================

          path = Path("fs/proc/task_mmu.c")
          text = path.read_text()

          if "seq_put_hex_ll" not in text:
              raise SystemExit(
                  "ERROR: task_mmu.c: seq_put_hex_ll not found"
              )

          # ------------------------------------------------------
          # Add vma declaration inside pagemap_read()
          # ------------------------------------------------------

          if "struct vm_area_struct *vma;" not in text:

              anchor = """\tunsigned long start_vaddr;
          \tunsigned long end_vaddr;
          \tint ret = 0, copied = 0;
          """

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c: pagemap variable anchor not found"
                  )

              replacement = """\tunsigned long start_vaddr;
          \tunsigned long end_vaddr;
          \tstruct vm_area_struct *vma;
          \tint ret = 0, copied = 0;
          """

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          # ------------------------------------------------------
          # Add SUS_MAP check
          # ------------------------------------------------------

          if "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))" not in text:

              anchor = """\t\tret = mmap_read_lock_killable(mm);
          \t\tif (ret)
          \t\t\tgoto out_free;
          """

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c: mmap lock anchor not found"
                  )

              replacement = """\t\tret = mmap_read_lock_killable(mm);
          \t\tif (ret)
          \t\t\tgoto out_free;

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          		vma = find_vma(mm, start_vaddr);
          		if (vma &&
          		    vma->vm_file &&
          		    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))
          			goto bypass_orig_flow;
          #endif
          """

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          # ------------------------------------------------------
          # Add bypass label
          # ------------------------------------------------------

          if "bypass_orig_flow:" not in text:

              anchor = """\t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);
          \t\tmmap_read_unlock(mm);
          """

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: task_mmu.c: walk_page_range anchor not found"
                  )

              replacement = """\t\tret = walk_page_range(start_vaddr, end, &pagemap_walk);

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          bypass_orig_flow:
          #endif

          		mmap_read_unlock(mm);
          """

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          path.write_text(text)

          PY

          echo
          echo "=========================================="
          echo "Manual SuSFS adaptation verification"
          echo "=========================================="

          echo
          echo "--- namespace.c ---"

          grep -n \
            "susfs_is_current_ksu_domain" \
            fs/namespace.c

          grep -n \
            "susfs_alloc_non_unshare_ksu_vfsmnt" \
            fs/namespace.c

          echo
          echo "--- task_mmu.c ---"

          grep -n \
            "SUSFS_IS_INODE_SUS_MAP" \
            fs/proc/task_mmu.c


      # ==========================================================
      # CHECK REJECTS
      # ==========================================================

      - name: Verify SuSFS rejected hunks
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking remaining .rej files"
          echo "=========================================="

          REJECTS="$(
            find . \
              -type f \
              -name '*.rej' \
              | wc -l
          )"

          echo "Rejected hunks remaining: ${REJECTS}"

          if [ "${REJECTS}" -ne 0 ]; then

            echo
            echo "::error::SuSFS still contains rejected hunks."

            find . \
              -type f \
              -name '*.rej' \
              -print

            echo
            echo "Reject contents:"

            while IFS= read -r REJ; do
              echo
              echo "========== ${REJ} =========="
              cat "${REJ}"
            done < <(
              find . \
                -type f \
                -name '*.rej'
            )

            exit 1
          fi

          echo "No rejected hunks remain."


      # ==========================================================
      # CLEAN PATCH TEMP FILES
      # ==========================================================

      - name: Clean patch temporary files
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          rm -f \
            susfs_patch_to_4.19.patch

          find . \
            -type f \
            -name '*.orig' \
            -delete


      # ==========================================================
      # ADD SUSFS CONFIGURATION
      # ==========================================================

      - name: Configure SuSFS
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          SUSFS_CONFIGS=(
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for CONFIG_NAME in "${SUSFS_CONFIGS[@]}"; do
            sed -i "/^${CONFIG_NAME}=/d" "${DEFCONFIG_FILE}"
            sed -i "/^# ${CONFIG_NAME} is not set$/d" "${DEFCONFIG_FILE}"
          done

          cat >> "${DEFCONFIG_FILE}" <<'EOF'

          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF


      # ==========================================================
      # VERIFY SOURCE HOOKS
      # ==========================================================

      - name: Verify ReSukiSU manual hooks
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ReSukiSU hook verification"
          echo "=========================================="

          REQUIRED_HOOKS=(
            ksu_handle_execveat
            ksu_handle_faccessat
            ksu_handle_stat
            ksu_handle_newfstat_ret
          )

          for HOOK in "${REQUIRED_HOOKS[@]}"; do

            if ! grep -R \
              -q \
              "${HOOK}" \
              fs \
              kernel \
              --include='*.c' \
              --include='*.h'; then

              echo "::error::Missing hook: ${HOOK}"
              exit 1
            fi

            echo "PASS: ${HOOK}"

          done


      # ==========================================================
      # GENERATE CONFIGURATION
      # ==========================================================

      - name: Generate kernel configuration
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "../${BUILD_DIR}"

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            "${DEFCONFIG}"

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            olddefconfig


      # ==========================================================
      # VERIFY FINAL .CONFIG
      # ==========================================================

      - name: Verify final kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${BUILD_DIR}/.config"

          test -f "${CONFIG}"

          REQUIRED_CONFIGS=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          echo "=========================================="
          echo "Final configuration"
          echo "=========================================="

          for CONFIG_NAME in "${REQUIRED_CONFIGS[@]}"; do

            if ! grep -q "^${CONFIG_NAME}=y$" "${CONFIG}"; then
              echo "::error::${CONFIG_NAME} is not enabled"
              exit 1
            fi

            echo "PASS: ${CONFIG_NAME}=y"

          done


      # ==========================================================
      # RECHECK RESUKISU INTEGRATION
      # ==========================================================

      - name: ReSukiSU manual hook preflight
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "ReSukiSU Manual Hook preflight"
          echo "=========================================="

          grep -R \
            -n \
            "ksu_handle_execveat" \
            fs \
            kernel \
            --include='*.c' \
            --include='*.h' \
            | head -20

          grep -R \
            -n \
            "ksu_handle_faccessat" \
            fs \
            kernel \
            --include='*.c' \
            --include='*.h' \
            | head -20

          grep -R \
            -n \
            "ksu_handle_stat" \
            fs \
            kernel \
            --include='*.c' \
            --include='*.h' \
            | head -20

          grep -R \
            -n \
            "ksu_handle_newfstat_ret" \
            fs \
            kernel \
            --include='*.c' \
            --include='*.h' \
            | head -20

          echo
          echo "Manual Hook source integration: PASS"


      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        env:
          CC: clang
          HOSTCC: clang
          CROSS_COMPILE: aarch64-linux-gnu-
          CLANG_TRIPLE: aarch64-linux-gnu-
        run: |
          set -euxo pipefail

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            -j"$(nproc)"


      # ==========================================================
      # COLLECT ARTIFACTS
      # ==========================================================

      - name: Collect build artifacts
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts/kernel

          find "${BUILD_DIR}/arch/arm64/boot" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          for FILE in \
            "${BUILD_DIR}/arch/arm64/boot/Image" \
            "${BUILD_DIR}/arch/arm64/boot/Image.gz" \
            "${BUILD_DIR}/arch/arm64/boot/Image.gz-dtb" \
            "${BUILD_DIR}/arch/arm64/boot/dt.img" \
            "${BUILD_DIR}/arch/arm64/boot/dtb.img"; do

            if [ -f "${FILE}" ]; then
              cp "${FILE}" artifacts/kernel/
            fi

          done

          cp \
            "${BUILD_DIR}/.config" \
            artifacts/kernel/kernel.config

          {
            echo "Kernel repository:"
            echo "${KERNEL_REPO}"
            echo
            echo "Kernel branch:"
            echo "${KERNEL_BRANCH}"
            echo
            echo "Kernel commit:"
            git -C "${KERNEL_PATH}" rev-parse HEAD
            echo
            echo "ReSukiSU commit:"
            git -C "${KERNEL_PATH}/KernelSU" rev-parse HEAD
          } > artifacts/kernel/BUILD_INFO.txt


      # ==========================================================
      # DOWNLOAD STOCK BOOT
      # ==========================================================

      - name: Download stock boot image
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts/boot

          curl -fL \
            "${BOOT_URL}" \
            -o artifacts/boot/boot-stock-kiev-20260809.img

          file \
            artifacts/boot/boot-stock-kiev-20260809.img


      # ==========================================================
      # FAILURE DIAGNOSTICS
      # ==========================================================

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p artifacts/diagnostic

          if [ -d "${KERNEL_PATH}" ]; then

            find "${KERNEL_PATH}" \
              -type f \
              \( \
                -name '*.rej' \
                -o \
                -name '*.orig' \
              \) \
              -print \
              > artifacts/diagnostic/rejects.txt

            git -C "${KERNEL_PATH}" diff \
              > artifacts/diagnostic/kernel.diff

            if [ -f "${BUILD_DIR}/.config" ]; then
              cp \
                "${BUILD_DIR}/.config" \
                artifacts/diagnostic/kernel.config
            fi

            grep -R \
              -n \
              -E \
              'KSU|MANUAL_HOOK|newfstat|SUSFS' \
              "${KERNEL_PATH}/KernelSU" \
              > artifacts/diagnostic/ksu-susfs.txt \
              2>/dev/null || true

          fi


      # ==========================================================
      # UPLOAD SUCCESS
      # ==========================================================

      - name: Upload successful build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-resukisu-susfs-4.19-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # UPLOAD DIAGNOSTICS
      # ==========================================================

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-resukisu-susfs-diagnostics-${{ github.run_number }}
          path: artifacts/diagnostic/
          if-no-files-found: warn
          retention-days: 14
