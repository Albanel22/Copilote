name: Kernel CI — build & package

on:
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  SUKISU_REPO: 'https://github.com/Albanel22/ReSukiSU.git'
  SUSFS_REPO: 'https://gitlab.com/simonpunk/susfs4ksu.git'
  SUSFS_BRANCH: 'kernel-4.19'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex \
            glibc-source libelf-dev libssl-dev libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang llvm lld device-tree-compiler zip unzip curl git python3

      - name: Clone Motorola Kernel Source
        run: |
          set -euo pipefail
          echo "📥 Récupération des sources du noyau..."
          git clone https://github.com/LineageOS/android_kernel_motorola_sm8250.git \
            -b lineage-23.2 --depth=1 ${{ env.KERNEL_PATH }}

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-kernel-${{ github.run_number }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: 📂 Intégration ReSukiSU & SUSFS via setup.sh
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "📥 [1/3] Téléchargement et exécution du setup.sh..."
          echo "=================================================="
          
          # Téléchargement du script officiel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" -o setup_sukisu.sh
          
          # Exécution en mode debug pour voir tout ce qu'il fait dans les logs
          bash -x ./setup_sukisu.sh main
          
          # Nettoyage du script temporaire
          rm -f setup_sukisu.sh

          echo "=================================================="
          echo "📥 [2/3] Intégration des patchs SUSFS..."
          echo "=================================================="
          if git clone "${{ env.SUSFS_REPO }}" -b "${{ env.SUSFS_BRANCH }}" --depth=1; then
            if [ -d "susfs4ksu/kernel_patches" ]; then
              cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/
              cp -r susfs4ksu/kernel_patches/fs/* fs/
              echo "✅ Patchs SUSFS copiés avec succès."
            else
              echo "❌ ERREUR : Dossier kernel_patches absent dans susfs4ksu !"
              exit 1
            fi
            rm -rf susfs4ksu
          else
            echo "❌ ERREUR : Échec du clonage de SUSFS !"
            exit 1
          fi

          echo "=================================================="
          echo "🔍 [3/3] Vérification finale de l'intégration..."
          echo "=================================================="
          if [ -d "drivers/kernelsu" ] || [ -d "KernelSU" ]; then
            echo "🟢 Statut KernelSU / ReSukiSU : PRÉSENT."
          else
            echo "❌ ERREUR : ReSukiSU n'a pas été installé par le script setup.sh !"
            exit 1
          fi
      - name: Prepare defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail
          mkdir -p arch/arm64/configs/vendor
          if [ -f "../kiev_perfect_defconfig" ]; then
            cp ../kiev_perfect_defconfig arch/arm64/configs/vendor/${{ env.DEFCONFIG }}
          fi

      - name: Patch SukiSU for Kernel 4.19 compatibility
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail
          echo "🛠️ Correction de MODULE_IMPORT_NS pour le noyau 4.19..."
          
          # On cible le fichier init.c dans le dossier KernelSU d'origine
          INIT_FILE="KernelSU/kernel/core/init.c"
          
          if [ -f "$INIT_FILE" ]; then
            # Si la macro pose problème sur 4.19, on l'encadre par une vérification ou on la commente/adapte
            sed -i 's/MODULE_IMPORT_NS/#//g' "$INIT_FILE" || true
            echo "✅ Patch appliqué sur $INIT_FILE"
          else
            echo "⚠️ Fichier init.c introuvable pour le patch."
          fi

          # --- AJOUTE LE CORRECTIF ICI ---
      - name: Fix MODULE_IMPORT_NS for Kernel 4.19
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail
          echo "🛠️ Correction de la compatibilité MODULE_IMPORT_NS pour le noyau 4.19..."
          
          INIT_FILE="KernelSU/kernel/core/init.c"
          
          if [ -f "$INIT_FILE" ]; then
            sed -i '/MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);/s/^/\/\//' "$INIT_FILE"
            echo "✅ Ligne neutralisée avec succès dans $INIT_FILE"
          else
            echo "❌ Fichier init.c introuvable !"
            exit 1
          fi

      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          # ... (la suite de ton étape de compilation habituelle)

      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export USE_CCACHE=1
          export CC="ccache clang"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"

          ccache -M ${{ env.CCACHE_SIZE }}
          ccache -z

          mkdir -p ${{ env.BUILD_DIR }}
          cp arch/arm64/configs/vendor/${{ env.DEFCONFIG }} arch/arm64/configs/${{ env.DEFCONFIG }} || true

          make O=${{ env.BUILD_DIR }} LLVM=1 CC="$CC" CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 ${{ env.DEFCONFIG }}

          cat >> ${{ env.BUILD_DIR }}/.config << 'CONFIG_EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_CALLBACK=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_MOUNT_UNMOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_DISABLE=y
          CONFIG_EOF

          make O=${{ env.BUILD_DIR }} LLVM=1 CC="$CC" CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 oldconfig

          # --- PATCH TACTILE MOTOROLA & MODULES ---
          sed -i 's/if (!check_version(/if (0 \&\& !check_version(/g' kernel/module.c
          printf "\n/* --- Patch Tactile --- */\n#include <linux/notifier.h>\n#include <linux/module.h>\nstatic BLOCKING_NOTIFIER_HEAD(motorola_panel_notifier_list);\nint panel_register_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_register(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_register_notifier);\nint panel_unregister_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_unregister(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_unregister_notifier);\nvoid touch_set_state(int state) { return; }\nEXPORT_SYMBOL(touch_set_state);\n" >> techpack/display/msm/msm_drv.c

          make O=${{ env.BUILD_DIR }} LLVM=1 CC="$CC" CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 KCFLAGS="$KCFLAGS" -j$(nproc) Image 2>&1 | tee build.log

          if [ ! -f "${{ env.BUILD_DIR }}/arch/arm64/boot/Image" ]; then
            echo "❌ Erreur : Image du noyau non trouvée"
            tail -80 build.log
            exit 1
          fi
          echo "✅ Compilation du noyau réussie"

      - name: Repack & Finalize (AnyKernel3)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/anykernel.sh AnyKernel3/README.md AnyKernel3/.gitignore

          mkdir -p AnyKernel3/patch/system/bin
          echo "📂 Copie de ksud depuis le dépôt local..."
          cp ksud AnyKernel3/patch/system/bin/ksud
          chmod +x AnyKernel3/patch/system/bin/ksud

          echo "✍️ Création du script anykernel.sh avec intégration native d'OverlayFS..."
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ### AnyKernel setup
          properties() { '
          kernel.string=Custom Kernel avec Risukisu pour Motorola One 5G Ace
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=kiev
          device.name2=XT2113-2
          device.name3=kiev_retde
          device.name4=kiev_t
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          split_boot;

          if [ -f patch/system/bin/ksud ]; then
            mkdir -p /data/adb/ksu/bin
            cp patch/system/bin/ksud /data/adb/ksu/bin/ksud
            chmod 755 /data/adb/ksu/bin/ksud
            # Initialisation de l'environnement SukiSU pour les noyaux non-GKI
            ./patch/system/bin/ksud kernel setup-script || true
          fi

          flash_boot;
          EOF
          sed -i 's/\r$//' AnyKernel3/anykernel.sh

          IMG="${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image"
          cp "$IMG" AnyKernel3/Image

          mkdir -p final_output
          cd AnyKernel3
          zip -r9 ../final_output/AnyKernel3_ReSukiSU_kiev.zip .
          cd ..
          echo "✅ Packaging terminé avec succès"
      
      - name: Upload Finished Packaged Assets
        uses: actions/upload-artifact@v4
        with:
          name: kernel-motorola_anykernel3
          path: final_output/AnyKernel3_ReSukiSU_kiev.zip
          retention-days: 30
          if-no-files-found: error
