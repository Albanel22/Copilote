name: Kernel CI — build & package

on:
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  BOOT_URL: 'https://mirrorbits.lineageos.org/full/kiev/20260726/boot.img'
  SUSFS_REPO: 'https://gitlab.com/simonpunk/susfs4ksu.git'
  SUSFS_TAG: 'v2.2.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex glibc-source libelf-dev libssl-dev libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang llvm lld device-tree-compiler zip unzip curl git python3

      - name: Download Stock Boot Image
        shell: bash
        run: |
          set -euo pipefail
          echo "📥 Téléchargement du boot.img d'origine (version 20260726)..."
          curl -fLo boot-stock.img "${{ env.BOOT_URL }}" || { echo "❌ Erreur de téléchargement du boot.img"; exit 1; }

      - name: Clone Motorola Kernel Source
        run: |
          echo "📥 Récupération des sources du noyau..."
          git clone https://github.com/LineageOS/android_kernel_motorola_sm8250.git -b lineage-23.2 --depth=1 ${{ env.KERNEL_PATH }}

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-kernel
          restore-keys: ${{ runner.os }}-ccache-

      - name: 📂 Intégration de ton fork ReSukiSU & SUSFS v2.2.0
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -e
          cp ../kiev_perfect_defconfig arch/arm64/configs/vendor/${{ env.DEFCONFIG }}
          
          echo "🧼 Nettoyage des dossiers temporaires ou obsolètes..."
          rm -rf drivers/kernelsu kernelSU susfs4ksu temp_susfs temp_susfs_fix || true
          
          echo "📥 Clonage de ton fork personnel ReSukiSU..."
          git clone https://github.com/Albanel22/ReSukiSU.git drivers/kernelsu

          echo "📥 Clonage et intégration propre de SUSFS (Tag: ${{ env.SUSFS_TAG }})..."
          git clone "${{ env.SUSFS_REPO }}" --branch "${{ env.SUSFS_TAG }}" --depth=1 susfs4ksu
          
          # Copie explicite des en-têtes SUSFS là où le noyau et ReSukiSU les attendent
          if [ -d "susfs4ksu/kernel_patches/include/linux" ]; then
            cp -v susfs4ksu/kernel_patches/include/linux/susfs*.h include/linux/
          elif [ -d "susfs4ksu/include/linux" ]; then
            cp -v susfs4ksu/include/linux/susfs*.h include/linux/
          fi
          
          # Copie des fichiers fs si présents
          if [ -d "susfs4ksu/kernel_patches/fs" ]; then
            cp -r susfs4ksu/kernel_patches/fs/* fs/ || true
          fi
          
          rm -rf susfs4ksu

          # Vérification de sécurité absolue pour forcer l'arrêt si les fichiers manquent
          if [ -f "include/linux/susfs.h" ]; then
            echo "✅ Succès : susfs.h est bien en place !"
          else
            echo "❌ ERREUR : susfs.h introuvable dans include/linux/ !"
            exit 1
          fi

          echo "🔗 Liaison officielle de ReSukiSU dans les drivers du noyau......"
          if ! grep -q "kernelsu" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/kernel/Kconfig"' drivers/Kconfig || echo 'source "drivers/kernelsu/kernel/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-y += kernelsu/kernel/' >> drivers/Makefile
          fi

          echo "🔨 Neutralisation des scripts de vérification des hooks..."
          find . -type f -name "*hook_check.mk" -exec sh -c 'echo "" > "$1"' _ {} \;

      - name: 💉 Injection complète des hooks via Python
        run: |
          cd ${{ env.KERNEL_PATH }}
          git checkout drivers/input/input.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c kernel/sys.c || true
          python3 - << 'EOF'
          import os
          def inject_hook(path, target_func_header, declaration, call_body):
              if not os.path.exists(path): return
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              if call_body in content: return
              if target_func_header in content:
                  content = content.replace(target_func_header, declaration + "\n" + target_func_header, 1)
                  idx = content.find(target_func_header)
                  brace_idx = content.find('{', idx)
                  if brace_idx != -1:
                      content = content[:brace_idx + 1] + "\n" + call_body + "\n" + content[brace_idx + 1:]
                      with open(path, 'w', encoding='utf-8') as f: f.write(content)
          inject_hook("drivers/input/input.c", "void input_event(struct input_dev *dev,\n\t\t unsigned int type, unsigned int code, int value)", "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern bool ksu_input_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n#endif")
          inject_hook("fs/exec.c", "int do_execve(struct filename *filename,\n\tconst char __user *const __user *__argv,\n\tconst char __user *const __user *__envp)", "#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_execve(struct filename **filename_ptr, const char __user *const __user **argv_ptr, const char __user *const __user **envp_ptr);\n#endif", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execve(&filename, &__argv, &__envp);\n#endif")
          inject_hook("fs/open.c", "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)", "#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif")
          inject_hook("fs/read_write.c", "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)", "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern bool ksu_init_rc_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tif (unlikely(ksu_init_rc_hook))\n\t\tksu_handle_sys_read(fd, &buf, &count);\n#endif")
          inject_hook("fs/stat.c", "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n\t\tstruct stat __user *, statbuf, int, flag)", "#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, struct filename **filename_ptr, int *flags);\n#endif", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tstruct filename *name = getname(filename);\n\tksu_handle_stat(&dfd, &name, &flag);\n#endif")
          inject_hook("kernel/reboot.c", "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)", "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif")
          inject_hook("kernel/sys.c", "long __sys_setresuid(uid_t ruid, uid_t euid, uid_t suid)", "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\t(void)ksu_handle_setresuid(ruid, euid, suid);\n#endif")
          print("✨ Hooks injectés avec succès !")
          EOF

      - name: 🛠️ Forcer la déclaration de SUSFS_MAGIC si absente
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          if ! grep -q "SUSFS_MAGIC" include/linux/susfs*.h 2>/dev/null; then
            echo "⚠️ SUSFS_MAGIC introuvable dans les en-têtes, ajout de sécurité..."
            echo "#define SUSFS_MAGIC 0xDEADBEEF" >> include/linux/susfs.h
          fi

      - name: 🛠️ Correction des redéfinitions dans ReSukiSU (symbol_resolver)
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          if [ -f "drivers/kernelsu/kernel/infra/symbol_resolver.h" ]; then
            echo "🔧 Correction de symbol_resolver.h pour éviter les conflits static inline..."
            sed -i 's/static inline unsigned long find_kernel_symbol_exact/unsigned long find_kernel_symbol_exact/g' drivers/kernelsu/kernel/infra/symbol_resolver.h || true
            sed -i 's/static inline void \*ksu_resolve_symbol_for_functable_hook/void *ksu_resolve_symbol_for_functable_hook/g' drivers/kernelsu/kernel/infra/symbol_resolver.h || true
            sed -i 's/static inline void ksu_init_symbol_resolver/void ksu_init_symbol_resolver/g' drivers/kernelsu/kernel/infra/symbol_resolver.h || true
            
            sed -i 's/{ return 0; };/{/g' drivers/kernelsu/kernel/infra/symbol_resolver.h || true
          fi

      - name: 🛠️ Correction des doublons dans symbol_resolver
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          if [ -f "drivers/kernelsu/kernel/infra/symbol_resolver.c" ]; then
            echo "🔧 Ajout de gardes de compilation ou nettoyage dans symbol_resolver..."
            sed -i '1i#ifndef __SYMBOL_RESOLVER_C__\n#define __SYMBOL_RESOLVER_C__' drivers/kernelsu/kernel/infra/symbol_resolver.c
            echo -e "\n#endif /* __SYMBOL_RESOLVER_C__ */" >> drivers/kernelsu/kernel/infra/symbol_resolver.c
          fi
          
          if [ -f "drivers/kernelsu/kernel/infra/symbol_resolver.h" ]; then
            cat << 'EOF' > drivers/kernelsu/kernel/infra/symbol_resolver.h
          #ifndef __SYMBOL_RESOLVER_H__
          #define __SYMBOL_RESOLVER_H__

          #include <linux/types.h>

          unsigned long __nocfi find_kernel_symbol_exact(const char *symbol_name);
          void *ksu_resolve_symbol_for_functable_hook(const char *symbol_name);
          void __init ksu_init_symbol_resolver(void);

          #endif
          EOF
            echo "✅ symbol_resolver.h réécrit proprement !"
          fi

      - name: 🛠️ Forcer l'activation et l'export des symboles SUSFS
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          if [ -f "fs/susfs.c" ]; then
            echo "🔧 Injection des fonctions de secours et levée des conditions dans fs/susfs.c..."
            sed -i 's/#ifdef CONFIG_KSU_SUSFS/#if 1/g' fs/susfs.c || true
          fi
          
          if [ -f "fs/susfs.c" ] && ! grep -q "susfs_is_current_proc_umounted" fs/susfs.c; then
            cat << 'EOF' >> fs/susfs.c

          #include <linux/sched.h>
          bool susfs_is_current_proc_umounted(void) { return false; }
          void susfs_set_current_proc_umounted(bool state) {}
          void susfs_extra_works(void *work) {}
          unsigned long susfs_get_enabled_features(void) { return 0; }
          int susfs_show_variant(struct seq_file *m) { return 0; }
          int susfs_show_version(struct seq_file *m) { return 0; }
          void susfs_start_sdcard_monitor_fn(void) {}
          EOF
            echo "✅ Fonctions de secours SUSFS ajoutées avec succès à fs/susfs.c !"
          fi
          
      - name: 🧩 Intégration complète de tous les patchs source SUSFS
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          echo "📥 Re-clonage de susfs4ksu (Tag: ${{ env.SUSFS_TAG }}) pour injection globale..."
          git clone "${{ env.SUSFS_REPO }}" --branch "${{ env.SUSFS_TAG }}" --depth=1 temp_susfs
          
          if [ -d "temp_susfs/kernel_patches" ]; then
            echo "📂 Copie de l'arborescence des patchs kernel..."
            cp -av temp_susfs/kernel_patches/fs/* fs/ || true
            cp -av temp_susfs/kernel_patches/include/* include/ || true
          elif [ -d "temp_susfs/fs" ]; then
            cp -av temp_susfs/fs/* fs/ || true
            cp -av temp_susfs/include/* include/ || true
          fi
          
          if [ -f "fs/Makefile" ] && ! grep -q "susfs" fs/Makefile; then
            echo "obj-y += susfs.o" >> fs/Makefile
          fi
          
          rm -rf temp_susfs

      - name: 🧩 Intégration rigoureuse des fonctions SUSFS manquantes
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          echo "📥 Clonage temporaire de susfs4ksu pour cibler les fichiers de fonctions..."
          git clone "${{ env.SUSFS_REPO }}" --branch "${{ env.SUSFS_TAG }}" --depth=1 temp_susfs_fix
          
          if [ -d "temp_susfs_fix/kernel_patches/fs" ]; then
            cp -av temp_susfs_fix/kernel_patches/fs/* fs/ || true
          fi
          
          if [ -f "fs/Makefile" ]; then
            echo "🔧 Mise à jour propre de fs/Makefile..."
            grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile
            if [ ! -f "fs/susfs_funcs.c" ]; then
              sed -i '/susfs_funcs.o/d' fs/Makefile
            fi
          fi
          
          rm -rf temp_susfs_fix
          
      - name: 🛡️ Sécurité finale SUSFS_MAGIC
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          mkdir -p include/linux
          if ! grep -q "SUSFS_MAGIC" include/linux/susfs*.h 2>/dev/null; then
            echo "#ifndef SUSFS_MAGIC" >> include/linux/susfs.h
            echo "#define SUSFS_MAGIC 0x55534653" >> include/linux/susfs.h
            echo "#endif" >> include/linux/susfs.h
            echo "🔧 SUSFS_MAGIC injectée de force !"
          fi

      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -uo pipefail
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M ${{ env.CCACHE_SIZE }}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"
          
          mkdir -p ${{ env.BUILD_DIR }}
          cp arch/arm64/configs/vendor/${{ env.DEFCONFIG }} arch/arm64/configs/${{ env.DEFCONFIG }}
          
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 ${{ env.DEFCONFIG }}
          
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_CALLBACK=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_MOUNT_UNMOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KRETPROBES=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y"
          } >> ${{ env.BUILD_DIR }}/.config
          
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 olddefconfig
          
          # Patchs modules & Tactile Motorola
          sed -i 's/if (!check_version(/if (0 \&\& !check_version(/g' kernel/module.c
          printf "\n#include <linux/notifier.h>\n#include <linux/module.h>\nstatic BLOCKING_NOTIFIER_HEAD(motorola_panel_notifier_list);\nint panel_register_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_register(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_register_notifier);\nint panel_unregister_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_unregister(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_unregister_notifier);\nvoid touch_set_state(int state) { return; }\nEXPORT_SYMBOL(touch_set_state);\n" >> techpack/display/msm/msm_drv.c
          
          make O=${{ env.BUILD_DIR }} LLVM=1 CC="ccache clang" CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 KCFLAGS="$KCFLAGS" KSUD_VERSION=35005 KSU_VERSION=35005 -j$(nproc) Image
          
          if [ ! -f "${{ env.BUILD_DIR }}/arch/arm64/boot/Image" ]; then
            echo "❌ Erreur : Image du noyau non trouvée"
            exit 1
          fi
          echo "✅ Compilation du noyau réussie"

      - name: Repack & Finalize (AnyKernel3 with Official ReSukiSU Setup)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          
          rm -rf AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/.gitignore
          
          cp ${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image AnyKernel3/Image
          
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ### AnyKernel setup
          properties() { '
          kernel.string=Custom Kernel ReSukiSU pour Motorola One 5G Ace
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=kiev
          device.name2=XT2113-2
          device.name3=kiev_retde
          device.name4=kiev_t
          '; } # end properties
          
          ### AnyKernel install
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes
          
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          . tools/ak3-core.sh;
          
          split_boot;
          
          if [ -f /data/adb/ksu/bin/ksud ]; then
            /data/adb/ksu/bin/ksud kernel setup-script || true
          fi
          
          flash_boot;
          EOF
          sed -i 's/\r$//' AnyKernel3/anykernel.sh
          
          mkdir -p final_output
          cd AnyKernel3
          zip -r9 ../final_output/AnyKernel3_ReSukiSU_kiev.zip .
          cd ..
          echo "✅ Packaging AnyKernel3 propre terminé avec succès !"

      - name: Upload Finished Packaged Assets
        uses: actions/upload-artifact@v4
        with:
          name: kernel-motorola_anykernel3
          path: final_output/AnyKernel3_ReSukiSU_kiev.zip
          retention-days: 30
          if-no-files-found: error
