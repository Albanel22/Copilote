name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: LineageOS/android_kernel_motorola_sm8250
  KERNEL_BRANCH: lineage-23.2

  KERNEL_PATH: kernel_src
  BUILD_DIR: out

  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

jobs:
  build:
    name: Build ReSukiSU + SuSFS
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout kernel
      # ==========================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: ${{ env.KERNEL_PATH }}
          fetch-depth: 1

      # ==========================================================
      # 2. Install dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            device-tree-compiler

      # ==========================================================
      # 3. Verify kernel version
      # ==========================================================
      - name: Verify kernel version
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          VERSION="$(sed -n 's/^VERSION = //p' Makefile | head -1)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -1)"

          echo "=========================================="
          echo "Kernel version"
          echo "=========================================="
          echo "${VERSION}.${PATCHLEVEL}"

          test "${VERSION}" = "4"
          test "${PATCHLEVEL}" = "19"

      # ==========================================================
      # 4. Fetch JackA1ltman tools
      # ==========================================================
      - name: Fetch NonGKI tools
        run: |
          set -eux

          rm -rf non_gki_tools

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            non_gki_tools

          echo "Checking JackA1ltman files..."

          test -f \
            non_gki_tools/Bin/clean_hook.sh

          test -f \
            non_gki_tools/Patches/susfs_inline_hook_patches.sh

          test -f \
            non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch

          echo "JackA1ltman tools verified."

      # ==========================================================
      # 5. Clean previous KernelSU integration
      # ==========================================================
      - name: Clean previous KernelSU integration
        run: |
          set -eux

          if [ -d "${KERNEL_PATH}/KernelSU" ]; then

            echo "Existing KernelSU tree detected."
            echo "Running JackA1ltman clean_hook.sh."

            cp \
              non_gki_tools/Bin/clean_hook.sh \
              "${KERNEL_PATH}/clean_hook.sh"

            chmod +x \
              "${KERNEL_PATH}/clean_hook.sh"

            (
              cd "${KERNEL_PATH}"
              bash ./clean_hook.sh
            )

            rm -f \
              "${KERNEL_PATH}/clean_hook.sh"

          else

            echo "No previous KernelSU tree detected."

          fi

      # ==========================================================
      # 6. Install CURRENT ReSukiSU
      #
      # IMPORTANT:
      # setup.sh must run from inside the kernel tree.
      # ==========================================================
      - name: Install current ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          echo "Kernel directory:"
          pwd

          test -d drivers
          test -f Makefile

          echo "Installing current ReSukiSU..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "${RESUKISU_SETUP}" \
            -o resukisu_setup.sh

          chmod +x resukisu_setup.sh

          bash ./resukisu_setup.sh main

          rm -f resukisu_setup.sh

          echo "Verifying ReSukiSU..."

          test -d KernelSU
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile

          echo "ReSukiSU installation OK."

      # ==========================================================
      # 7. Verify ReSukiSU Kconfig
      # ==========================================================
      - name: Verify ReSukiSU hook modes
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          echo "Checking ReSukiSU hook selection..."

          grep -n \
            'config KSU_TRACEPOINT_HOOK' \
            KernelSU/kernel/Kconfig

          grep -n \
            'config KSU_MANUAL_HOOK' \
            KernelSU/kernel/Kconfig

          grep -n \
            'config KSU_SUSFS' \
            KernelSU/kernel/Kconfig

          echo
          echo "ReSukiSU uses a single KernelSU hooking choice."
          echo "For this build we select KSU_SUSFS."

      # ==========================================================
      # 8. Apply lito-perf base configuration
      #
      # IMPORTANT:
      # Do NOT force CONFIG_KSU_MANUAL_HOOK here.
      #
      # KSU_MANUAL_HOOK and KSU_SUSFS are alternatives in the
      # ReSukiSU hooking-method choice.
      # ==========================================================
      - name: Enable ReSukiSU and SuSFS configuration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          DEFCONFIG_FILE="arch/arm64/configs/vendor/lito-perf_defconfig"

          test -f "${DEFCONFIG_FILE}"

          cp \
            "${DEFCONFIG_FILE}" \
            "${DEFCONFIG_FILE}.backup"

          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/vendor/lito-perf_defconfig")

          lines = path.read_text().splitlines()

          configs = {
              "CONFIG_KSU": "y",
              "CONFIG_KALLSYMS": "y",
              "CONFIG_KALLSYMS_ALL": "y",

              "CONFIG_KSU_SUSFS": "y",
              "CONFIG_KSU_SUSFS_SUS_PATH": "y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT": "y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT": "y",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME": "y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG": "y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS": "y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG": "y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT": "y",
              "CONFIG_KSU_SUSFS_SUS_MAP": "y",
          }

          result = []

          for line in lines:

              if "=" in line:
                  key = line.split("=", 1)[0]

                  if key in configs:
                      continue

              if line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:-len(" is not set")]

                  if key in configs:
                      continue

              result.append(line)

          for key, value in configs.items():
              result.append(f"{key}={value}")

          path.write_text(
              "\n".join(result) + "\n"
          )
          PY

          echo
          echo "Requested configuration:"
          grep -E \
            '^(CONFIG_KSU=|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS)' \
            "${DEFCONFIG_FILE}" \
            || true

      # ==========================================================
      # 9. Apply SuSFS 4.19 patch
      #
      # The patch can have context differences against this exact
      # LineageOS 4.19 tree.
      #
      # We deliberately collect rejects instead of hiding them.
      # ==========================================================
      - name: Apply JackA1ltman SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          PATCH_FILE="${GITHUB_WORKSPACE}/non_gki_tools/Patches/Patch/susfs_patch_to_4.19.patch"

          test -f "${PATCH_FILE}"

          cp \
            "${PATCH_FILE}" \
            susfs_patch_to_4.19.patch

          echo "Applying:"
          echo "${PATCH_FILE}"

          rm -f \
            ./*.rej \
            fs/*.rej \
            fs/proc/*.rej \
            include/linux/*.rej \
            kernel/*.rej \
            mm/*.rej \
            security/selinux/*.rej

          set +e

          patch \
            --batch \
            --forward \
            --fuzz=3 \
            --reject-file=.rej \
            -p1 \
            < susfs_patch_to_4.19.patch

          PATCH_STATUS=$?

          set -e

          echo
          echo "Patch exit status: ${PATCH_STATUS}"

          echo
          echo "Remaining reject files:"
          find . \
            -type f \
            -name '*.rej' \
            -print \
            | sort || true

          rm -f susfs_patch_to_4.19.patch

          if [ "${PATCH_STATUS}" -ne 0 ]; then
            echo "::warning::SuSFS patch has context rejects."
            echo "They will be handled in the next integration step."
          fi

      # ==========================================================
      # 10. Resolve known 4.19 patch rejects
      #
      # We only continue if the remaining rejects are the known
      # namespace.c / task_mmu.c compatibility rejects.
      # ==========================================================
      - name: Resolve SuSFS 4.19 compatibility rejects
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          REJECTS="$(find . \
            -type f \
            -name '*.rej' \
            -print)"

          echo "Current rejects:"
          printf '%s\n' "${REJECTS}" || true

          UNKNOWN=0

          while IFS= read -r reject; do

            [ -z "${reject}" ] && continue

            case "${reject}" in
              ./fs/namespace.c.rej)
                echo "Known reject: fs/namespace.c"
                ;;

              ./fs/proc/task_mmu.c.rej)
                echo "Known reject: fs/proc/task_mmu.c"
                ;;

              *)
                echo "::error::Unexpected SuSFS reject:"
                echo "${reject}"
                UNKNOWN=1
                ;;
            esac

          done <<< "${REJECTS}"

          if [ "${UNKNOWN}" -ne 0 ]; then
            echo
            echo "Unexpected patch reject detected."
            echo "Full reject files:"
            find . \
              -type f \
              -name '*.rej' \
              -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;
            exit 1
          fi

          echo "Only known 4.19 compatibility rejects remain."

      # ==========================================================
      # 11. Apply JackA1ltman inline hooks
      #
      # This is the selected ReSukiSU/SuSFS hook mode.
      # ==========================================================
      - name: Apply JackA1ltman SuSFS inline hooks
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          SCRIPT="${GITHUB_WORKSPACE}/non_gki_tools/Patches/susfs_inline_hook_patches.sh"

          test -f "${SCRIPT}"

          cp \
            "${SCRIPT}" \
            ./susfs_inline_hook_patches.sh

          chmod +x \
            ./susfs_inline_hook_patches.sh

          bash ./susfs_inline_hook_patches.sh

          rm -f \
            ./susfs_inline_hook_patches.sh

          echo "SuSFS inline hooks applied."

      # ==========================================================
      # 12. Audit patch rejects
      #
      # We do NOT silently ignore rejects.
      # ==========================================================
      - name: Verify SuSFS source integration
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          REMAINING="$(find . \
            -type f \
            -name '*.rej' \
            -print)"

          if [ -n "${REMAINING}" ]; then

            echo "::error::SuSFS integration still contains rejected hunks."

            printf '%s\n' "${REMAINING}"

            while IFS= read -r reject; do

              [ -z "${reject}" ] && continue

              echo
              echo "=================================================="
              echo "${reject}"
              echo "=================================================="

              cat "${reject}"

            done <<< "${REMAINING}"

            exit 1
          fi

          echo "No remaining .rej files."

      # ==========================================================
      # 13. Remove temporary backup
      # ==========================================================
      - name: Cleanup temporary files
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          rm -f \
            arch/arm64/configs/vendor/lito-perf_defconfig.backup

      # ==========================================================
      # 14. Prepare build directory
      # ==========================================================
      - name: Prepare build directory
        run: |
          set -eux

          rm -rf "${BUILD_DIR}"

          mkdir -p \
            "${BUILD_DIR}"

      # ==========================================================
      # 15. Generate defconfig
      # ==========================================================
      - name: Configure kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -eux

          make \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            "${DEFCONFIG}"

      # ==========================================================
      # 16. Verify final configuration
      #
      # IMPORTANT:
      # CONFIG_KSU_MANUAL_HOOK is intentionally NOT required.
      #
      # CONFIG_KSU_SUSFS is the selected ReSukiSU hook mode.
      # ==========================================================
      - name: Verify final configuration
        run: |
          set -eux

          CONFIG="${BUILD_DIR}/.config"

          test -f "${CONFIG}"

          echo
          echo "=========================================="
          echo "Final KernelSU configuration"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS)' \
            "${CONFIG}" \
            || true

          REQUIRED_CONFIGS=(
            CONFIG_KSU
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          for CONFIG_NAME in "${REQUIRED_CONFIGS[@]}"; do

            if ! grep -q "^${CONFIG_NAME}=y$" "${CONFIG}"; then
              echo "::error::${CONFIG_NAME} is not enabled."
              exit 1
            fi

          done

          # Manual hook MUST NOT be selected together with the
          # ReSukiSU SUSFS hook mode.
          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "${CONFIG}"; then
            echo "::error::KSU_MANUAL_HOOK and KSU_SUSFS are mutually exclusive hook modes."
            exit 1
          fi

          echo
          echo "ReSukiSU + SuSFS configuration verified."

      # ==========================================================
      # 17. Build kernel
      # ==========================================================
      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euxo pipefail

          make \
            -j"$(nproc)" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            2>&1 | tee \
            "${GITHUB_WORKSPACE}/kernel-build.log"

      # ==========================================================
      # 18. Verify Image
      # ==========================================================
      - name: Verify kernel image
        run: |
          set -eux

          IMAGE="${BUILD_DIR}/arch/arm64/boot/Image"

          test -f "${IMAGE}"

          echo
          echo "Kernel Image:"
          ls -lh "${IMAGE}"

      # ==========================================================
      # 19. Download stock boot image
      # ==========================================================
      - name: Download stock boot image
        run: |
          set -eux

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "${BOOT_URL}" \
            -o stock-boot.img

          file stock-boot.img

      # ==========================================================
      # 20. Package artifacts
      # ==========================================================
      - name: Package artifacts
        run: |
          set -eux

          rm -rf release

          mkdir -p release

          cp \
            "${BUILD_DIR}/arch/arm64/boot/Image" \
            release/Image

          cp \
            stock-boot.img \
            release/stock-boot.img

          cp \
            kernel-build.log \
            release/kernel-build.log

          tar \
            -czf \
            resukisu-susfs-kernel.tar.gz \
            -C release \
            .

      # ==========================================================
      # 21. Upload artifacts
      # ==========================================================
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-susfs-kernel
          path: |
            release/
            kernel-build.log
            resukisu-susfs-kernel.tar.gz
          if-no-files-found: warn
