name: Kernel CI - build & package

on:
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260726/boot.img

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: test-sukisu

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex libelf-dev libssl-dev \
            libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang llvm lld device-tree-compiler zip unzip curl git python3

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-kernel
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Download stock boot image
        shell: bash
        run: |
          set -euo pipefail
          curl -fLo boot-stock.img "${{ env.BOOT_URL }}" || true

      - name: Clone kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/LineageOS/android_kernel_motorola_sm8250.git \
            -b lineage-23.2 --depth=1 "${{ env.KERNEL_PATH }}"

      - name: Prepare ReSuKiSu / SusFS
        shell: bash
        run: |
          set -euo pipefail

          git clone -b test-sukisu https://github.com/Albanel22/Copilote.git temp_copilote

          echo "Copy susfs sources..."
          cp temp_copilote/susfs.c "${{ env.KERNEL_PATH }}/fs/"
          mkdir -p "${{ env.KERNEL_PATH }}/include/linux"
          cp temp_copilote/susfs.h "${{ env.KERNEL_PATH }}/include/linux/"

          echo "Normalize patch line endings..."
          sed -i 's/\r$//' temp_copilote/50_add_susfs_in_kernel-4.19.patch || true
          sed -i 's/\r$//' temp_copilote/10_enable_susfs_for_ksu.patch || true

          cd "${{ env.KERNEL_PATH }}"

          echo "Apply main SUSFS patch if present..."
          if [ -f ../temp_copilote/50_add_susfs_in_kernel-4.19.patch ]; then
            patch -p1 --binary --forward < ../temp_copilote/50_add_susfs_in_kernel-4.19.patch || true
          fi

          echo "Setup ReSukiSU..."
          rm -rf drivers/kernelsu
          mkdir -p drivers
          git clone https://github.com/resukisu/ResukiSU.git drivers/kernelsu || true

          echo "Apply SUSFS patch to ReSukiSU if present..."
          if [ -f ../../temp_copilote/10_enable_susfs_for_ksu.patch ]; then
            cd drivers/kernelsu
            patch -p1 --binary --forward --fuzz=2 < ../../../temp_copilote/10_enable_susfs_for_ksu.patch || true
            cd ../..
          fi

          echo "Create compat_419.c..."
          cat > drivers/kernelsu/compat_419.c <<'EOF'
          #include <linux/kernel.h>
          #include <linux/init.h>
          #include <linux/fs.h>
          #include <linux/sched.h>
          #include <linux/path.h>
          #include <linux/rwlock.h>

          int __init ksu_selinux_hide_init(void) { return 0; }
          void ksu_selinux_hide_exit(void) {}
          int ksu_selinux_hide_handle_post_fs_data(void) { return 0; }
          void ksu_selinux_hide_drop_backup_if_unused(void) {}
          int ksu_selinux_hide_handle_second_stage(void) { return 0; }

          int __init ksu_observer_init(void) { return 0; }
          void ksu_observer_exit(void) {}

          int __init ksu_file_wrapper_init(void) { return 0; }
          int ksu_install_file_wrapper(void) { return 0; }

          int ksu_handle_umount(struct path *path, int flags) { return 0; }
          int setup_mount_ns(void) { return 0; }

          void ksu_seccomp_allow_cache(void) {}
          void seccomp_filter_release(void *filter) {}

          rwlock_t *ksu_policy_rwlock_ptr = NULL;
          void selinux_policy_lock(void) {}
          void selinux_policy_unlock(void) {}
          EOF

          echo "Register compat_419.o..."
          if ! grep -q 'compat_419.o' drivers/kernelsu/Makefile; then
            echo "obj-y += compat_419.o" >> drivers/kernelsu/Makefile
          fi

          rm -rf ../temp_copilote

      - name: Apply custom config
        shell: bash
        run: |
          set -euo pipefail
          cp kiev_perfect_defconfig "${{ env.KERNEL_PATH }}/arch/arm64/configs/vendor/${{ env.DEFCONFIG }}" || true

      - name: Fix KernelSU namespace issue
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ env.KERNEL_PATH }}"
          if [ -f "drivers/kernelsu/core/init.c" ]; then
            sed -i '/MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);/d' \
              drivers/kernelsu/core/init.c || true
          fi

      - name: Neutralize unsupported files for 4.19
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ env.KERNEL_PATH }}"

          if [ -f "drivers/kernelsu/feature/selinux_hide.c" ]; then
            rm -f drivers/kernelsu/feature/selinux_hide.c
            touch drivers/kernelsu/feature/selinux_hide.c
            sed -i '/selinux_hide.o/d' drivers/kernelsu/feature/Makefile || true
            sed -i '/selinux_hide.o/d' drivers/kernelsu/Makefile || true
          fi

          if [ -f "drivers/kernelsu/infra/file_wrapper.c" ]; then
            rm -f drivers/kernelsu/infra/file_wrapper.c
            touch drivers/kernelsu/infra/file_wrapper.c
            sed -i '/file_wrapper.o/d' drivers/kernelsu/infra/Makefile || true
            sed -i '/file_wrapper.o/d' drivers/kernelsu/Makefile || true
          fi

          if [ -f "drivers/kernelsu/infra/seccomp_cache.c" ]; then
            rm -f drivers/kernelsu/infra/seccomp_cache.c
            touch drivers/kernelsu/infra/seccomp_cache.c
            sed -i '/seccomp_cache.o/d' drivers/kernelsu/infra/Makefile || true
          fi

          if [ -f "drivers/kernelsu/infra/su_mount_ns.c" ]; then
            rm -f drivers/kernelsu/infra/su_mount_ns.c
            touch drivers/kernelsu/infra/su_mount_ns.c
            sed -i '/su_mount_ns.o/d' drivers/kernelsu/infra/Makefile || true
          fi

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ env.KERNEL_PATH }}"

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="clang"
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p "${{ env.BUILD_DIR }}"
          make O="${{ env.BUILD_DIR }}" vendor/${{ env.DEFCONFIG }}
          make O="${{ env.BUILD_DIR }}" -j"$(nproc)" LLVM=1 LLVM_IAS=1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-output
          path: |
            kernel_src/out/arch/arm64/boot/Image*
            kernel_src/out/arch/arm64/boot/dts/**/*.dtb
            kernel_src/out/arch/arm64/boot/dts/**/*.dtbo
