name: Kernel CI - SM8250 4.19 ReSukiSU + SuSFS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_PATH: kernel_src
  BUILD_DIR: out

  ARCH: arm64
  SUBARCH: arm64

  # IMPORTANT:
  # The file is located at:
  # arch/arm64/configs/vendor/lito-perf_defconfig
  DEFCONFIG: vendor/lito-perf_defconfig

  KERNEL_VERSION: "4.19"

  # ReSukiSU
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  RESUKISU_BRANCH: main

  # JackA1ltman
  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  # Build cache
  CCACHE_SIZE: 5G

  # Latest boot image supplied for Kiev
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

jobs:
  build:
    name: SM8250 4.19 - ReSukiSU + SuSFS
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT COPILOTE
      # ============================================================

      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            device-tree-compiler \
            python3 \
            rsync \
            unzip \
            zip \
            curl \
            wget \
            patch \
            perl

      # ============================================================
      # 3. CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-sm8250-4.19-resukisu-susfs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sm8250-4.19-resukisu-susfs-
            ${{ runner.os }}-sm8250-4.19-

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${HOME}/.cache/ccache"

          ccache --set-config=cache_dir="${HOME}/.cache/ccache"
          ccache --set-config=max_size="${CCACHE_SIZE}"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content

          ccache --show-config

      # ============================================================
      # 4. CLONE EXACT LINEAGEOS KERNEL
      # ============================================================

      - name: Clone LineageOS SM8250 kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${KERNEL_PATH}"

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "=========================================="
          echo "Kernel repository"
          echo "=========================================="

          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

      # ============================================================
      # 5. VERIFY KERNEL VERSION
      # ============================================================

      - name: Verify kernel 4.19
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          test -f Makefile

          VERSION=$(awk -F'= ' '/^VERSION = / {print $2; exit}' Makefile)
          PATCHLEVEL=$(awk -F'= ' '/^PATCHLEVEL = / {print $2; exit}' Makefile)
          SUBLEVEL=$(awk -F'= ' '/^SUBLEVEL = / {print $2; exit}' Makefile)

          KERNEL="${VERSION}.${PATCHLEVEL}"

          echo "Detected kernel: ${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          if [ "${KERNEL}" != "${KERNEL_VERSION}" ]; then
            echo "::error::Expected ${KERNEL_VERSION}, detected ${KERNEL}"
            exit 1
          fi

          echo "Kernel version verified."

      # ============================================================
      # 6. VERIFY DEFCONFIG
      # ============================================================

      - name: Verify lito-perf defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          echo "Checking:"
          echo "${DEFCONFIG_FILE}"

          if [ ! -f "${DEFCONFIG_FILE}" ]; then
            echo "::error::Defconfig not found."

            find arch/arm64/configs \
              -type f \
              -name '*lito*' \
              | sort

            exit 1
          fi

          echo "Defconfig found."

      # ============================================================
      # 7. CLONE JACKA1LTMAN TOOLKIT
      # ============================================================

      - name: Clone NonGKI_Kernel_Build_2nd
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf NonGKI_Kernel_Build_2nd

          git clone \
            --depth=1 \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            NonGKI_Kernel_Build_2nd

          echo "Available patch files:"

          find NonGKI_Kernel_Build_2nd/Patches \
            -maxdepth 2 \
            -type f \
            | sort

      # ============================================================
      # 8. CLEAN EXISTING KERNELSU
      # ============================================================

      - name: Check and clean existing KernelSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          NEED_CLEAN=0

          if [ -d KernelSU ]; then
            NEED_CLEAN=1
            echo "KernelSU directory detected."
          fi

          if grep -Rqs \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.cmd' \
            'CONFIG_KSU' \
            fs/exec.c 2>/dev/null; then

            NEED_CLEAN=1
            echo "CONFIG_KSU references detected in fs/exec.c."
          fi

          if [ "${NEED_CLEAN}" = "1" ]; then

            echo "Cleaning existing KernelSU installation."

            test -f \
              ../NonGKI_Kernel_Build_2nd/bin/clean_hook.sh

            cp \
              ../NonGKI_Kernel_Build_2nd/bin/clean_hook.sh \
              ./clean_hook.sh

            chmod +x ./clean_hook.sh

            bash ./clean_hook.sh

            rm -f ./clean_hook.sh

          else
            echo "No existing KernelSU installation detected."
          fi

      # ============================================================
      # 9. EMBED RESUKISU
      # ============================================================

      - name: Embed ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Embedding ReSukiSU."

          curl -LSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            | bash -s "${RESUKISU_BRANCH}"

          test -d KernelSU

          echo "ReSukiSU successfully embedded."

      # ============================================================
      # 10. UPDATE DEFCONFIG FOR RESUKISU
      # ============================================================

      - name: Configure ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          sed -i '/^CONFIG_KSU=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KSU_MANUAL_HOOK=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KALLSYMS=/d' "${DEFCONFIG_FILE}"
          sed -i '/^CONFIG_KALLSYMS_ALL=/d' "${DEFCONFIG_FILE}"

          cat >> "${DEFCONFIG_FILE}" <<'EOF'

          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          echo "ReSukiSU configuration:"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS)' \
            "${DEFCONFIG_FILE}"

      # ============================================================
      # 11. APPLY SUSFS INLINE HOOK
      # ============================================================

      - name: Apply SuSFS inline hook patches
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Using JackA1ltman:"
          echo "Patches/susfs_inline_hook_patches.sh"

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh \
            ./susfs_inline_hook_patches.sh

          chmod +x ./susfs_inline_hook_patches.sh

          bash ./susfs_inline_hook_patches.sh

          rm -f ./susfs_inline_hook_patches.sh

      # ============================================================
      # 12. LOCATE SUSFS 4.19 PATCH
      # ============================================================

      - name: Locate SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          PATCH_FILE="../NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_${KERNEL_VERSION}.patch"

          echo "Expected patch:"
          echo "${PATCH_FILE}"

          if [ ! -f "${PATCH_FILE}" ]; then
            echo "::error::SuSFS 4.19 patch not found."

            echo
            echo "Available patches:"

            find ../NonGKI_Kernel_Build_2nd/Patches/Patch \
              -maxdepth 1 \
              -type f \
              -iname '*susfs*' \
              | sort

            exit 1
          fi

          cp \
            "${PATCH_FILE}" \
            "./susfs_patch_to_${KERNEL_VERSION}.patch"

          ls -lh \
            "./susfs_patch_to_${KERNEL_VERSION}.patch"

      # ============================================================
      # 13. BACKUP BEFORE SUSFS PATCH
      # ============================================================

      - name: Backup kernel before SuSFS patch
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel_before_susfs

          cp -a \
            "${KERNEL_PATH}" \
            kernel_before_susfs

          echo "Kernel backup created."

      # ============================================================
      # 14. APPLY SUSFS 4.19 PATCH
      # ============================================================

      - name: Apply SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          PATCH_FILE="susfs_patch_to_${KERNEL_VERSION}.patch"

          echo "Applying:"
          echo "${PATCH_FILE}"

          patch \
            -p1 \
            < "${PATCH_FILE}" \
            || true

          echo
          echo "=========================================="
          echo "Checking rejected hunks"
          echo "=========================================="

          REJECT_COUNT=$(find . \
            -type f \
            -name '*.rej' \
            | wc -l)

          echo "Reject count: ${REJECT_COUNT}"

          if [ "${REJECT_COUNT}" -gt 0 ]; then

            echo
            echo "=========================================="
            echo "MANUAL SUSFS PATCHING REQUIRED"
            echo "=========================================="

            find . \
              -type f \
              -name '*.rej' \
              -print

            echo
            echo "Reject contents:"

            while IFS= read -r REJ; do
              echo
              echo "========== ${REJ} =========="
              cat "${REJ}"
            done < <(
              find . \
                -type f \
                -name '*.rej' \
                -print
            )

            echo
            echo "::error::SuSFS patch generated rejected hunks."
            echo "::error::Build stopped intentionally."

            exit 1
          fi

          echo
          echo "SuSFS 4.19 patch applied cleanly."

      # ============================================================
      # 15. CONFIGURE SUSFS
      # ============================================================

      - name: Configure SuSFS
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          for CONFIG in \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP
          do
            sed -i "/^${CONFIG}=.*/d" "${DEFCONFIG_FILE}"
            sed -i "/^# ${CONFIG} is not set$/d" "${DEFCONFIG_FILE}"
          done

          cat >> "${DEFCONFIG_FILE}" <<'EOF'

          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          echo "Final ReSukiSU/SuSFS defconfig:"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS)' \
            "${DEFCONFIG_FILE}" \
            | sort

      # ============================================================
      # 16. CONFIGURE KERNEL
      # ============================================================

      - name: Run lito-perf defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "../${BUILD_DIR}"
          mkdir -p "../${BUILD_DIR}"

          export ARCH="${ARCH}"
          export SUBARCH="${SUBARCH}"

          make \
            O="../${BUILD_DIR}" \
            "${DEFCONFIG}"

          test -f "../${BUILD_DIR}/.config"

          echo
          echo "Generated configuration:"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS)' \
            "../${BUILD_DIR}/.config" \
            | sort

      # ============================================================
      # 17. PREPARE LLVM BUILD
      # ============================================================

      - name: Prepare LLVM toolchain
        shell: bash
        run: |
          set -euxo pipefail

          clang --version
          ld.lld --version
          llvm-ar --version
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # 18. BUILD KERNEL
      # ============================================================

      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH="${ARCH}"
          export SUBARCH="${SUBARCH}"

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export CC="ccache clang"
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          echo "=========================================="
          echo "Building Linux ${KERNEL_VERSION}"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O="../${BUILD_DIR}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

          echo
          echo "Kernel build completed."

          ccache --show-stats

      # ============================================================
      # 19. VERIFY IMAGE
      # ============================================================

      - name: Verify kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="${KERNEL_PATH}/${BUILD_DIR}/arch/arm64/boot/Image"

          if [ ! -f "${IMAGE}" ]; then
            echo "::error::Kernel Image not found."

            find "${KERNEL_PATH}/${BUILD_DIR}/arch/arm64/boot" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

            exit 1
          fi

          ls -lh "${IMAGE}"

      # ============================================================
      # 20. DOWNLOAD KIEV BOOT 20260809
      # ============================================================

      - name: Download Kiev boot image
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p boot

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            "${BOOT_URL}" \
            -o boot/stock_boot.img

          test -s boot/stock_boot.img

          ls -lh boot/stock_boot.img

      # ============================================================
      # 21. PREPARE ARTIFACTS
      # ============================================================

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf release
          mkdir -p release

          cp \
            "${KERNEL_PATH}/${BUILD_DIR}/arch/arm64/boot/Image" \
            release/Image

          cp \
            boot/stock_boot.img \
            release/stock_boot.img

          cp \
            "${KERNEL_PATH}/${BUILD_DIR}/.config" \
            release/kernel.config

          cp \
            "${KERNEL_PATH}/arch/arm64/configs/${DEFCONFIG}" \
            release/lito-perf_defconfig

          cat > release/BUILD_INFO.txt <<EOF
          Kernel: Linux ${KERNEL_VERSION}.325
          Device: Motorola Kiev / SM8250
          Branch: ${KERNEL_BRANCH}
          Defconfig: ${DEFCONFIG}

          Root:
          ReSukiSU

          SuSFS:
          JackA1ltman NonGKI_Kernel_Build_2nd

          SuSFS patch:
          susfs_patch_to_4.19.patch

          Boot image:
          ${BOOT_URL}

          Commit:
          ${GITHUB_SHA}

          Run:
          ${GITHUB_RUN_NUMBER}
          EOF

          ls -lah release

      # ============================================================
      # 22. PACKAGE
      # ============================================================

      - name: Package kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd release

          zip -9 \
            "../ReSukiSU-SuSFS-Kiev-4.19-${GITHUB_RUN_NUMBER}.zip" \
            Image \
            stock_boot.img \
            kernel.config \
            lito-perf_defconfig \
            BUILD_INFO.txt

          cd ..

          ls -lh \
            "ReSukiSU-SuSFS-Kiev-4.19-${GITHUB_RUN_NUMBER}.zip"

      # ============================================================
      # 23. UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-SuSFS-Kiev-4.19-${{ github.run_number }}
          path: |
            release/
            ReSukiSU-SuSFS-Kiev-4.19-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 24. SUMMARY
      # ============================================================

      - name: Build summary
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo "Kernel       : Linux ${KERNEL_VERSION}.325"
          echo "Device       : Motorola Kiev / SM8250"
          echo "Branch       : ${KERNEL_BRANCH}"
          echo "Defconfig    : ${DEFCONFIG}"
          echo "Root         : ReSukiSU"
          echo "SuSFS        : enabled"

          echo
          echo "Artifacts:"
          ls -lah release/
