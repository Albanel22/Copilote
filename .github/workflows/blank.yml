name: Kernel CI — build & package

on:
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  BOOT_URL: 'https://mirrorbits.lineageos.org/full/kiev/20260726/boot.img'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex glibc-source libelf-dev libssl-dev libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang llvm lld device-tree-compiler zip unzip curl git python3

      - name: Download Stock Boot Image
        shell: bash
        run: |
          set -euo pipefail
          echo "📥 Téléchargement du boot.img d'origine..."
          curl -fLo boot-stock.img "${{ env.BOOT_URL }}" || { echo "❌ Erreur download"; exit 1; }

      - name: Clone Motorola Kernel Source
        run: |
          echo "📥 Récupération des sources du noyau..."
          git clone https://github.com/LineageOS/android_kernel_motorola_sm8250.git -b lineage-23.2 --depth=1 ${{ env.KERNEL_PATH }}

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-kernel
          restore-keys: ${{ runner.os }}-ccache-

      - name: 📂 Intégration ReSukiSU & SUSFS
        run: |
          set -e
          
          # Copie de ton defconfig personnel dans les sources clonées
          cp kiev_perfect_defconfig ${{ env.KERNEL_PATH }}/arch/arm64/configs/vendor/${{ env.DEFCONFIG }}
          
          cd ${{ env.KERNEL_PATH }}
          
          echo "🧼 Nettoyage des dossiers temporaires ou obsolètes..."
          rm -rf drivers/kernelsu kernelSU susfs4ksu || true
          
          echo "📥 Exécution du script d'installation ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          echo "✍️ Création et injection automatique de ton rules.c adapté pour le noyau 4.19..."
          mkdir -p drivers/kernelsu/selinux
          cat << 'EOF' > drivers/kernelsu/selinux/rules.c
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/rcupdate.h>
          #include "security.h"
          #include <linux/uaccess.h>
          #include <linux/types.h>
          #include <linux/version.h>
          #include <linux/lockdep.h>
          #include <linux/slab.h>
          #include <linux/string.h>

          #include "uapi/selinux.h"
          #include "klog.h"
          #include "selinux.h"
          #include "sepolicy.h"
          #include "ss/services.h"
          #include "linux/lsm_audit.h"
          #include "xfrm.h"

          #define ALL NULL

          // Verrou global de politique sous Linux 4.19
          extern struct mutex selinux_policy_lock;
          
          // Déclaration externe explicite de avc_ss_reset pour éviter l'erreur de fonction implicite
          extern int avc_ss_reset(struct selinux_avc *avc, u32 seqno);

          static void reset_avc_cache(void)
          {
            struct selinux_avc *avc = selinux_state.avc;
    
            avc_ss_reset(avc, 0);
    
            selnl_notify_policyload(0);
            selinux_status_update_policyload(&selinux_state, 0);
            selinux_xfrm_notify_policyload();
          }
          void apply_kernelsu_rules(void)
          {
              struct policydb *db;

              if (!getenforce()) {
                  pr_info("SELinux permissive or disabled, apply rules!\n");
              }

              mutex_lock(&selinux_policy_lock);

              // Accès direct au policydb global du noyau 4.19 via le sous-système de sécurité
              db = &selinux_state.ss->policydb;
              if (!db) {
                  pr_err("failed to get policydb for kernelsu rules\n");
                  goto out_unlock;
              }

              // Application directe des règles ReSukiSU sur la base active
              ksu_type(db, KERNEL_SU_DOMAIN, "domain");
              ksu_permissive(db, KERNEL_SU_DOMAIN);
              ksu_typeattribute(db, KERNEL_SU_DOMAIN, "mlstrustedsubject");
              ksu_typeattribute(db, KERNEL_SU_DOMAIN, "netdomain");
              ksu_typeattribute(db, KERNEL_SU_DOMAIN, "bluetoothdomain");

              ksu_type(db, KERNEL_SU_FILE, "file_type");
              ksu_typeattribute(db, KERNEL_SU_FILE, "mlstrustedobject");
              ksu_allow(db, "domain", KERNEL_SU_FILE, ALL, ALL);

              ksu_allow(db, KERNEL_SU_DOMAIN, ALL, ALL, ALL);

              if (db->policyvers >= POLICYDB_VERSION_XPERMS_IOCTL) {
                  ksu_allowxperm(db, KERNEL_SU_DOMAIN, ALL, "blk_file", ALL);
                  ksu_allowxperm(db, KERNEL_SU_DOMAIN, ALL, "fifo_file", ALL);
                  ksu_allowxperm(db, KERNEL_SU_DOMAIN, ALL, "chr_file", ALL);
                  ksu_allowxperm(db, KERNEL_SU_DOMAIN, ALL, "file", ALL);
              }

              ksu_allow(db, "init", KERNEL_SU_DOMAIN, ALL, ALL);

              ksu_allow(db, "servicemanager", KERNEL_SU_DOMAIN, "dir", "search");
              ksu_allow(db, "servicemanager", KERNEL_SU_DOMAIN, "dir", "read");
              ksu_allow(db, "servicemanager", KERNEL_SU_DOMAIN, "file", "open");
              ksu_allow(db, "servicemanager", KERNEL_SU_DOMAIN, "file", "read");
              ksu_allow(db, "servicemanager", KERNEL_SU_DOMAIN, "process", "getattr");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "process", "sigchld");

              ksu_allow(db, "logd", KERNEL_SU_DOMAIN, "dir", "search");
              ksu_allow(db, "logd", KERNEL_SU_DOMAIN, "file", "read");
              ksu_allow(db, "logd", KERNEL_SU_DOMAIN, "file", "open");
              ksu_allow(db, "logd", KERNEL_SU_DOMAIN, "file", "getattr");

              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "fd", "use");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "fifo_file", "write");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "fifo_file", "read");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "fifo_file", "open");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "fifo_file", "getattr");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "unix_stream_socket", "read");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "unix_stream_socket", "write");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "unix_stream_socket", "connectto");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "unix_stream_socket", "getopt");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "unix_stream_socket", "getattr");

              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "memfd_file", "execute");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "memfd_file", "getattr");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "memfd_file", "map");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "memfd_file", "read");
              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "memfd_file", "write");

              ksu_allow(db, "hwservicemanager", KERNEL_SU_DOMAIN, "dir", "search");
              ksu_allow(db, "hwservicemanager", KERNEL_SU_DOMAIN, "file", "read");
              ksu_allow(db, "hwservicemanager", KERNEL_SU_DOMAIN, "file", "open");
              ksu_allow(db, "hwservicemanager", KERNEL_SU_DOMAIN, "process", "getattr");

              ksu_allow(db, "domain", KERNEL_SU_DOMAIN, "binder", ALL);

              ksu_allow(db, "system_server", KERNEL_SU_DOMAIN, "process", "getpgid");
              ksu_allow(db, "system_server", KERNEL_SU_DOMAIN, "process", "sigkill");

              reset_avc_cache();
          out_unlock:
              mutex_unlock(&selinux_policy_lock);
          }

          #define KSU_SEPOLICY_MAX_BATCH_SIZE (8U * 1024U * 1024U)
          #define KSU_SEPOLICY_MAX_ARGS 5

          struct sepol_data {
              u32 cmd;
              u32 subcmd;
          };

          struct sepol_batch_cursor {
              const u8 *cur;
              const u8 *end;
          };

          static size_t sepol_remaining(const struct sepol_batch_cursor *cursor)
          {
              return (size_t)(cursor->end - cursor->cur);
          }

          static int sepol_read_cmd_header(struct sepol_batch_cursor *cursor, struct sepol_data *header)
          {
              if (sepol_remaining(cursor) < sizeof(*header)) {
                  return -EINVAL;
              }
              memcpy(header, cursor->cur, sizeof(*header));
              cursor->cur += sizeof(*header);
              return 0;
          }

          static int sepol_read_string(struct sepol_batch_cursor *cursor, const char **out)
          {
              u32 len;
              const char *str;

              if (sepol_remaining(cursor) < sizeof(len)) {
                  return -EINVAL;
              }
              memcpy(&len, cursor->cur, sizeof(len));
              cursor->cur += sizeof(len);

              if (len >= sepol_remaining(cursor)) {
                  return -EINVAL;
              }

              str = (const char *)cursor->cur;
              if (memchr(str, '\0', len) != NULL || str[len] != '\0') {
                  return -EINVAL;
              }

              cursor->cur += len + 1;
              if (len == 0) {
                  *out = ALL;
                  return 0;
              }

              *out = str;
              return 0;
          }

          static int sepol_require_not_all(const char *value, const char *name)
          {
              if (value != ALL) {
                  return 0;
              }
              pr_err("sepol: %s cannot be ALL.\n", name);
              return -EINVAL;
          }

          static int sepol_expected_argc(u32 cmd)
          {
              switch (cmd) {
              case KSU_SEPOLICY_CMD_NORMAL_PERM:
                  return 4;
              case KSU_SEPOLICY_CMD_XPERM:
                  return 5;
              case KSU_SEPOLICY_CMD_TYPE_STATE:
                  return 1;
              case KSU_SEPOLICY_CMD_TYPE:
              case KSU_SEPOLICY_CMD_TYPE_ATTR:
                  return 2;
              case KSU_SEPOLICY_CMD_ATTR:
                  return 1;
              case KSU_SEPOLICY_CMD_TYPE_TRANSITION:
                  return 5;
              case KSU_SEPOLICY_CMD_TYPE_CHANGE:
                  return 4;
              case KSU_SEPOLICY_CMD_GENFSCON:
                  return 3;
              default:
                  return -EINVAL;
              }
          }

          static int apply_one_sepolicy_cmd(struct policydb *db, const struct sepol_data *header, const char **args)
          {
              bool success = false;
              int ret;

              switch (header->cmd) {
              case KSU_SEPOLICY_CMD_NORMAL_PERM:
                  if (header->subcmd == KSU_SEPOLICY_SUBCMD_NORMAL_PERM_ALLOW) {
                      success = ksu_allow(db, args[0], args[1], args[2], args[3]);
                  } else if (header->subcmd == KSU_SEPOLICY_SUBCMD_NORMAL_PERM_DENY) {
                      success = ksu_deny(db, args[0], args[1], args[2], args[3]);
                  } else if (header->subcmd == KSU_SEPOLICY_SUBCMD_NORMAL_PERM_AUDITALLOW) {
                      success = ksu_auditallow(db, args[0], args[1], args[2], args[3]);
                  } else if (header->subcmd == KSU_SEPOLICY_SUBCMD_NORMAL_PERM_DONTAUDIT) {
                      success = ksu_dontaudit(db, args[0], args[1], args[2], args[3]);
                  }
                  return success ? 0 : -EINVAL;

              case KSU_SEPOLICY_CMD_XPERM:
                  ret = sepol_require_not_all(args[3], "operation");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[4], "perm_set");
                  if (ret < 0) return ret;

                  if (header->subcmd == KSU_SEPOLICY_SUBCMD_XPERM_ALLOW) {
                      success = ksu_allowxperm(db, args[0], args[1], args[2], args[4]);
                  } else if (header->subcmd == KSU_SEPOLICY_SUBCMD_XPERM_AUDITALLOW) {
                      success = ksu_auditallowxperm(db, args[0], args[1], args[2], args[4]);
                  } else if (header->subcmd == KSU_SEPOLICY_SUBCMD_XPERM_DONTAUDIT) {
                      success = ksu_dontauditxperm(db, args[0], args[1], args[2], args[4]);
                  }
                  return success ? 0 : -EINVAL;

              case KSU_SEPOLICY_CMD_TYPE_STATE:
                  ret = sepol_require_not_all(args[0], "type");
                  if (ret < 0) return ret;

                  if (header->subcmd == KSU_SEPOLICY_SUBCMD_TYPE_STATE_PERMISSIVE) {
                      success = ksu_permissive(db, args[0]);
                  } else if (header->subcmd == KSU_SEPOLICY_SUBCMD_TYPE_STATE_ENFORCE) {
                      success = ksu_enforce(db, args[0]);
                  }
                  return success ? 0 : -EINVAL;

              case KSU_SEPOLICY_CMD_TYPE:
              case KSU_SEPOLICY_CMD_TYPE_ATTR:
                  ret = sepol_require_not_all(args[0], "type");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[1], "attribute");
                  if (ret < 0) return ret;

                  if (header->cmd == KSU_SEPOLICY_CMD_TYPE) {
                      success = ksu_type(db, args[0], args[1]);
                  } else {
                      success = ksu_typeattribute(db, args[0], args[1]);
                  }
                  return success ? 0 : -EINVAL;

              case KSU_SEPOLICY_CMD_ATTR:
                  ret = sepol_require_not_all(args[0], "attribute");
                  if (ret < 0) return ret;
                  return ksu_attribute(db, args[0]) ? 0 : -EINVAL;

              case KSU_SEPOLICY_CMD_TYPE_TRANSITION:
                  ret = sepol_require_not_all(args[0], "src");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[1], "tgt");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[2], "cls");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[3], "default_type");
                  if (ret < 0) return ret;

                  success = ksu_type_transition(db, args[0], args[1], args[2], args[3], args[4]);
                  return success ? 0 : -EINVAL;

              case KSU_SEPOLICY_CMD_TYPE_CHANGE:
                  ret = sepol_require_not_all(args[0], "src");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[1], "tgt");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[2], "cls");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[3], "default_type");
                  if (ret < 0) return ret;

                  if (header->subcmd == KSU_SEPOLICY_SUBCMD_TYPE_CHANGE_CHANGE) {
                      success = ksu_type_change(db, args[0], args[1], args[2], args[3]);
                  } else if (header->subcmd == KSU_SEPOLICY_SUBCMD_TYPE_CHANGE_MEMBER) {
                      success = ksu_type_member(db, args[0], args[1], args[2], args[3]);
                  }
                  return success ? 0 : -EINVAL;

              case KSU_SEPOLICY_CMD_GENFSCON:
                  ret = sepol_require_not_all(args[0], "name");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[1], "path");
                  if (ret < 0) return ret;
                  ret = sepol_require_not_all(args[2], "context");
                  if (ret < 0) return ret;

                  return ksu_genfscon(db, args[0], args[1], args[2]) ? 0 : -EINVAL;

              default:
                  return -EINVAL;
              }
          }

          int handle_sepolicy(void __user *user_data, u64 data_len)
          {
              struct policydb *db;
              struct sepol_batch_cursor cursor;
              u8 *payload;
              int ret;
              int success_cmd_count;
              u32 cmd_index;

              if (!user_data || !data_len || data_len > KSU_SEPOLICY_MAX_BATCH_SIZE) {
                  return -EINVAL;
              }

              payload = kvmalloc((size_t)data_len, GFP_KERNEL);
              if (!payload) return -ENOMEM;

              if (copy_from_user(payload, user_data, (size_t)data_len)) {
                  ret = -EFAULT;
                  goto out_free;
              }

              mutex_lock(&selinux_policy_lock);

              db = &selinux_state.ss->policydb;
              if (!db) {
                  ret = -EINVAL;
                  goto out_unlock;
              }

              cursor.cur = payload;
              cursor.end = payload + (size_t)data_len;

              ret = 0;
              success_cmd_count = 0;
              cmd_index = 0;
              while (cursor.cur < cursor.end) {
                  struct sepol_data header;
                  const char *args[KSU_SEPOLICY_MAX_ARGS] = { 0 };
                  int expected_argc;
                  u32 arg_index;

                  if (sepol_read_cmd_header(&cursor, &header) < 0) goto out_unlock;
                  expected_argc = sepol_expected_argc(header.cmd);
                  if (expected_argc < 0 || expected_argc > KSU_SEPOLICY_MAX_ARGS) goto out_unlock;

                  for (arg_index = 0; arg_index < (u32)expected_argc; arg_index++) {
                      if (sepol_read_string(&cursor, &args[arg_index]) < 0) goto out_unlock;
                  }

                  if (apply_one_sepolicy_cmd(db, &header, args) == 0) {
                      success_cmd_count++;
                  }
                  cmd_index++;
              }

              reset_avc_cache();
              ret = success_cmd_count;

          out_unlock:
              mutex_unlock(&selinux_policy_lock);
          out_free:
              kvfree(payload);
              return ret;
          }
          EOF
          
          echo "🔨 Neutralisation radicale de TOUS les scripts de vérification des hooks..."
          find . -type f -name "*hook_check.mk" -exec sh -c 'echo "" > "$1"' _ {} \;
                  

              
      - name: 💉 Injection chirurgicale des Hooks ReSukiSU via Python
        run: |
          cd ${{ env.KERNEL_PATH }}
          echo "⚙️ Réinitialisation et injection propre des hooks..."
          git checkout drivers/input/input.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c kernel/sys.c security/selinux/selinuxfs.c security/selinux/hooks.c || true
          python3 - << 'EOF'
          import os
          def inject_code(path, target_str, code_to_insert, position="before"):
              if not os.path.exists(path):
                  print(f"❌ Fichier introuvable : {path}")
                  return
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              
              if code_to_insert in content:
                  print(f"⚠️ Déjà présent dans {path}")
                  return
              
              if target_str in content:
                  if position == "before":
                      content = content.replace(target_str, code_to_insert + "\n" + target_str, 1)
                  elif position == "after":
                      content = content.replace(target_str, target_str + "\n" + code_to_insert, 1)
                  elif position == "inside_brace":
                      idx = content.find(target_str)
                      brace_idx = content.find('{', idx)
                      if brace_idx != -1:
                          content = content[:brace_idx + 1] + "\n" + code_to_insert + "\n" + content[brace_idx + 1:]
                  
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f"✅ Injecté avec succès dans {path}")
              else:
                  print(f"❌ Cible introuvable dans {path}")

          # 1. fs/stat.c
          stat_declarations = """
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot)) 
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);
          #endif
          #endif
          """
          inject_code("fs/stat.c", "SYSCALL_DEFINE2(newlstat", stat_declarations, "before")
          inject_code("fs/stat.c", "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n\t\tstruct stat __user *, statbuf, int, flag)", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif", "inside_brace")
          inject_code("fs/stat.c", "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n\t\tstruct stat __user *, statbuf, int, flag)", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif", "inside_brace")

          # 2. fs/exec.c
          exec_declarations = """
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          #endif
          """
          inject_code("fs/exec.c", "int do_execve(struct filename *filename,", exec_declarations, "before")
          inject_code("fs/exec.c", "int do_execve(struct filename *filename,\n\tconst char __user *const __user *__argv,\n\tconst char __user *const __user *__envp)\n{\n\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n\tstruct user_arg_ptr envp = { .ptr.native = __envp };", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif", "after")
          inject_code("fs/exec.c", "static int compat_do_execve(struct filename *filename,\n\tconst compat_uptr_t __user *__argv,\n\tconst compat_uptr_t __user *__envp)\n{\n\tstruct user_arg_ptr argv = {\n\t\t.is_compat = true,\n\t\t.ptr.compat = __argv,\n\t},\n\tenvp = {\n\t\t.is_compat = true,\n\t\t.ptr.compat = __envp,\n\t};", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif", "after")

          # 3. fs/open.c
          open_declarations = """
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot)) 
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
          #endif
          """
          inject_code("fs/open.c", "long do_faccessat(int dfd, const char __user *filename, int mode)", open_declarations, "before")
          inject_code("fs/open.c", "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)", "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif", "inside_brace")

          # 4. SELinux updates & Bypass propre en fin de fichier
          if os.path.exists("security/selinux/selinuxfs.c"):
              with open("security/selinux/selinuxfs.c", "r", encoding="utf-8") as f:
                  sc = f.read()
              sc = sc.replace("static ssize_t (*write_op[])", "ssize_t (*write_op[])")
              sc = sc.replace("static const struct file_operations sel_handle_status_ops", "const struct file_operations sel_handle_status_ops")
              with open("security/selinux/selinuxfs.c", "w", encoding="utf-8") as f:
                  f.write(sc)

          if os.path.exists("security/selinux/hooks.c"):
              with open("security/selinux/hooks.c", "r", encoding="utf-8") as f:
                  hc = f.read()
              hc = hc.replace("static struct security_operations selinux_ops", "struct security_operations selinux_ops")
              
              selinux_bypass_func = """
              #ifdef CONFIG_KSU
              __attribute__((hot))
              int ksu_selinux_enforce_bypass(void) {
                  return 0;
              }
              #endif
              """
              hc = hc + "\n" + selinux_bypass_func
              
              with open("security/selinux/hooks.c", "w", encoding="utf-8") as f:
                  f.write(hc)
          print("✨ Hook faccessat officiel et correctifs SELinux injectés avec succès !")
          EOF

      - name: Fix KernelSU Namespace Error for Linux 4.19
        run: |
          cd ${{ env.KERNEL_PATH }}
          if [ -f "drivers/kernelsu/core/init.c" ]; then
            echo "🔧 Correction de MODULE_IMPORT_NS dans drivers/kernelsu/core/init.c..."
            sed -i '/MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);/d' drivers/kernelsu/core/init.c
          fi

      - name: Fix File Wrapper Incompatibilities for Linux 4.19
        run: |
          cd ${{ env.KERNEL_PATH }}
          if [ -f "drivers/kernelsu/infra/file_wrapper.c" ]; then
            echo "🔧 Neutralisation des wrappers iopoll et remap_file_range incompatibles avec le noyau 4.19..."
            
            # Neutralisation de la fonction iopoll
            sed -i 's/return orig->f_op->iopoll(kiocb, spin);/return -EINVAL;/g' drivers/kernelsu/infra/file_wrapper.c
            sed -i 's/p->ops.iopoll = .*/p->ops.iopoll = NULL;/g' drivers/kernelsu/infra/file_wrapper.c
            
            # Neutralisation de remap_file_range et REMAP_FILE_DEDUP
            sed -i 's/if (remap_flags & REMAP_FILE_DEDUP)/if (0)/g' drivers/kernelsu/infra/file_wrapper.c
            sed -i 's/return orig->f_op->remap_file_range(.*/return -EINVAL;/g' drivers/kernelsu/infra/file_wrapper.c
            sed -i 's/p->ops.remap_file_range = .*/p->ops.remap_file_range = NULL;/g' drivers/kernelsu/infra/file_wrapper.c
          fi    

      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -uo pipefail
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M ${{ env.CCACHE_SIZE }}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"
          
          echo "=================================================="
          echo "🔍 ÉTAPE DE VÉRIFICATION & CONFIGURATION KERNEL"
          echo "=================================================="

          # 1. Vérification du defconfig
          if [ -f "arch/arm64/configs/vendor/${{ env.DEFCONFIG }}" ]; then
            echo "[+] SUCCESS: Defconfig source trouvé (${{ env.DEFCONFIG }})"
          else
            echo "[-] ERROR: Defconfig source introuvable dans arch/arm64/configs/vendor/"
            exit 1
          fi

          mkdir -p ${{ env.BUILD_DIR }}
          cp arch/arm64/configs/vendor/${{ env.DEFCONFIG }} arch/arm64/configs/${{ env.DEFCONFIG }}
          
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 ${{ env.DEFCONFIG }}
          
          # 2. Injection et vérification des options ReSukiSU/SUSFS
          echo "[*] Injection des options de configuration..."
          {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_MANUAL_HOOK=y"
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_HAS_CALLBACK=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_MOUNT_UNMOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KPROBES=y"
              echo "CONFIG_HAVE_KPROBES=y"
              echo "CONFIG_KRETPROBES=y"
              echo "CONFIG_OVERLAY_FS=y"
              echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y"
              echo "CONFIG_KALLSYMS=y"
              echo "CONFIG_KALLSYMS_ALL=y"
              echo "CONFIG_SECURITY_SELINUX=y"
              echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y"
              echo "CONFIG_SECURITY_SELINUX_DISABLE=y"
          } >> ${{ env.BUILD_DIR }}/.config
          
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 olddefconfig

          # 3. Vérification de la présence des dossiers clés
          if [ -d "drivers/kernelsu" ]; then
            echo "[+] SUCCESS: Dossier drivers/kernelsu détecté."
          else
            echo "[-] ERROR: Le dossier drivers/kernelsu est manquant !"
            exit 1
          fi

          # 4. Application des correctifs 4.19 avec logs ciblés
          echo "[*] Application des patchs de compatibilité Linux 4.19..."
          if [ -f "drivers/kernelsu/core/init.c" ]; then
            sed -i '/MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);/d' drivers/kernelsu/core/init.c
            echo "[+] SUCCESS: Correction MODULE_IMPORT_NS appliquée."
          fi
          
          if [ -f "drivers/kernelsu/infra/file_wrapper.c" ]; then
            sed -i 's/return orig->f_op->iopoll(kiocb, spin);/return -EINVAL;/g' drivers/kernelsu/infra/file_wrapper.c
            sed -i 's/if (remap_flags & REMAP_FILE_DEDUP)/if (0)/g' drivers/kernelsu/infra/file_wrapper.c
            sed -i 's/return orig->f_op->remap_file_range(.*/return -EINVAL;/g' drivers/kernelsu/infra/file_wrapper.c
            sed -i '/p->ops.iopoll =/s/^/\/\//' drivers/kernelsu/infra/file_wrapper.c
            sed -i '/p->ops.remap_file_range =/s/^/\/\//' drivers/kernelsu/infra/file_wrapper.c
            echo "[+] SUCCESS: Correctifs file_wrapper.c appliqués."
          fi

          # Neutralisation des modules trop récents pour le 4.19
          if [ -f "drivers/kernelsu/infra/seccomp_cache.c" ]; then
            echo "/* Dummy seccomp_cache for Linux 4.19 */" > drivers/kernelsu/infra/seccomp_cache.c
            echo "[+] SUCCESS: seccomp_cache.c neutralisé."
          fi

          if [ -f "drivers/kernelsu/infra/su_mount_ns.c" ]; then
            echo "/* Dummy su_mount_ns for Linux 4.19 */" > drivers/kernelsu/infra/su_mount_ns.c
            echo "[+] SUCCESS: su_mount_ns.c neutralisé."
          fi

          if [ -f "drivers/kernelsu/manager/pkg_observer.c" ]; then
            echo "/* Dummy pkg_observer for Linux 4.19 */" > drivers/kernelsu/manager/pkg_observer.c
            echo "[+] SUCCESS: pkg_observer.c neutralisé."
          fi

          # Correctifs allowlist.c & app_profile.c pour 4.19
          if [ -f "drivers/kernelsu/policy/allowlist.c" ]; then
            sed -i 's/TWA_RESUME/0/g' drivers/kernelsu/policy/allowlist.c
            sed -i 's/put_task_struct(tsk);/\/\* put_task_struct(tsk); *\//g' drivers/kernelsu/policy/allowlist.c
            echo "[+] SUCCESS: Correctifs allowlist.c appliqués."
          fi

          if [ -f "drivers/kernelsu/policy/app_profile.c" ]; then
            sed -i 's/atomic_set(&current->seccomp.filter_count, 0);/\/\* atomic_set(&current->seccomp.filter_count, 0); *\//g' drivers/kernelsu/policy/app_profile.c
            echo "[+] SUCCESS: Correctif app_profile.c appliqué."
          fi

          # Fixs modules & Tactile Motorola
          sed -i 's/if (!check_version(/if (0 \&\& !check_version(/g' kernel/module.c
          printf "\n/* --- Patch Tactile --- */\n#include <linux/notifier.h>\n#include <linux/module.h>\nstatic BLOCKING_NOTIFIER_HEAD(motorola_panel_notifier_list);\nint panel_register_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_register(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_register_notifier);\nint panel_unregister_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_unregister(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_unregister_notifier);\nvoid touch_set_state(int state) { return; }\nEXPORT_SYMBOL(touch_set_state);\n" >> techpack/display/msm/msm_drv.c
          echo "[+] SUCCESS: Patch Tactile Motorola injecté."

          echo "=================================================="
          echo "🚀 LANCEMENT DE LA COMPILATION DE L'IMAGE"
          echo "=================================================="
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 KCFLAGS="$KCFLAGS" KSUD_VERSION=35005 KSU_VERSION=35005 -j$(nproc) Image --output-sync=none

          
      - name: Repack & Finalize (AnyKernel3 + Custom ksud & OverlayFS)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          
          echo "📥 Récupération d'AnyKernel3..."
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          rm -f AnyKernel3/anykernel.sh
          
          echo "📥 Téléchargement de ton binaire ksud personnalisé..."
          mkdir -p AnyKernel3/patch/system/bin
          curl -fLo AnyKernel3/patch/system/bin/ksud https://raw.githubusercontent.com/Albanel22/Copilote/main/ksud
          chmod +x AnyKernel3/patch/system/bin/ksud

          echo "✍️ Création du script anykernel.sh avec intégration native d'OverlayFS..."
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Custom Kernel avec Risukisu pour Motorola One 5G Ace
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=kiev
          device.name2=XT2113-2
          device.name3=kiev_retde
          device.name4=kiev_t
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;

          if [ -f patch/system/bin/ksud ]; then
            ui_print "⚙️ Configuration de l'environnement OverlayFS via ksud..."
            chmod 755 patch/system/bin/ksud
            ./patch/system/bin/ksud kernel setup-script
          fi

          flash_boot;

          if [ -f patch/system/bin/ksud ]; then
            mkdir -p /data/adb/ksu/bin
            cp -f patch/system/bin/ksud /data/adb/ksu/bin/ksud
            chmod 755 /data/adb/ksu/bin/ksud
          fi
          EOF
          
          sed -i 's/\r$//' AnyKernel3/anykernel.sh
          
          echo "📦 Injection de l'image du noyau brut (Image)..."
          cp ${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image AnyKernel3/Image
          
          if [ -f ${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/dtb ]; then
            cp ${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/dtb AnyKernel3/dtb
          fi

          echo "🗜️ Création de l'archive flashable finale..."
          mkdir -p final_output
          cd AnyKernel3
          zip -r9 ../final_output/AnyKernel3_Risukisu_kiev.zip * -x .git* README.md

      - name: Upload Finished Packaged Assets
        uses: actions/upload-artifact@v4
        with:
          name: kernel-motorola_anykernel3
          path: final_output/AnyKernel3_Risukisu_kiev.zip
