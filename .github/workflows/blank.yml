name: Build Kernel - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release"
        required: false
        default: false
        type: boolean

concurrency:
  group: kiev-resukisu-susfs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVICE: kiev
  ARCH: arm64

  WORKSPACE: ${{ github.workspace }}/kernel_workspace
  KERNEL_PATH: ${{ github.workspace }}/kernel_workspace/android-kernel
  BUILD_DIR: ${{ github.workspace }}/kernel_workspace/android-kernel/out

  KERNEL_SOURCE: https://github.com/Albanel22/android_kernel_motorola_sm8250.git
  KERNEL_SOURCE_BRANCH: lineage-23.2

  KERNEL_CONFIG: vendor/lito-perf_defconfig
  DEFCONFIG: lito-perf_defconfig

  KERNEL_IMAGE_NAME: Image.gz-dtb
  KERNEL_VERSION: "4.19"

  # ReSukiSU
  KSU_VARIANT: resukisu
  KSU_REF: 3b70416f
  KSU_HOOK_MODE: manual

  # SuSFS
  ENABLE_SUSFS: "true"

  # Pas de KPM
  ENABLE_KPM: "false"

  # Build
  USE_LLVM: "true"
  ENABLE_CCACHE: "true"
  CCACHE_SIZE: 5G

  # LineageOS kiev
  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img
  DTBO_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/dtbo.img

  # Dépôt officiel utilisé pour les outils Non-GKI/SuSFS
  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git


jobs:

  build:
    name: "kiev 4.19 · ReSukiSU + SuSFS"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout build repository
        uses: actions/checkout@v4


      # ============================================================
      # FREE DISK
      # ============================================================

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false


      # ============================================================
      # SWAP
      # ============================================================

      - name: Configure swap
        shell: bash
        run: |
          set -euo pipefail

          if swapon --show | grep -q .; then
            echo "Swap already enabled"
          else
            sudo fallocate -l 8G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          fi

          echo "===== MEMORY ====="
          free -h

          echo "===== SWAP ====="
          swapon --show


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            lld \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            llvm \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            zip \
            zstd

          mkdir -p "${WORKSPACE}"

          echo "===== LLVM installed ====="
          command -v clang
          clang --version | head -n 2

          echo
          echo "===== LLVM ====="
          command -v llvm-config || true
          llvm-config --version || true

          echo
          echo "===== LLD ====="
          command -v ld.lld
          ld.lld --version | head -n 2

          echo
          echo "===== GCC ====="
          command -v aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version | head -n 1


      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKSPACE }}/.ccache
          key: ccache-kiev-4.19-resukisu-${{ env.KSU_REF }}
          restore-keys: |
            ccache-kiev-4.19-resukisu-
            ccache-kiev-4.19-
            ccache-kiev-


      # ============================================================
      # FETCH KERNEL
      # ============================================================

      - name: Fetch kernel source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${KERNEL_PATH}")"

          git clone \
            --depth=1 \
            --branch "${KERNEL_SOURCE_BRANCH}" \
            "${KERNEL_SOURCE}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "===== KERNEL ====="
          git remote -v
          git log -1 --oneline

          echo
          echo "===== VERSION ====="

          test -f Makefile

          grep -E '^(VERSION|PATCHLEVEL) *=' Makefile

          VERSION="$(sed -n 's/^VERSION = *//p' Makefile | head -n1)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = *//p' Makefile | head -n1)"

          KVER="${VERSION}.${PATCHLEVEL}"

          echo "Detected kernel: ${KVER}"

          test "${KVER}" = "4.19" || {
            echo "::error::Expected kernel 4.19 but detected ${KVER}"
            exit 1
          }


      # ============================================================
      # BOOT / DTBO
      # ============================================================

      - name: Download stock boot image
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            -o "${WORKSPACE}/boot-stock.img" \
            "${BOOT_URL}"

          test -s "${WORKSPACE}/boot-stock.img"

          ls -lh "${WORKSPACE}/boot-stock.img"


      - name: Download stock DTBO
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            -o "${WORKSPACE}/dtbo.img" \
            "${DTBO_URL}"

          test -s "${WORKSPACE}/dtbo.img"

          ls -lh "${WORKSPACE}/dtbo.img"


      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: Configure build toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "===== LLVM / CLANG ====="

          CLANG="$(command -v clang)"

          test -n "${CLANG}"

          LLVM_BIN="$(dirname "$(readlink -f "${CLANG}")")"

          echo "clang      : ${CLANG}"
          echo "LLVM_BIN   : ${LLVM_BIN}"

          echo "${LLVM_BIN}" >> "${GITHUB_PATH}"
          echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"

          echo
          clang --version | head -n 3

          echo
          echo "===== LLD ====="

          command -v ld.lld
          ld.lld --version | head -n 2

          echo
          echo "===== GCC AArch64 ====="

          command -v aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version | head -n 1

          echo
          echo "===== TOOLCHAIN READY ====="

      # ============================================================
      # NON-GKI BUILD REPOSITORY
      # ============================================================

      - name: Fetch NonGKI integration tools
        shell: bash
        run: |
          set -euo pipefail

          cd "${WORKSPACE}"

          git clone \
            --depth=1 \
            "${NONGKI_REPO}" \
            NonGKI_Kernel_Build_2nd

          test -d NonGKI_Kernel_Build_2nd

          echo "===== NonGKI repository ====="

          cd NonGKI_Kernel_Build_2nd

          git log -1 --oneline

          echo
          echo "===== Required SuSFS files ====="

          test -f "bin/clean_hook.sh"

          test -f "Patches/susfs_inline_hook_patches.sh"

          test -f "Patches/Patch/susfs_patch_to_4.19.patch"

          ls -lh \
            "bin/clean_hook.sh" \
            "Patches/susfs_inline_hook_patches.sh" \
            "Patches/Patch/susfs_patch_to_4.19.patch"


      # ============================================================
      # CLEAN EXISTING KERNELSU
      # ============================================================

      - name: Check and clean existing KernelSU
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          NEED_CLEAN=false

          if [ -d "KernelSU" ] || [ -d "drivers/kernelsu" ]; then
            NEED_CLEAN=true
          fi

          if [ -f "fs/exec.c" ] &&
             grep -q "CONFIG_KSU" fs/exec.c; then
            NEED_CLEAN=true
          fi

          if [ "${NEED_CLEAN}" = "true" ]; then
            echo "Existing KernelSU installation detected."

            CLEAN_SCRIPT="${WORKSPACE}/NonGKI_Kernel_Build_2nd/bin/clean_hook.sh"

            cp "${CLEAN_SCRIPT}" .

            chmod +x clean_hook.sh

            bash clean_hook.sh

            rm -f clean_hook.sh

            echo "Existing KernelSU cleaned."
          else
            echo "No existing KernelSU installation detected."
          fi


      # ============================================================
      # RESUKISU
      # ============================================================

      - name: Integrate ReSukiSU
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          echo "===== ReSukiSU ====="
          echo "Ref: ${KSU_REF}"

          curl -fLSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            -o setup-resukisu.sh

          chmod +x setup-resukisu.sh

          bash setup-resukisu.sh "${KSU_REF}"

          rm -f setup-resukisu.sh

          echo
          echo "===== Verify ReSukiSU ====="

          test -d KernelSU || {
            echo "::error::KernelSU directory was not created."
            exit 1
          }

          find KernelSU \
            -maxdepth 2 \
            -type f \
            | head -n 30


      # ============================================================
      # DEFCONFIG - KSU
      # ============================================================

      - name: Enable KernelSU configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          CONFIG_FILE="arch/arm64/configs/${KERNEL_CONFIG}"

          test -f "${CONFIG_FILE}" || {
            echo "::error::Defconfig not found: ${CONFIG_FILE}"
            exit 1
          }

          cp "${CONFIG_FILE}" "${CONFIG_FILE}.bak"

          {
            echo
            echo "# ============================================================"
            echo "# ReSukiSU"
            echo "# ============================================================"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> "${CONFIG_FILE}"

          echo "===== KernelSU config ====="

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=)' \
            "${CONFIG_FILE}"


      # ============================================================
      # SUSFS 4.19 PATCH
      # IMPORTANT:
      # Apply the main SuSFS kernel patch BEFORE the inline hook
      # script. This prevents task_mmu.c / namespace.c from being
      # modified twice before the main patch is evaluated.
      # ============================================================

      - name: Apply SuSFS 4.19 patch
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          PATCH_FILE="${WORKSPACE}/NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch"

          test -f "${PATCH_FILE}" || {
            echo "::error::SuSFS 4.19 patch not found:"
            echo "${PATCH_FILE}"
            exit 1
          }

          echo "===== Source state before SuSFS patch ====="

          git status --short

          echo
          echo "Checking for stale reject/original files..."

          if find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            -print \
            | grep -q .; then

            echo "::error::Stale .rej/.orig files found before patch."
            find . \
              -type f \
              \( -name '*.rej' -o -name '*.orig' \) \
              -print

            exit 1
          fi

          cp -a "${KERNEL_PATH}" \
            "${WORKSPACE}/kernel-before-susfs"

          cp "${PATCH_FILE}" .

          echo
          echo "===== Applying official NonGKI SuSFS 4.19 patch ====="

          set +e

          patch \
            --batch \
            --forward \
            -p1 \
            < susfs_patch_to_4.19.patch

          PATCH_STATUS=$?

          set -e

          echo
          echo "patch exit code: ${PATCH_STATUS}"

          REJECTS="$(find . -type f -name '*.rej' -print)"

          if [ -n "${REJECTS}" ]; then

            echo "::error::SuSFS produced rejected hunks."

            echo
            echo "===== REJECTED FILES ====="
            echo "${REJECTS}"

            echo
            echo "===== REJECT CONTENT ====="

            while IFS= read -r rej; do
              echo
              echo "----- ${rej} -----"
              cat "${rej}"
            done <<< "${REJECTS}"

            exit 1
          fi

          if [ "${PATCH_STATUS}" -ne 0 ]; then
            echo "::error::SuSFS 4.19 patch failed."
            exit "${PATCH_STATUS}"
          fi

          rm -f susfs_patch_to_4.19.patch

          echo
          echo "===== SuSFS 4.19 patch applied successfully ====="


      # ============================================================
      # SUSFS INLINE HOOKS
      # ============================================================

      - name: Apply SuSFS inline hook patches
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          SCRIPT="${WORKSPACE}/NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh"

          test -f "${SCRIPT}" || {
            echo "::error::susfs_inline_hook_patches.sh not found."
            exit 1
          }

          cp "${SCRIPT}" .

          chmod +x susfs_inline_hook_patches.sh

          echo "===== Applying SuSFS inline hook patches ====="

          bash susfs_inline_hook_patches.sh

          rm -f susfs_inline_hook_patches.sh

          echo
          echo "===== Inline hooks complete ====="

          echo
          echo "===== Reject check ====="

          if find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            -print \
            | grep -q .; then

            echo "::error::Inline hook script produced rejected/original files."

            find . \
              -type f \
              \( -name '*.rej' -o -name '*.orig' \) \
              -print

            exit 1
          fi


      # ============================================================
      # SUSFS CONFIG
      # ============================================================

      - name: Enable SuSFS configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          CONFIG_FILE="arch/arm64/configs/${KERNEL_CONFIG}"

          test -f "${CONFIG_FILE}" || {
            echo "::error::Defconfig not found: ${CONFIG_FILE}"
            exit 1
          }

          cat >> "${CONFIG_FILE}" <<'EOF'

          # ============================================================
          # SuSFS
          # ============================================================
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          echo "===== SuSFS configuration ====="

          grep -E \
            '^CONFIG_KSU_SUSFS' \
            "${CONFIG_FILE}"


      # ============================================================
      # VERIFY SOURCE BEFORE BUILD
      # ============================================================

      - name: Verify KernelSU and SuSFS integration
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_PATH}"

          echo "===== KernelSU ====="

          test -d KernelSU

          grep -R \
            "CONFIG_KSU" \
            KernelSU \
            --include='Kconfig*' \
            --include='*.c' \
            --include='*.h' \
            | head -n 30 || true

          echo
          echo "===== SuSFS source files ====="

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          echo "fs/susfs.c:"
          ls -lh fs/susfs.c

          echo
          echo "include/linux/susfs.h:"
          ls -lh include/linux/susfs.h

          echo
          echo "include/linux/susfs_def.h:"
          ls -lh include/linux/susfs_def.h

          echo
          echo "===== SuSFS references ====="

          grep -R \
            "CONFIG_KSU_SUSFS" \
            fs \
            include/linux \
            kernel \
            mm \
            security \
            --include='*.c' \
            --include='*.h' \
            | head -n 100 || true

          echo
          echo "===== Reject files ====="

          if find . \
            -type f \
            \( -name '*.rej' -o -name '*.orig' \) \
            -print \
            | grep -q .; then

            echo "::error::Rejected/original patch files remain."

            find . \
              -type f \
              \( -name '*.rej' -o -name '*.orig' \) \
              -print

            exit 1
          fi


      # ============================================================
      # CCACHE
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          export CCACHE_DIR="${WORKSPACE}/.ccache"

          mkdir -p "${CCACHE_DIR}"

          ccache -M "${CCACHE_SIZE}"
          ccache -z

          echo "CCACHE_DIR=${CCACHE_DIR}"


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build kernel
        shell: bash
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -euo pipefail

          export ARCH="${ARCH}"
          export SUBARCH="${ARCH}"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export CCACHE_DIR="${WORKSPACE}/.ccache"
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          export KCFLAGS="-Wno-error"

          export LLVM=1
          export LLVM_IAS=1

          mkdir -p "${BUILD_DIR}"

          echo "===== Toolchain ====="

          command -v clang
          clang --version | head -n 2

          command -v ld.lld || true
          command -v aarch64-linux-gnu-gcc

          echo
          echo "===== Generate defconfig ====="

          make \
            O="${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            "${DEFCONFIG}"

          echo
          echo "===== Verify generated .config ====="

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=|CONFIG_KSU_SUSFS)' \
            "${BUILD_DIR}/.config" \
            || true

          echo
          echo "===== Kernel build ====="

          make \
            -j"$(nproc)" \
            O="${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            KCFLAGS="${KCFLAGS}"


      # ============================================================
      # VERIFY IMAGE
      # ============================================================

      - name: Verify kernel image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${BUILD_DIR}/arch/${ARCH}/boot/${KERNEL_IMAGE_NAME}"

          test -f "${IMAGE}" || {
            echo "::error::Kernel image not found:"
            echo "${IMAGE}"

            find "${BUILD_DIR}/arch/${ARCH}/boot" \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          }

          echo "===== Kernel image ====="

          ls -lh "${IMAGE}"

          file "${IMAGE}"


      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kiev-4.19-ReSukiSU-SuSFS-${{ github.run_number }}
          path: ${{ env.BUILD_DIR }}/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
          if-no-files-found: error
          compression-level: 0


      - name: Upload DTBO
        uses: actions/upload-artifact@v4
        with:
          name: kiev-dtbo-${{ github.run_number }}
          path: ${{ env.WORKSPACE }}/dtbo.img
          if-no-files-found: error
          compression-level: 0


      # ============================================================
      # DIAGNOSTIC ARTIFACT
      # ============================================================

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-integration-diagnostics-${{ github.run_number }}
          path: |
            ${{ env.KERNEL_PATH }}/**/*.rej
            ${{ env.KERNEL_PATH }}/**/*.orig
            ${{ env.KERNEL_PATH }}/.config
            ${{ env.KERNEL_PATH }}/Makefile
          if-no-files-found: ignore
          compression-level: 0


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## kiev Kernel Build"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Device | kiev |"
            echo "| Kernel | 4.19 |"
            echo "| Branch | lineage-23.2 |"
            echo "| Defconfig | vendor/lito-perf_defconfig |"
            echo "| KernelSU | ReSukiSU |"
            echo "| ReSukiSU ref | ${KSU_REF} |"
            echo "| Hook | SuSFS inline |"
            echo "| SuSFS | enabled |"
            echo "| Image | Image.gz-dtb |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

