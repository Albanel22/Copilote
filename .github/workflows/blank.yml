name: Kernel CI - ReSukiSU + SuSFS 4.19

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm8250.git
  KERNEL_BRANCH: lineage-23.2

  KERNEL_PATH: kernel_src
  BUILD_DIR: out

  ARCH: arm64
  DEFCONFIG: vendor/lito-perf_defconfig

  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline

  BOOT_URL: https://mirrorbits.lineageos.org/full/kiev/20260809/boot.img

  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh


jobs:

  build:
    name: Build ReSukiSU + SuSFS 4.19
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # CHECKOUT WORKFLOW REPOSITORY
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lld \
            llvm \
            patch \
            perl \
            python3 \
            rsync \
            curl \
            wget \
            unzip \
            zip \
            lz4 \
            device-tree-compiler


      # ==========================================================
      # CCACHE
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-sm8250-4.19-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-sm8250-4.19-

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ~/.cache/ccache

          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats


      # ==========================================================
      # CLONE LINEAGEOS KERNEL
      # ==========================================================

      - name: Clone LineageOS kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${KERNEL_PATH}"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_PATH}"

          cd "${KERNEL_PATH}"

          echo "=========================================="
          echo "Kernel information"
          echo "=========================================="

          git branch --show-current
          git rev-parse HEAD

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile


      # ==========================================================
      # VERIFY LINUX VERSION
      # ==========================================================

      - name: Verify Linux 4.19
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(
            awk -F'= ' '/^VERSION = / {
              print $2
              exit
            }' Makefile
          )"

          PATCHLEVEL="$(
            awk -F'= ' '/^PATCHLEVEL = / {
              print $2
              exit
            }' Makefile
          )"

          echo "Detected kernel: ${VERSION}.${PATCHLEVEL}"

          if [ "${VERSION}.${PATCHLEVEL}" != "4.19" ]; then
            echo "::error::Expected Linux 4.19"
            exit 1
          fi


      # ==========================================================
      # VERIFY DEFCONFIG
      # ==========================================================

      - name: Verify defconfig
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "Defconfig found:"
          echo "arch/arm64/configs/${DEFCONFIG}"


      # ==========================================================
      # CLONE JACKA1LTMAN
      # ==========================================================

      - name: Clone JackA1ltman tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf NonGKI_Kernel_Build_2nd

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${NONGKI_BRANCH}" \
            "${NONGKI_REPO}" \
            NonGKI_Kernel_Build_2nd

          test -f \
            NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh

          test -f \
            NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch


      # ==========================================================
      # EMBED CURRENT RESUKISU
      # ==========================================================

      - name: Embed current ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL \
            "${RESUKISU_SETUP}" \
            -o setup.sh

          chmod +x setup.sh

          bash ./setup.sh

          rm -f setup.sh

          test -d KernelSU
          test -L drivers/kernelsu

          echo
          echo "ReSukiSU commit:"
          git -C KernelSU rev-parse HEAD


      # ==========================================================
      # ENABLE MANUAL HOOK
      # ==========================================================

      - name: Enable ReSukiSU Manual Hook
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          sed -i \
            '/^CONFIG_KSU=/d' \
            "${DEFCONFIG_FILE}"

          sed -i \
            '/^CONFIG_KSU_MANUAL_HOOK=/d' \
            "${DEFCONFIG_FILE}"

          sed -i \
            '/^CONFIG_KALLSYMS=/d' \
            "${DEFCONFIG_FILE}"

          sed -i \
            '/^CONFIG_KALLSYMS_ALL=/d' \
            "${DEFCONFIG_FILE}"

          cat >> "${DEFCONFIG_FILE}" <<'EOF'

          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          echo "Manual Hook configuration added."


      # ==========================================================
      # JACKA1LTMAN INLINE HOOK PATCHES
      # ==========================================================

      - name: Apply SuSFS inline hooks
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/susfs_inline_hook_patches.sh \
            ./susfs_inline_hook_patches.sh

          chmod +x ./susfs_inline_hook_patches.sh

          echo "=========================================="
          echo "Applying JackA1ltman inline hooks"
          echo "=========================================="

          bash ./susfs_inline_hook_patches.sh

          rm -f ./susfs_inline_hook_patches.sh


      # ==========================================================
      # FIX REQUIRED RESUKISU STAT HOOK
      # ==========================================================

      - name: Integrate missing newfstat return hook
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("fs/stat.c")
          text = path.read_text()

          declaration = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
                                     const char __user **filename_user,
                                     int *flags);

          extern void ksu_handle_newfstat_ret(
              unsigned int *fd,
              struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd,
              struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          '''

          # ------------------------------------------------------
          # Add ReSukiSU declarations if absent
          # ------------------------------------------------------

          if "ksu_handle_newfstat_ret" not in text:

              marker = "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: stat.c: newfstatat declaration anchor not found"
                  )

              text = text.replace(
                  marker,
                  declaration + marker,
                  1
              )

          # ------------------------------------------------------
          # Add newfstat return hook
          # ------------------------------------------------------

          old = """SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
          {
              struct kstat stat;
              int error = vfs_fstat(fd, &stat);

              if (!error)
                  error = cp_new_stat(&stat, statbuf);

              return error;
          }"""

          new = """SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
          {
              struct kstat stat;
              int error = vfs_fstat(fd, &stat);

              if (!error)
                  error = cp_new_stat(&stat, statbuf);

          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif

              return error;
          }"""

          if "ksu_handle_newfstat_ret(&fd, &statbuf);" not in text:

              if old not in text:
                  raise SystemExit(
                      "ERROR: stat.c: newfstat function does not match expected 4.19 source"
                  )

              text = text.replace(old, new, 1)

          path.write_text(text)

          PY


      # ==========================================================
      # VERIFY REQUIRED RESUKISU HOOKS IN SOURCES
      # ==========================================================

      - name: Verify ReSukiSU hooks
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking ReSukiSU Manual Hooks"
          echo "=========================================="

          REQUIRED_HOOKS=(
            "ksu_handle_execveat"
            "ksu_handle_faccessat"
            "ksu_handle_stat"
            "ksu_handle_newfstat_ret"
          )

          for HOOK in "${REQUIRED_HOOKS[@]}"; do

            if ! grep -R \
              -q \
              "${HOOK}" \
              fs \
              kernel \
              drivers \
              --include='*.c' \
              --include='*.h'; then

              echo "::error::Missing ReSukiSU hook: ${HOOK}"
              exit 1
            fi

            echo "PASS: ${HOOK}"

          done


      # ==========================================================
      # APPLY SUSFS 4.19 PATCH
      # ==========================================================

      - name: Apply SuSFS 4.19 patch
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set +e

          cp \
            ../NonGKI_Kernel_Build_2nd/Patches/Patch/susfs_patch_to_4.19.patch \
            ./susfs_patch_to_4.19.patch

          patch \
            -p1 \
            < ./susfs_patch_to_4.19.patch

          PATCH_STATUS=$?

          echo "Patch exit code: ${PATCH_STATUS}"

          # Known 4.19 layout differences are adapted in the next step.
          exit 0


      # ==========================================================
      # ADAPT SUSFS 4.19
      # ==========================================================

      - name: Adapt SuSFS rejected 4.19 hunks
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          # ======================================================
          # fs/namespace.c
          # ======================================================

          path = Path("fs/namespace.c")
          text = path.read_text()

          if "linux/susfs_def.h" not in text:

              anchor = "#include <linux/sched/task.h>\n"

              if anchor not in text:
                  raise SystemExit(
                      "namespace.c: sched/task include anchor not found"
                  )

              text = text.replace(
                  anchor,
                  anchor +
                  """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          #include <linux/susfs_def.h>
          #endif
          """,
                  1
              )

          # ======================================================
          # fs/proc/task_mmu.c
          # ======================================================

          path = Path("fs/proc/task_mmu.c")
          text = path.read_text()

          if "SUSFS_IS_INODE_SUS_MAP" not in text:

              anchor = """		ret = mmap_read_lock_killable(mm);
          if (ret)
              goto out_free;
          """

              if anchor not in text:
                  raise SystemExit(
                      "task_mmu.c: mmap lock anchor not found"
                  )

              hook = """#ifdef CONFIG_KSU_SUSFS_SUS_MAP
          	{
          		struct vm_area_struct *vma;

          		vma = find_vma(mm, start_vaddr);

          		if (vma &&
          		    vma->vm_file &&
          		    SUSFS_IS_INODE_SUS_MAP(
          		        file_inode(vma->vm_file)))
          			goto bypass_orig_flow;
          	}
          #endif
          """

              text = text.replace(
                  anchor,
                  anchor + hook,
                  1
              )

              walk_anchor = """		ret = walk_page_range(start_vaddr, end, &pagemap_walk);
          	mmap_read_unlock(mm);
          """

              if walk_anchor not in text:
                  raise SystemExit(
                      "task_mmu.c: walk_page_range anchor not found"
                  )

              replacement = """		ret = walk_page_range(start_vaddr, end, &pagemap_walk);

          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          bypass_orig_flow:
          #endif

          	mmap_read_unlock(mm);
          """

              text = text.replace(
                  walk_anchor,
                  replacement,
                  1
              )

          path.write_text(text)

          PY


      # ==========================================================
      # REMOVE PATCH REJECT FILES ONLY AFTER ADAPTATION
      # ==========================================================

      - name: Check SuSFS rejects
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          REJECTS="$(
            find . \
              -type f \
              -name '*.rej' \
              | wc -l
          )"

          echo "Rejected hunks: ${REJECTS}"

          if [ "${REJECTS}" -gt 0 ]; then

            echo "::error::SuSFS still has rejected hunks."

            find . \
              -type f \
              -name '*.rej' \
              -print

            echo
            echo "Reject contents:"

            while IFS= read -r REJ; do
              echo
              echo "========== ${REJ} =========="
              cat "${REJ}"
            done < <(
              find . \
                -type f \
                -name '*.rej'
            )

            exit 1
          fi

          find . \
            -type f \
            -name '*.orig' \
            -delete

          echo "SuSFS patch: PASS"


      # ==========================================================
      # GENERATE CONFIG
      # ==========================================================

      - name: Generate kernel configuration
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "../${BUILD_DIR}"

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            "${DEFCONFIG}"

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            olddefconfig


      # ==========================================================
      # VERIFY CONFIG
      # ==========================================================

      - name: Verify kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${BUILD_DIR}/.config"

          test -f "${CONFIG}"

          REQUIRED_CONFIGS=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KALLSYMS
            CONFIG_KALLSYMS_ALL
          )

          echo "=========================================="
          echo "ReSukiSU configuration"
          echo "=========================================="

          for CONFIG_NAME in "${REQUIRED_CONFIGS[@]}"; do

            if ! grep -q "^${CONFIG_NAME}=y$" "${CONFIG}"; then
              echo "::error::${CONFIG_NAME} is not enabled"
              exit 1
            fi

            echo "PASS: ${CONFIG_NAME}=y"

          done


      # ==========================================================
      # VERIFY SUSFS CONFIG
      # ==========================================================

      - name: Verify SuSFS configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${BUILD_DIR}/.config"

          REQUIRED_SUSFS_CONFIGS=(
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )

          echo "=========================================="
          echo "SuSFS configuration"
          echo "=========================================="

          for CONFIG_NAME in "${REQUIRED_SUSFS_CONFIGS[@]}"; do

            if ! grep -q "^${CONFIG_NAME}=y$" "${CONFIG}"; then
              echo "::error::${CONFIG_NAME} is not enabled"
              exit 1
            fi

            echo "PASS: ${CONFIG_NAME}=y"

          done


      # ==========================================================
      # FINAL MANUAL HOOK CHECK
      # ==========================================================

      - name: ReSukiSU manual hook preflight
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ReSukiSU Manual Hook preflight"
          echo "=========================================="

          grep -R \
            -n \
            "ksu_handle_newfstat_ret" \
            fs/stat.c

          grep -R \
            -n \
            "ksu_handle_stat" \
            fs/stat.c

          grep -R \
            -n \
            "ksu_handle_faccessat" \
            fs/open.c

          grep -R \
            -n \
            "ksu_handle_execveat" \
            fs/exec.c

          echo
          echo "Manual Hook source integration: PASS"


      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build kernel
        working-directory: ${{ env.KERNEL_PATH }}
        shell: bash
        env:
          CC: clang
          HOSTCC: clang
          CROSS_COMPILE: aarch64-linux-gnu-
          CLANG_TRIPLE: aarch64-linux-gnu-
        run: |
          set -euxo pipefail

          make \
            O="../${BUILD_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            -j"$(nproc)"


      # ==========================================================
      # COLLECT KERNEL
      # ==========================================================

      - name: Collect kernel artifacts
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts/kernel

          find "${BUILD_DIR}/arch/arm64/boot" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          for FILE in \
            "${BUILD_DIR}/arch/arm64/boot/Image" \
            "${BUILD_DIR}/arch/arm64/boot/Image.gz" \
            "${BUILD_DIR}/arch/arm64/boot/Image.gz-dtb" \
            "${BUILD_DIR}/arch/arm64/boot/dt.img" \
            "${BUILD_DIR}/arch/arm64/boot/dtb.img"; do

            if [ -f "${FILE}" ]; then
              cp "${FILE}" artifacts/kernel/
            fi

          done

          cp \
            "${BUILD_DIR}/.config" \
            artifacts/kernel/kernel.config

          {
            echo "Kernel repository: ${KERNEL_REPO}"
            echo "Kernel branch: ${KERNEL_BRANCH}"
            echo
            echo "Kernel commit:"
            git -C "${KERNEL_PATH}" rev-parse HEAD
            echo
            echo "ReSukiSU commit:"
            git -C "${KERNEL_PATH}/KernelSU" rev-parse HEAD
          } > artifacts/kernel/BUILD_INFO.txt


      # ==========================================================
      # DOWNLOAD STOCK BOOT
      # ==========================================================

      - name: Download stock boot image
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts/boot

          curl -fL \
            "${BOOT_URL}" \
            -o artifacts/boot/boot-stock-kiev-20260809.img

          file \
            artifacts/boot/boot-stock-kiev-20260809.img


      # ==========================================================
      # FAILURE DIAGNOSTICS
      # ==========================================================

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p artifacts/diagnostic

          if [ -d "${KERNEL_PATH}" ]; then

            find "${KERNEL_PATH}" \
              -type f \
              \( \
                -name '*.rej' \
                -o \
                -name '*.orig' \
              \) \
              -print \
              > artifacts/diagnostic/rejects.txt

            git -C "${KERNEL_PATH}" diff \
              > artifacts/diagnostic/kernel.diff

            grep -R \
              -n \
              -E \
              'KSU|MANUAL_HOOK|manual_hook|newfstat' \
              "${KERNEL_PATH}/KernelSU/kernel" \
              > artifacts/diagnostic/ksu-hooks.txt \
              2>/dev/null

            if [ -f "${BUILD_DIR}/.config" ]; then
              cp \
                "${BUILD_DIR}/.config" \
                artifacts/diagnostic/kernel.config
            fi

          fi


      # ==========================================================
      # UPLOAD SUCCESS
      # ==========================================================

      - name: Upload successful build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-resukisu-susfs-4.19-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # UPLOAD FAILURE DIAGNOSTICS
      # ==========================================================

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kiev-resukisu-susfs-diagnostics-${{ github.run_number }}
          path: artifacts/diagnostic/
          if-no-files-found: warn
          retention-days: 14
